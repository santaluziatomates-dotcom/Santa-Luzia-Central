<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Luzia ID</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #c62828;
    }

    header h1 {
      margin: 0;
      color: #c62828;
    }

    header p {
      margin: 6px 0 0;
      color: #555;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .codigo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #16803c;
      margin-bottom: 20px;
    }

    .info {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 13px;
      color: #777;
    }

    .valor {
      font-size: 17px;
      font-weight: bold;
      margin-top: 3px;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #c62828;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍅 Santa Luzia ID</h1>
    <p>Identificação oficial do motorista</p>
  </header>

  <div class="container">

    <div class="card">

      <div class="codigo">
        SL-0004
      </div>

      <div class="info">
        <div class="label">Nome</div>
        <div class="valor">Motorista Teste</div>
      </div>

      <div class="info">
        <div class="label">Apelido</div>
        <div class="valor">Teste</div>
      </div>

      <div class="info">
        <div class="label">Cargo</div>
        <div class="valor">Motorista</div>
      </div>

      <div class="info">
        <div class="label">Categoria CNH</div>
        <div class="valor">D</div>
      </div>

      <div class="info">
        <div class="label">Nível</div>
        <div class="valor">1</div>
      </div>

      <div class="info">
        <div class="label">XP</div>
        <div class="valor">0 XP</div>
      </div>

      <div class="info">
        <div class="label">Status</div>
        <div class="valor">🟢 Ativo</div>
      </div>

    </div>

    <a class="voltar" href="index.html">← Voltar para Santa Luzia Central</a>

  </div>

</body>
</html>
