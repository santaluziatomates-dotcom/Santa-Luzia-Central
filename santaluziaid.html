<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Santa Luzia ID</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #222;
    }

    header {
      background: white;
      padding: 24px 15px;
      text-align: center;
      border-bottom: 4px solid #c62828;
    }

    header h1 {
      margin: 0;
      color: #c62828;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #666;
      font-size: 14px;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .titulo-consulta {
      margin: 0 0 14px;
      font-size: 18px;
      color: #16803c;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: #16803c;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #16803c;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .perfil {
      margin-top: 25px;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      overflow: hidden;
    }

    .perfil-topo {
      background: linear-gradient(135deg, #16803c, #0f5e2c);
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    .perfil-topo small {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .codigo {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .perfil-corpo {
      padding: 20px;
      background: white;
    }

    .nome {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 0;
      color: #222;
    }

    .apelido {
      text-align: center;
      color: #777;
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .titulo-nivel {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #16803c;
      margin-bottom: 22px;
    }

    .dados {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info {
      background: #f5f7f6;
      border-radius: 12px;
      padding: 13px;
      border-left: 4px solid #16803c;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #777;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      word-break: break-word;
    }

    .progresso-area {
      margin-top: 20px;
      padding: 15px;
      background: #f5f7f6;
      border-radius: 12px;
    }

    .progresso-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .progresso-titulo {
      font-size: 13px;
      font-weight: bold;
      color: #555;
    }

    .progresso-xp {
      font-size: 13px;
      font-weight: bold;
      color: #16803c;
    }

    .barra {
      width: 100%;
      height: 10px;
      background: #dfe5e1;
      border-radius: 20px;
      overflow: hidden;
    }

    .barra-preenchida {
      width: 0%;
      height: 100%;
      background: #16803c;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      background: #e8f5e9;
      color: #16803c;
      font-weight: bold;
      font-size: 14px;
    }

    /* =========================
       MISSÕES
    ========================= */

    .missoes-area {
      margin-top: 25px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .missoes-titulo {
      margin: 0;
      text-align: center;
      color: #16803c;
      font-size: 20px;
    }

    .missoes-subtitulo {
      margin: 7px 0 18px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .missao {
      background: #f5f7f6;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #16803c;
    }

    .missao:last-child {
      margin-bottom: 0;
    }

    .missao-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .missao-nome {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      line-height: 1.3;
    }

    .missao-xp {
      flex-shrink: 0;
      background: #16803c;
      color: white;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .missao-descricao {
      margin: 8px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    .carregando-missoes {
      text-align: center;
      color: #16803c;
      font-weight: bold;
      font-size: 13px;
      padding: 15px 0;
    }

    .erro-missoes {
      text-align: center;
      color: #c62828;
      font-weight: bold;
      font-size: 13px;
      padding: 10px 0;
    }

    .rodape-perfil {
      margin-top: 18px;
      text-align: center;
      color: #999;
      font-size: 11px;
    }

    .mensagem {
      text-align: center;
      margin-top: 18px;
      color: #c62828;
      font-weight: bold;
      font-size: 14px;
    }

    .carregando {
      text-align: center;
      margin-top: 20px;
      color: #16803c;
      font-weight: bold;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #c62828;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .voltar:hover {
      text-decoration: underline;
    }

    @media (max-width: 380px) {

      .dados {
        grid-template-columns: 1fr;
      }

      .codigo {
        font-size: 29px;
      }

      .nome {
        font-size: 21px;
      }

      .missao-topo {
        flex-direction: column;
      }

      .missao-xp {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🍅 Santa Luzia ID</h1>
    <p>Identificação oficial dos motoristas</p>
  </header>

  <div class="container">

    <div class="card">

      <h2 class="titulo-consulta">
        Consultar motorista
      </h2>

      <input
        type="text"
        id="codigo"
        placeholder="Digite o ID. Ex: SL-0004"
        value="SL-0004"
      >

      <button onclick="buscarMotorista()">
        CONSULTAR MOTORISTA
      </button>

      <div id="resultado"></div>

    </div>

    <!-- MISSÕES -->
    <div class="missoes-area">

      <h2 class="missoes-titulo">
        🎯 Missões Santa Luzia
      </h2>

      <p class="missoes-subtitulo">
        Complete missões e conquiste XP para evoluir seu nível.
      </p>

      <div id="listaMissoes">
        <div class="carregando-missoes">
          Carregando missões...
        </div>
      </div>

    </div>

    <a class="voltar" href="index.html">
      ← Voltar para Santa Luzia Central
    </a>

  </div>

  <script>

    const SUPABASE_URL =
      "https://cckypvqophyviphqhich.supabase.co";

    /*
      MANTENHA A SUA SUPABASE_KEY ATUAL AQUI.
      Não coloque uma service_role key.
    */
    const SUPABASE_KEY =
      "sb_publishable_M_6iIpO4FhNhxskWG0XXrA_Uwuw_bbP";

    function nomeDoNivel(nivel) {

      const niveis = {
        1: "🟢 Recruta",
        2: "🚛 Motorista",
        3: "⭐ Motorista Oficial",
        4: "🏅 Sênior",
        5: "🔥 Elite",
        6: "👑 Lenda"
      };

      return niveis[nivel] || "🚛 Motorista";
    }

    async function buscarMotorista() {

      const codigo = document
        .getElementById("codigo")
        .value
        .trim()
        .toUpperCase();

      const resultado =
        document.getElementById("resultado");

      if (!codigo) {

        resultado.innerHTML =
          '<div class="mensagem">Digite um ID.</div>';

        return;
      }

      resultado.innerHTML =
        '<div class="carregando">Consultando motorista...</div>';

      try {

        const resposta = await fetch(
          `${SUPABASE_URL}/rest/v1/motoristas?codigo=eq.${encodeURIComponent(codigo)}&select=*`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!resposta.ok) {
          throw new Error("Erro ao consultar o banco.");
        }

        const motoristas =
          await resposta.json();

        if (motoristas.length === 0) {

          resultado.innerHTML =
            '<div class="mensagem">Motorista não encontrado.</div>';

          return;
        }

        const motorista =
          motoristas[0];

        const nivel =
          Number(motorista["nível"] || 1);

        const xp =
          Number(motorista.xp || 0);

        const xpNecessario = 100;

        const progresso =
          Math.min(
            (xp / xpNecessario) * 100,
            100
          );

        const tituloNivel =
          nomeDoNivel(nivel);

        const statusAtivo =
          String(motorista.status).toLowerCase() === "ativo";

        resultado.innerHTML = `

          <div class="perfil">

            <div class="perfil-topo">

              <small>
                IDENTIFICAÇÃO OFICIAL
              </small>

              <div class="codigo">
                ${motorista.codigo}
              </div>

            </div>

            <div class="perfil-corpo">

              <h2 class="nome">
                ${motorista.nome || "-"}
              </h2>

              <div class="apelido">
                ${motorista.apelido || "-"}
              </div>

              <div class="titulo-nivel">
                ${tituloNivel} • Nível ${nivel}
              </div>

              <div class="dados">

                <div class="info">

                  <span class="label">
                    Cargo
                  </span>

                  <span class="valor">
                    ${motorista.cargo || "-"}
                  </span>

                </div>

                <div class="info">

                  <span class="label">
                    Categoria CNH
                  </span>

                  <span class="valor">
                    ${motorista.categoria || "-"}
                  </span>

                </div>

                <div class="info">

                  <span class="label">
                    Nível
                  </span>

                  <span class="valor">
                    ⭐ Nível ${nivel}
                  </span>

                </div>

                <div class="info">

                  <span class="label">
                    Experiência
                  </span>

                  <span class="valor">
                    ⚡ ${xp} XP
                  </span>

                </div>

              </div>

              <div class="progresso-area">

                <div class="progresso-topo">

                  <span class="progresso-titulo">
                    Progresso do nível
                  </span>

                  <span class="progresso-xp">
                    ${xp} / ${xpNecessario} XP
                  </span>

                </div>

                <div class="barra">

                  <div
                    class="barra-preenchida"
                    style="width: ${progresso}%"
                  ></div>

                </div>

              </div>

              <div class="status">

                ${
                  statusAtivo
                    ? "🟢 Motorista ativo"
                    : "🔴 " +
                      (motorista.status ||
                      "Status não informado")
                }

              </div>

              <div class="rodape-perfil">
                Santa Luzia Tomates • Santa Luzia Central
              </div>

            </div>

          </div>

        `;

      } catch (erro) {

        console.error(erro);

        resultado.innerHTML =
          '<div class="mensagem">Não foi possível consultar o motorista.</div>';

      }
    }


    /* =========================
       BUSCAR MISSÕES
    ========================= */

    async function carregarMissoes() {

      const lista =
        document.getElementById("listaMissoes");

      try {

        const resposta = await fetch(
          `${SUPABASE_URL}/rest/v1/missoes?ativa=eq.true&select=id,nome,descricao,xp&order=id.asc`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!resposta.ok) {
          throw new Error("Erro ao buscar missões.");
        }

        const missoes =
          await resposta.json();

        if (missoes.length === 0) {

          lista.innerHTML =
            '<div class="erro-missoes">Nenhuma missão disponível no momento.</div>';

          return;
        }

        lista.innerHTML =
          missoes.map(missao => `

            <div class="missao">

              <div class="missao-topo">

                <div class="missao-nome">
                  🎯 ${missao.nome}
                </div>

                <div class="missao-xp">
                  +${missao.xp} XP
                </div>

              </div>

              <p class="missao-descricao">
                ${missao.descricao || "Missão oficial da Santa Luzia."}
              </p>

            </div>

          `).join("");

      } catch (erro) {

        console.error(erro);

        lista.innerHTML =
          '<div class="erro-missoes">Não foi possível carregar as missões.</div>';

      }
    }


    /* =========================
       ENTER NO CAMPO
    ========================= */

    document
      .getElementById("codigo")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            buscarMotorista();
          }

        }
      );


    /* =========================
       INICIAR
    ========================= */

    buscarMotorista();

    carregarMissoes();

  </script>

</body>
</html>
