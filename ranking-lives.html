<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14532d">
  <title>Ranking das Lives | Santa Luzia Tomates</title>

  <style>
    :root {
      --verde: #14532d;
      --verde2: #166534;
      --vermelho: #b91c1c;
      --fundo: #f3f6f2;
      --texto: #1f2937;
      --dourado: #eab308;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: var(--verde);
      color: white;
      text-align: center;
      padding: 30px 16px 24px;
      border-bottom: 5px solid #b91c1c;
    }

    .icone {
      font-size: 38px;
      margin-bottom: 8px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 34px);
    }

    header p {
      margin: 9px 0 0;
      color: #dcfce7;
      letter-spacing: 2px;
      font-size: 13px;
    }

    main {
      width: min(900px, 94%);
      margin: 26px auto 45px;
    }

    .painel {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0000000b;
      margin-bottom: 20px;
    }

    .seletor {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }

    .campo {
      flex: 1;
      min-width: 140px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: white;
      color: var(--texto);
      font-size: 15px;
    }

    .mes-titulo {
      text-align: center;
      color: var(--verde);
      margin: 0 0 22px;
      font-size: 21px;
    }

    .podio {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .colocado {
      min-width: 0;
      text-align: center;
      padding: 15px 8px 12px;
      border-radius: 13px;
      border: 1px solid #e5e7eb;
      overflow-wrap: anywhere;
    }

    .colocado.primeiro {
      background: #fffbeb;
      border-color: #facc15;
      padding-top: 23px;
    }

    .colocado.segundo { background: #f8fafc; }
    .colocado.terceiro { background: #fff7ed; }

    .medalha {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .posicao {
      font-size: 12px;
      color: #6b7280;
      font-weight: bold;
      text-transform: uppercase;
    }

    .nome {
      font-weight: bold;
      font-size: clamp(13px, 2.7vw, 18px);
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .pontos {
      color: var(--verde);
      font-weight: bold;
      font-size: clamp(19px, 4vw, 27px);
    }

    .unidade {
      color: #6b7280;
      font-size: 11px;
      margin-top: 3px;
    }

    .mensagem {
      text-align: center;
      color: #6b7280;
      padding: 25px 8px;
      line-height: 1.6;
    }

    .erro { color: #b91c1c; }

    .historico-titulo {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .historico-lista {
      display: grid;
      gap: 10px;
    }

    .mes-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      text-align: left;
      color: var(--texto);
      cursor: pointer;
      font-size: 14px;
    }

    .mes-item:hover {
      border-color: var(--verde2);
      background: #f0fdf4;
    }

    .mes-item strong { color: var(--verde); }

    .rodape {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding: 12px;
    }

    .linha-verde {
      width: 48px;
      height: 3px;
      background: var(--verde2);
      margin: 0 auto 20px;
      border-radius: 5px;
    }

    @media (max-width: 430px) {
      main { width: 94%; margin-top: 17px; }
      .painel { padding: 15px; }
      .podio { gap: 6px; }
      .colocado { padding-left: 4px; padding-right: 4px; }
      .medalha { font-size: 29px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="icone">🏆🍅</div>
    <h1>Ranking das Lives</h1>
    <p>SANTA LUZIA TOMATES</p>
  </header>

<a href="index.html" class="voltar-inicio">
  ← Voltar para a página inicial
</a>

<style>
  .voltar-inicio {
    display: block;
    width: fit-content;
    margin: 16px auto;
    padding: 12px 18px;
    background: #176b3a;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
  }

  .voltar-inicio:hover {
    background: #12552e;
  }
</style>
  
  <main>
    <section class="painel">
      <div class="seletor">
        <div class="campo">
          <label for="mes">Consultar mês</label>
          <select id="mes">
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>

        <div class="campo">
          <label for="ano">Ano</label>
          <select id="ano"></select>
        </div>
      </div>
    </section>

    <section class="painel" aria-live="polite">
      <h2 class="mes-titulo" id="tituloMes">Carregando ranking...</h2>
      <div class="linha-verde"></div>
      <div id="resultado" class="mensagem">
        Buscando os resultados...
      </div>
    </section>

    <section class="painel">
      <h2 class="historico-titulo">📅 Rankings anteriores</h2>
      <div id="historico" class="historico-lista mensagem">
        Carregando histórico...
      </div>
    </section>

    <div class="rodape">
      Santa Luzia Tomates • Ranking oficial das lives
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configuração do projeto Supabase
    const SUPABASE_URL = "https://cckypvqophyviphqhich.supabase.co";

    // Use a mesma Publishable key utilizada na página ADM.
    const SUPABASE_ANON_KEY = "sb_publishable_M_6iIpO4FhNhxskWG0XXrA_Uwuw_bbP";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const nomesMeses = [
      "Janeiro", "Fevereiro", "Março", "Abril",
      "Maio", "Junho", "Julho", "Agosto",
      "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    const mesSelect = document.getElementById("mes");
    const anoSelect = document.getElementById("ano");
    const resultado = document.getElementById("resultado");
    const tituloMes = document.getElementById("tituloMes");
    const historico = document.getElementById("historico");

    const agora = new Date();
    const anoAtual = agora.getFullYear();
    const mesAtual = agora.getMonth() + 1;

    for (let ano = anoAtual; ano >= 2024; ano--) {
      const opcao = document.createElement("option");
      opcao.value = ano;
      opcao.textContent = ano;
      anoSelect.appendChild(opcao);
    }

    mesSelect.value = String(mesAtual);
    anoSelect.value = String(anoAtual);

    function escapar(texto) {
      return String(texto ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caractere]);
    }

    function mostrarErro(texto) {
      resultado.className = "mensagem erro";
      resultado.textContent = texto;
    }

    function formatarPontos(valor) {
      return Number(valor || 0).toLocaleString("pt-BR");
    }

    async function carregarRanking(ano, mes) {
      tituloMes.textContent = `Ranking de ${nomesMeses[mes - 1]} de ${ano}`;
      resultado.className = "mensagem";
      resultado.textContent = "Buscando os resultados...";

      const { data, error } = await db
        .from("ranking_lives_mensal")
        .select("*")
        .eq("ano", ano)
        .eq("mes", mes)
        .maybeSingle();

      if (error) {
        console.error(error);
        mostrarErro(
          "Não foi possível carregar o ranking. Confira a conexão com o Supabase."
        );
        return;
      }

      if (!data) {
        resultado.className = "mensagem";
        resultado.textContent =
          "Ainda não há ranking publicado para este mês. Volte em breve!";
        return;
      }

      const colocados = [
        {
          classe: "segundo",
          medalha: "🥈",
          posicao: "2º lugar",
          nome: data.segundo_nome,
          pontos: data.segundo_pontos
        },
        {
          classe: "primeiro",
          medalha: "🥇",
          posicao: "1º lugar",
          nome: data.primeiro_nome,
          pontos: data.primeiro_pontos
        },
        {
          classe: "terceiro",
          medalha: "🥉",
          posicao: "3º lugar",
          nome: data.terceiro_nome,
          pontos: data.terceiro_pontos
        }
      ];

      resultado.className = "podio";
      resultado.replaceChildren();

      colocados.forEach(item => {
        const cartao = document.createElement("div");
        cartao.className = `colocado ${item.classe}`;

        const medalha = document.createElement("div");
        medalha.className = "medalha";
        medalha.textContent = item.medalha;

        const posicao = document.createElement("div");
        posicao.className = "posicao";
        posicao.textContent = item.posicao;

        const nome = document.createElement("div");
        nome.className = "nome";
        nome.textContent = item.nome || "A definir";

        const pontos = document.createElement("div");
        pontos.className = "pontos";
        pontos.textContent = formatarPontos(item.pontos);

        const unidade = document.createElement("div");
        unidade.className = "unidade";
        unidade.textContent = "pontos";

        cartao.append(medalha, posicao, nome, pontos, unidade);
        resultado.appendChild(cartao);
      });
    }

    async function carregarHistorico() {
      historico.className = "historico-lista";
      historico.textContent = "Carregando histórico...";

      const { data, error } = await db
        .from("ranking_lives_mensal")
        .select("ano, mes, primeiro_nome, primeiro_pontos")
        .order("ano", { ascending: false })
        .order("mes", { ascending: false });

      if (error) {
        console.error(error);
        historico.className = "mensagem erro";
        historico.textContent = "Não foi possível carregar os rankings anteriores.";
        return;
      }

      historico.replaceChildren();

      if (!data || data.length === 0) {
        historico.className = "mensagem";
        historico.textContent = "Os rankings publicados aparecerão aqui.";
        return;
      }

      data.forEach(item => {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "mes-item";

        const nomeMes = document.createElement("span");
        nomeMes.textContent = `${nomesMeses[item.mes - 1]} de ${item.ano}`;

        const vencedor = document.createElement("strong");
        vencedor.textContent = item.primeiro_nome
          ? `🥇 ${item.primeiro_nome}`
          : "Ver ranking";

        botao.append(nomeMes, vencedor);

        botao.addEventListener("click", () => {
          mesSelect.value = String(item.mes);
          anoSelect.value = String(item.ano);
          carregarRanking(item.ano, item.mes);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        historico.appendChild(botao);
      });
    }

    function atualizarRanking() {
      carregarRanking(
        Number(anoSelect.value),
        Number(mesSelect.value)
      );
    }

    mesSelect.addEventListener("change", atualizarRanking);
    anoSelect.addEventListener("change", atualizarRanking);

    atualizarRanking();
    carregarHistorico();
  </script>
</body>
</html>
