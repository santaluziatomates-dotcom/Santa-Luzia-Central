<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

      content="width=device-width,
      initial-scale=1.0,

<title>Santa Luzia Games • Colheita</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#9cc9ef;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#game{

    position:fixed;
    inset:0;

    overflow:hidden;
}

canvas{

    display:block;

    width:100%;
    height:100%;
}


/* =====================================================
   HUD
===================================================== */

.hud{

    position:fixed;

    top:18px;
    left:18px;
    right:18px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    pointer-events:none;
}

.hud-card{

    min-width:150px;

    padding:12px 18px;

    background:
        rgba(255,255,255,.94);

    border:
        2px solid
        rgba(255,255,255,.8);

    border-radius:22px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.15);

    color:#234b32;
}

.hud-label{

    font-size:15px;

    font-weight:700;

    letter-spacing:1px;
}

.hud-value{

    margin-top:3px;

    font-size:30px;

    font-weight:800;
}


/* =====================================================
   MENSAGEM
===================================================== */

#message{

    position:fixed;

    left:50%;
    bottom:160px;

    transform:
        translateX(-50%);

    z-index:25;

    max-width:330px;

    padding:14px 22px;

    background:
        rgba(30,86,50,.94);

    color:white;

    border-radius:24px;

    font-size:17px;

    font-weight:700;

    text-align:center;

    box-shadow:
        0 6px 20px rgba(0,0,0,.22);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease;
}

#message.show{

    opacity:1;
}


/* =====================================================
   CONTROLES
===================================================== */

.controls{

    position:fixed;

    left:18px;
    bottom:28px;

    z-index:30;

    display:grid;

    grid-template-columns:
        64px 64px 64px;

    grid-template-rows:
        64px 64px;

    gap:10px;
}

.control{

    width:64px;
    height:64px;

    border:0;

    border-radius:20px;

    background:
        rgba(255,255,255,.94);

    color:#245536;

    font-size:30px;

    font-weight:900;

    box-shadow:
        0 5px 15px rgba(0,0,0,.16);

    touch-action:manipulation;
}

.control:active{

    transform:scale(.94);
}

.up{

    grid-column:2;
    grid-row:1;
}

.left{

    grid-column:1;
    grid-row:2;
}

.down{

    grid-column:2;
    grid-row:2;
}

.right{

    grid-column:3;
    grid-row:2;
}


/* =====================================================
   AÇÕES
===================================================== */

.actions{

    position:fixed;

    right:18px;
    bottom:28px;

    z-index:30;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.action{

    min-width:190px;

    min-height:58px;

    border:0;

    border-radius:20px;

    font-size:18px;

    font-weight:800;

    box-shadow:
        0 5px 15px rgba(0,0,0,.16);

    touch-action:manipulation;
}

.harvest{

    background:#245b35;

    color:white;
}

.restart{

    background:
        rgba(255,255,255,.95);

    color:#245b35;
}

.action:active{

    transform:scale(.96);
}


/* =====================================================
   RESULTADO
===================================================== */

#result{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(15,35,24,.72);

    backdrop-filter:
        blur(6px);
}

.result-card{

    width:min(90%,360px);

    padding:28px;

    background:white;

    border-radius:28px;

    text-align:center;

    box-shadow:
        0 15px 50px rgba(0,0,0,.3);
}

.result-card h1{

    margin:
        0 0 12px;

    color:#245b35;
}

.result-card p{

    color:#4d5c52;

    font-size:18px;
}

.result-card button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:16px;

    background:#245b35;

    color:white;

    font-size:17px;

    font-weight:800;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .hud{

        top:14px;

        left:12px;

        right:12px;
    }

    .hud-card{

        min-width:125px;

        padding:10px 14px;

        border-radius:18px;
    }

    .hud-label{

        font-size:13px;
    }

    .hud-value{

        font-size:24px;
    }

    .controls{

        left:12px;

        bottom:18px;

        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            58px 58px;
    }

    .control{

        width:58px;

        height:58px;

        border-radius:18px;
    }

    .actions{

        right:12px;

        bottom:18px;
    }

    .action{

        min-width:160px;

        min-height:54px;

        font-size:16px;
    }

    #message{

        bottom:145px;

        max-width:290px;

        font-size:15px;
    }
}

</style>

</head>

<script type="module">

import * as THREE from "three";


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const GAME_TIME = 60;


/*
    Campo mais curto que a versão pesada.

    Depois que estiver 100% funcionando
    podemos aumentar novamente.
*/

const FIELD_LENGTH = 92;


/*
    Menos plantas = mais desempenho.

    A aparência continua de uma plantação.
*/

const PLANT_SPACING = 2.8;


/*
    Duas linhas:

       TOMATE       ESTRADA       TOMATE
          |            |             |
          |            |             |
*/

const ROW_X = 6.4;


/*
    Estrutura:

    1 palanque
    8 pés
    cruzeta
    8 pés
    palanque
    8 pés
    cruzeta...

*/

const PLANTS_PER_SECTION = 8;


/*
    Estrada.
*/

const ROAD_WIDTH = 8.5;


/* =====================================================
   CENA
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x9fcdf1
    );


scene.fog =
    new THREE.Fog(
        0x9fcdf1,
        48,
        135
    );


/* =====================================================
   CÂMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        .1,
        220
    );


camera.position.set(
    0,
    5.2,
    9
);


/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/*
    Reduzimos o pixel ratio.

    Isso é MUITO importante
    para o iPhone.
*/

renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        1.25
    )

);


/*
    Sombras menores que antes.

    1024 é suficiente para
    um jogo mobile.
*/

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.shadowMap.autoUpdate =
    true;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.08;


document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   ILUMINAÇÃO
===================================================== */

const ambient =
    new THREE.HemisphereLight(

        0xd9efff,

        0x53633d,

        1.45

    );


scene.add(
    ambient
);


const sunLight =
    new THREE.DirectionalLight(

        0xffe7b0,

        2.7

    );


sunLight.position.set(
    -35,
    55,
    30
);


sunLight.castShadow =
    true;


/*
    Sombras leves.

    Muito mais barato que 2048.
*/

sunLight.shadow.mapSize.width =
    1024;

sunLight.shadow.mapSize.height =
    1024;


sunLight.shadow.camera.left =
    -45;

sunLight.shadow.camera.right =
    45;

sunLight.shadow.camera.top =
    65;

sunLight.shadow.camera.bottom =
    -65;


sunLight.shadow.camera.near =
    1;

sunLight.shadow.camera.far =
    140;


scene.add(
    sunLight
);


/* =====================================================
   SOL VISUAL
===================================================== */

const sun =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4.5,
            16,
            12
        ),

        new THREE.MeshBasicMaterial({

            color:
                0xffdf72

        })

    );


sun.position.set(
    -42,
    48,
    -70
);


scene.add(
    sun
);


/* =====================================================
   NUVEM LEVE
===================================================== */

const cloudMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffffff

    });


function createCloud(
    x,
    y,
    z,
    scale
){

    const cloud =
        new THREE.Group();


    const positions = [

        [-1.7,0,0,1.3],

        [0,.25,0,1.7],

        [1.7,0,0,1.25],

        [.7,.55,0,.9]

    ];


    for(
        const item of positions
    ){

        const mesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    item[3],
                    8,
                    6
                ),

                cloudMaterial

            );


        mesh.position.set(
            item[0],
            item[1],
            item[2]
        );


        cloud.add(
            mesh
        );
    }


    cloud.position.set(
        x,
        y,
        z
    );


    cloud.scale.setScalar(
        scale
    );


    scene.add(
        cloud
    );


    return cloud;
}


const clouds = [

    createCloud(
        -22,
        34,
        -35,
        1.5
    ),

    createCloud(
        25,
        39,
        -65,
        1.8
    ),

    createCloud(
        5,
        32,
        -105,
        1.2
    )

];


/* =====================================================
   MATERIAIS REUTILIZADOS
===================================================== */


/*
    IMPORTANTE:

    Todos esses materiais são reutilizados.
    Isso reduz bastante o peso.
*/

const roadMaterial =
    new THREE.MeshStandardMaterial({

        color:

            1

    });


const soilMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x80502e,

        roughness:
            1

    });


const grassMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x6f9b50,

        roughness:
            1

    });


const woodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x674127,

        roughness:
            .95

    });


const darkWoodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x43291c,

        roughness:
            1

    });


const wireMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x252821,

        roughness:
            .7,

        metalness:
            .1

    });


const stemMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x376439,

        roughness:
            1

    });


const leafMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x4f873f,

        roughness:
            1

    });


const leafLightMaterial =

    });


const redTomatoMaterial =

    });


const greenTomatoMaterial =

    });


const yellowTomatoMaterial =

    });

    });


const flowerMaterial =
    new THREE.MeshStandardMaterial({

        roughness:
            1

    });


const flowerCenterMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xe4bd42,

            .8

    });


/* =====================================================
   GEOMETRIAS REUTILIZADAS
===================================================== */

const leafGeometry =
    new THREE.SphereGeometry(
        1,
        6,
        4
    );


const tomatoGeometry =
    new THREE.SphereGeometry(
        .22,
        10,
        8
    );


const tomatoCrownGeometry =
    new THREE.ConeGeometry(
        .09,
        .11,
        5
    );


const stemGeometry =
    new THREE.CylinderGeometry(
        .055,
        .075,
        2.9,
        6
    );


const smallBranchGeometry =
    new THREE.CylinderGeometry(
        .028,
        .035,
        1,
        5
    );


/* =====================================================
   CHÃO
===================================================== */

function createGround(){

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                80,
                FIELD_LENGTH + 50
            ),

            grassMaterial

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.z =
        -FIELD_LENGTH / 2;


    ground.receiveShadow =
        true;


    scene.add(
        ground
    );


    /*
        Estrada central.
    */

    const road =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                ROAD_WIDTH,
                FIELD_LENGTH + 25
            ),

            roadMaterial

        );


    road.rotation.x =
        -Math.PI / 2;


    road.position.y =
        .01;


    road.position.z =
        -FIELD_LENGTH / 2;


    road.receiveShadow =
        true;


    scene.add(
        road
    );


    /*
        Canteiros.

        Um de cada lado.
    */

    for(
        const x of [
            -ROW_X,
            ROW_X
        ]
    ){

        const bed =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    4.2,
                    FIELD_LENGTH + 25
                ),

                soilMaterial

            );


        bed.rotation.x =
            -Math.PI / 2;


        bed.position.set(
            x,
            .02,
            -FIELD_LENGTH / 2
        );


        bed.receiveShadow =
            true;


        scene.add(
            bed
        );
    }
}


createGround();


/* =====================================================
   DETALHES LEVES DO CHÃO
===================================================== */

function createGroundDetails(){

    const rockGeometry =
        new THREE.DodecahedronGeometry(
            .075,
            0
        );


    const rockMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x563c29,

            roughness:
                1

        });


    /*
        InstancedMesh:

        centenas de pedras
        em apenas UM objeto.
    */

    const rocks =
        new THREE.InstancedMesh(

            rockGeometry,

            rockMaterial,

            100

        );


    const matrix =
        new THREE.Matrix4();


    for(
        let i=0;
        i<100;
        i++
    ){

        const side =
            Math.random() > .5
                ? 1
                : -1;


        const x =
            side *
            (
                ROAD_WIDTH / 2 +
                Math.random() * 3.4
            );


        const z =
            -Math.random() *
            FIELD_LENGTH;


        const s =
            .6 +
            Math.random() * .8;


        matrix.compose(

            new THREE.Vector3(
                x,
                .06,
                z
            ),

            new THREE.Quaternion()
                .setFromAxisAngle(
                    new THREE.Vector3(
                        0,
                        1,
                        0
                    ),
                    Math.random() *
                    Math.PI
                ),

            new THREE.Vector3(
                s,
                s,
                s
            )

        );


        rocks.setMatrixAt(
            i,
            matrix
        );
    }


    rocks.instanceMatrix.needsUpdate =
        true;


    rocks.receiveShadow =
        true;


    scene.add(
        rocks
    );
}


createGroundDetails();


/* =====================================================
   CILINDRO ENTRE DOIS PONTOS
===================================================== */

function cylinderBetween(
    a,
    b,
    radius,
    material,
    segments = 6
){

    const direction =
        new THREE.Vector3()
            .subVectors(
                b,
                a
            );


    const length =
        direction.length();


    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            segments
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(

        a.clone()
            .add(b)
            .multiplyScalar(.5)

    );


    mesh.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            1,
            0
        ),

        direction.normalize()

    );


    mesh.castShadow =
        true;


    return mesh;
}


/* =====================================================
   PALANQUE
===================================================== */

function createPalanque(
    x,
    z
){

    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .11,
                .14,
                4.4,
                7
            ),

            darkWoodMaterial

        );


    post.position.set(
        x,
        2.2,
        z
    );


    post.castShadow =
        true;


    scene.add(
        post
    );


    /*
        Pequena ponta.
    */

    const top =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .075,
                .09,
                .65,
                6
            ),

            woodMaterial

        );


    top.position.set(
        x,
        4.72,
        z
    );


    top.castShadow =
        true;


    scene.add(
        top
    );
}


/* =====================================================
   CRUZETA
===================================================== */

function createCruzeta(
    x,
    z
){

    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .105,
                .14,
                4.35,
                7
            ),

            darkWoodMaterial

        );


    post.position.set(
        x,
        2.17,
        z
    );


    post.castShadow =
        true;


    scene.add(
        post
    );


    /*
        Cruzeta real:

        uma madeira atravessada.
    */

    const cross =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.5,
                .15,
                .16
            ),

            woodMaterial

        );


    cross.position.set(
        x,
        3.55,
        z
    );


    cross.castShadow =
        true;


    scene.add(
        cross
    );
}


/* =====================================================
   ARAME
===================================================== */

function createWire(
    x,
    y
){

    const start =
        new THREE.Vector3(
            x,
            y,
            3
        );


    const end =
        new THREE.Vector3(
            x,
            y,
            -FIELD_LENGTH - 3
        );


    const wire =
        cylinderBetween(
            start,
            end,
            .018,
            wireMaterial,
            5
        );


    scene.add(
        wire
    );
}


/* =====================================================
   ESTRUTURA

   PALANQUE
   8 PÉS
   CRUZETA
   8 PÉS
   PALANQUE
===================================================== */

function createSupportStructure(
    x
){

    let section = 0;


    /*
        Primeiro palanque.
    */

    createPalanque(
        x,
        1
    );


    /*
        Cada seção possui 8 plantas.

        Depois alternamos:

        cruzeta
        palanque
        cruzeta
        palanque
    */

    for(
        let z = -8 * PLANT_SPACING;
        z > -FIELD_LENGTH;
        z -=
            8 * PLANT_SPACING
    ){

        section++;


        if(
            section % 2 === 1
        ){

            createCruzeta(
                x,
                z
            );

        }else{

            createPalanque(
                x,
                z
            );
        }
    }


    /*
        Um arame principal.

        Depois podemos aumentar
        para vários níveis.
    */

    createWire(
        x,
        3.55
    );


    /*
        Segundo arame leve.

        Mantemos somente 2 agora
        para não pesar.
    */

    createWire(
        x,
        2.65
    );
}


createSupportStructure(
    -ROW_X
);


createSupportStructure(
    ROW_X
);


/* =====================================================
   FOLHAS INSTANCIADAS
===================================================== */

const leafInstances = [];


/*
    Criamos dois materiais diferentes.

*/

const leavesDark =

leavesLight.castShadow =

const leafMatrix =
    new THREE.Matrix4();


let darkLeafIndex = 0;
let lightLeafIndex = 0;


/* =====================================================
   TOMATES DECORATIVOS INSTANCIADOS
===================================================== */

const greenTomatoes =
    new THREE.InstancedMesh(

        tomatoGeometry,

        greenTomatoMaterial,

        160

    );


const yellowTomatoes =
    new THREE.InstancedMesh(

        tomatoGeometry,

yellowTomatoes.castShadow =
    true;

let yellowIndex = 0;


/* =====================================================
   TOMATES MADUROS COLHÍVEIS
===================================================== */

const tomatoObjects = [];


/* =====================================================
   ADICIONA FOLHA
===================================================== */

function addLeaf(
    x,
    y,
    z,
    scale,
    rotation
){

    const mesh =
        darkLeafIndex %
        3 === 0
            ? leavesLight
            : leavesDark;


    const index =
        mesh === leavesLight
            ? lightLeafIndex++
            : darkLeafIndex++;


    const quaternion =
        new THREE.Quaternion()
            .setFromEuler(

                new THREE.Euler(
                    .15,
                    rotation,
                    (Math.random()-.5)
                    * .45
                )

            );


    leafMatrix.compose(

        new THREE.Vector3(
            x,
            y,
            z
        ),

        quaternion,

        new THREE.Vector3(
            scale * 1.4,
            scale * .22,
            scale * .65
        )

    );


    mesh.setMatrixAt(
        index,
        leafMatrix
    );
}


/* =====================================================
   ADICIONA TOMATE DECORATIVO
===================================================== */

function addDecorativeTomato(
    x,
    y,
    z,
    type,
    scale
){

    const mesh =
        type === "green"
            ? greenTomatoes
            : yellowTomatoes;


    const index =
        type === "green"
            ? greenIndex++
            : yellowIndex++;


    if(
        index >= 160 &&
        type === "green"
    ){

        return;
    }


    if(
        index >= 110 &&
        type === "yellow"
    ){

        return;
    }


    const quaternion =
        new THREE.Quaternion();


    const s =
        scale;


    leafMatrix.compose(

        new THREE.Vector3(
            x,
            y,
            z
        ),

        quaternion,

        new THREE.Vector3(
            s,
            s * 1.05,
            s
        )

    );


    mesh.setMatrixAt(
        index,
        leafMatrix
    );
}


/* =====================================================
   TOMATE MADURO
===================================================== */

function addMatureTomato(
    x,
    y,
    z,
    scale
){

    const group =
        new THREE.Group();


    const tomato =
        new THREE.Mesh(

            tomatoGeometry,

            redTomatoMaterial

        );


    tomato.scale.set(
        scale,
        scale * 1.05,
        scale
    );


    tomato.castShadow =
        true;


    group.add(
        tomato
    );


    const crown =
        new THREE.Mesh(

            tomatoCrownGeometry,

            tomatoCrownMaterial

        );


    crown.position.y =
        .21 * scale;


    crown.rotation.x =
        Math.PI;


    group.add(
        crown
    );


    group.position.set(
        x,
        y,
        z
    );


    group.userData.mature =
        true;


    group.userData.tomato =
        true;


    scene.add(
        group
    );


    tomatoObjects.push(
        group
    );
}


/* =====================================================
   PÉ DE TOMATE
===================================================== */

function createTomatoPlant(
    x,
    z,
    index
){

    /*
        Caule.

        Apenas 1 objeto por planta.
    */

    const stem =
        new THREE.Mesh(

            stemGeometry,

            stemMaterial

        );


    stem.position.set(
        x,
        1.48,
        z
    );


    stem.castShadow =
        true;


    scene.add(
        stem
    );


    /*
        Pequenos galhos.

        Não exageramos para manter
        o iPhone rápido.
    */

    for(
        let b=0;
        b<6;
        b++
    ){

        const y =
            .65 +
            b * .42;


        const side =
            b % 2 === 0
                ? 1
                : -1;


        const start =
            new THREE.Vector3(
                x,
                y,
                z
            );


        const end =
            new THREE.Vector3(

                x +
                side *
                (.55 +
                Math.random()*.25),

                y +
                .16,

                z +
                (Math.random()-.5)*.25

            );


        const branch =
            cylinderBetween(

                start,
                end,

                .027,

                stemMaterial,

                5

            );


        scene.add(
            branch
        );
    }


    /*
        Folhagem.

        12 folhas por planta.

        Antes eram dezenas.
    */

    for(
        let l=0;
        l<12;
        l++
    ){

        const y =
            .45 +
            Math.random()*2.45;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const radius =
            .25 +
            Math.random()*.48;


        addLeaf(

            x +
            Math.cos(angle) *
            radius,

            y,

            z +
            Math.sin(angle) *
            radius,

            .28 +
            Math.random()*.15,

            angle

        );
    }


    /*
        Tomates.

        Mais verdes e amarelos
        que vermelhos.

        Isso deixa a planta
        mais natural.
    */

    for(
        let c=0;
        c<4;
        c++
    ){

        const y =
            .75 +
            c * .55 +
            Math.random()*.15;


        const side =
            c % 2 === 0
                ? 1
                : -1;


        const cx =
            x +
            side *
            (.52 +
            Math.random()*.18);


        const cz =
            z +
            (Math.random()-.5)*.25;


        /*
            2 verdes
            1 amarelo
            1 vermelho
        */

        for(
            let t=0;
            t<4;
            t++
        ){

            const tx =
                cx +
                (Math.random()-.5)*.28;


            const ty =
                y +
                (Math.random()-.5)*.28;


            const tz =
                cz +
                (Math.random()-.5)*.22;


            const roll =
                Math.random();


            if(
                roll < .48
            ){

                addDecorativeTomato(

                    tx,
                    ty,
                    tz,

                    "green",

                    .72

                );

            }else if(
                roll < .76
            ){

                addDecorativeTomato(

                    tx,
                    ty,
                    tz,

                    "yellow",

                    .76

                );

            }else{

                addMatureTomato(

                    tx,
                    ty,
                    tz,

                    .78

                );
            }
        }
    }
}


/* =====================================================
   FLORES LEVES
===================================================== */

const flowerGeometry =
    new THREE.SphereGeometry(
        .065,
        6,
        5
    );


const flowerCenterGeometry =
    new THREE.SphereGeometry(
        .045,
        6,
        5
    );


function createFlower(
    x,
    y,
    z
){

    /*
        Uma flor pequena
        com centro amarelo.

        Só criamos poucas.
    */

    for(
        let p=0;
        p<5;
        p++
    ){

        const angle =
            p *
            Math.PI *
            2 /
            5;


        const petal =
            new THREE.Mesh(

                flowerGeometry,

                flowerMaterial

            );


        petal.position.set(

            x +
            Math.cos(angle)*.075,

            y,

            z +
            Math.sin(angle)*.075

        );


        scene.add(
            petal
        );
    }


    const center =
        new THREE.Mesh(

            flowerCenterGeometry,

            flowerCenterMaterial

        );


    center.position.set(
        x,
        y+.01,
        z
    );


    scene.add(
        center
    );
}


/* =====================================================
   CRIAÇÃO DA PLANTAÇÃO
===================================================== */

let plantIndex = 0;


for(
    const rowSide of [-1,1]
){

    const x =
        rowSide *
        ROW_X;


    for(
        let z=-2;

        z>-FIELD_LENGTH;

        z-=PLANT_SPACING
    ){

        createTomatoPlant(
            x,
            z,
            plantIndex
        );


        /*
            Varinhas alternadas.

            Exatamente a ideia:

                 /\
                /\
                 /\
                /\

            Uma de cada lado.
        */

        const side =
            plantIndex % 2 === 0
                ? 1
                : -1;


        const start =
            new THREE.Vector3(

                x +
                side*.8,

                .12,

                z

            );


        const end =
            new THREE.Vector3(

                x -
                side*.25,

                3.45,

                z

            );


        const vara =
            cylinderBetween(

                start,
                end,

                .045,

                woodMaterial,

                5

            );


        scene.add(
            vara
        );


        /*
            Algumas flores.

            Não colocamos em todos
            os pés para economizar.
        */

        if(
            plantIndex % 3 === 0
        ){

            createFlower(

                x +
                (Math.random()-.5)*.6,

                1.25 +
                Math.random()*1.2,

                z +
                (Math.random()-.5)*.35

            );
        }


        plantIndex++;
    }
}

    "keydown",
    event => {

    "keyup",

/* =====================================================
   CONTROLE MOBILE
===================================================== */

document
    .querySelectorAll(".control")
    .forEach(
        button => {

            const key =
                button.dataset.key;


            const start =
                event => {

                    event.preventDefault();

                    keys[key] =
                        true;
                };


            const stop =
                event => {

                    event.preventDefault();

                    keys[key] =
                        false;
                };


            button.addEventListener(
                "pointerdown",
                start
            );


            button.addEventListener(
                "pointerup",
                stop
            );


            button.addEventListener(
                "pointercancel",
                stop
            );


            button.addEventListener(
                "pointerleave",
                stop
            );
        }
    );


/* =====================================================
   MOVIMENTO
===================================================== */

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
){

    const speed =
        4.2;


    let dx =
        0;

    let dz =
        0;


    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx -= 1;
    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx += 1;
    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dz -= 1;
    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dz += 1;
    }


    if(
        dx !== 0 ||
        dz !== 0
    ){

        const length =
            Math.sqrt(
                dx*dx +
                dz*dz
            );


        dx /=
            length;

        dz /=
            length;


        player.position.x +=
            dx *
            speed *
            delta;


        player.position.z +=
            dz *
            speed *
            delta;


        /*
            O jogador continua
            dentro do corredor.
        */

        player.position.x =
            THREE.MathUtils.clamp(

                player.position.x,

                -3.35,

                3.35

            );


        player.position.z =
            THREE.MathUtils.clamp(

                player.position.z,

                -FIELD_LENGTH+3,

                7

            );


        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );
    }
}


/* =====================================================
   TOMATE MAIS PRÓXIMO
===================================================== */

let nearestTomato =
    null;


const tempVector =
    new THREE.Vector3();


function findNearestTomato(){

    nearestTomato =
        null;


    let bestDistance =
        Infinity;


    for(
        const tomato
        of tomatoObjects
    ){

        if(
            !tomato.visible
        ){

            continue;
        }


        const worldPosition =
            tomato.getWorldPosition(
                tempVector
            );


        const distance =
            player.position.distanceTo(
                worldPosition
            );


        if(
            distance <
            bestDistance
        ){

            bestDistance =
                distance;

            nearestTomato =
                tomato;
        }
    }


    return nearestTomato;
}


/* =====================================================
   COLHEITA
===================================================== */

let score =
    0;


function harvestTomato(){

    const tomato =
        findNearestTomato();


    if(
        !tomato
    ){

        showMessage(
            "🍅 Nenhum tomate maduro por perto."
        );

        return;
    }


    const worldPosition =
        tomato.getWorldPosition(
            new THREE.Vector3()
        );


    const distance =
        player.position.distanceTo(
            worldPosition
        );


    if(
        distance >
        4.2
    ){

        showMessage(
            "🍅 TOMATE NO ALCANCE • chegue mais perto"
        );

        return;
    }


    tomato.visible =
        false;


    score++;


    document
        .getElementById(
            "score"
        )
        .textContent =
        score;


    /*
        Tomate colocado
        na caixa.

        Geometria pequena.
    */

    const picked =
        new THREE.Mesh(

            tomatoGeometry,

            redTomatoMaterial

        );


    picked.scale.setScalar(
        .42
    );


    picked.position.set(

        (Math.random()-.5)*.25,

        .98 +
        Math.random()*.35,

        .48 +
        Math.random()*.25

    );


    picked.castShadow =
        true;


    player.add(
        picked
    );


    showMessage(
        "🍅 Tomate colhido!"
    );
}


document
    .getElementById(
        "harvest"
    )
    .addEventListener(
        "click",
        harvestTomato
    );


/* =====================================================
   MENSAGEM
===================================================== */

let messageTimer =
    null;


function showMessage(
    text
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =====================================================
   TEMPO
===================================================== */

let timeLeft =
    GAME_TIME;


let gameRunning =
    true;


const timeElement =
    document.getElementById(
        "time"
    );


function finishGame(){

    gameRunning =
        false;


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        score;


    document
        .getElementById(
            "result"
        )
        .style.display =
        "flex";
}


const timer =
    setInterval(
        () => {

            if(
                !gameRunning
            ){

                return;
            }


            timeLeft--;


            if(
                timeLeft < 0
            ){

                timeLeft =
                    0;
            }


            timeElement
                .textContent =
                timeLeft;


            if(
                timeLeft <= 0
            ){

                finishGame();
            }

        },
        1000
    );

/* =====================================================
   CÂMERA
===================================================== */

const cameraTarget =
    new THREE.Vector3();


function updateCamera(){

    const desired =
        new THREE.Vector3(

            player.position.x *
            .32,

            5.6,

            player.position.z +
            8.8

        );


    camera.position.lerp(

        desired,

        .075

    );


    cameraTarget.set(

        player.position.x,

        1.3,

        player.position.z -
        7

    );


    camera.lookAt(
        cameraTarget
    );
}


/* =====================================================
   NUVENS
===================================================== */

function updateClouds(
    delta
){

    for(
        const cloud
        of clouds
    ){

        cloud.position.x +=
            delta *
            .18;


        if(
            cloud.position.x >
            70
        ){

            cloud.position.x =
                -70;
        }
    }
}


/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            .05

        );


    if(
        gameRunning
    ){

        updatePlayer(
            delta
        );
    }


    updateCamera();


    updateClouds(
        delta
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                1.25
            )

        );
    }
);
