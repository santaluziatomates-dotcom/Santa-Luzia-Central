<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Santa Luzia Games</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #8fc8ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;
}

button {
    font-family: inherit;
}

#game {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;
}

canvas {
    display: block;
}


/* =========================================================
   HUD
========================================================= */

#hud {

    position: fixed;

    top: 12px;
    left: 12px;
    right: 12px;

    z-index: 30;

    display: flex;

    justify-content: space-between;

    pointer-events: none;
}

.hud-card {

    background:
        rgba(255,255,255,.94);

    border:
        1px solid
        rgba(23,75,44,.12);

    border-radius: 15px;

    padding:
        9px 13px;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.12);
}

.hud-title {

    color: #174b2c;

    font-size: 10px;

    font-weight: 900;

    letter-spacing:
        .8px;

    margin-bottom: 3px;
}

.hud-value {

    color: #173d25;

    font-size: 18px;

    font-weight: 900;
}


/* =========================================================
   MENSAGEM
========================================================= */

#message {

    position: fixed;

    top: 82px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    padding:
        10px 17px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.96);

    color: #174b2c;

    font-size: 12px;

    font-weight: 900;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.14);

    opacity: 0;

    transition:
        opacity .2s ease;

    pointer-events: none;

    white-space: nowrap;
}

#message.show {
    opacity: 1;
}


/* =========================================================
   CONTROLES
========================================================= */

#controls {

    position: fixed;

    left: 14px;
    bottom: 14px;

    z-index: 40;

    display: grid;

    grid-template-columns:
        repeat(3, 54px);

    grid-template-rows:
        repeat(2, 54px);

    gap: 6px;
}

.control {

    width: 54px;
    height: 54px;

    border: none;

    border-radius: 16px;

    background:
        rgba(255,255,255,.91);

    color: #174b2c;

    font-size: 21px;

    font-weight: 900;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.18);

    touch-action: none;
}

.control:active {

    transform:
        scale(.94);

    background:
        #174b2c;

    color: white;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}


/* =========================================================
   AÇÕES
========================================================= */

#actions {

    position: fixed;

    right: 14px;
    bottom: 14px;

    z-index: 40;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.action-button {

    min-width: 118px;

    min-height: 46px;

    border: none;

    border-radius: 15px;

    padding:
        0 14px;

    background:
        rgba(255,255,255,.94);

    color: #174b2c;

    font-size: 11px;

    font-weight: 900;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.17);
}

.action-button:active {
    transform: scale(.96);
}

#harvestButton {

    background:
        #174b2c;

    color: white;
}


/* =========================================================
   MENU PRINCIPAL
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        linear-gradient(
            rgba(8,40,22,.25),
            rgba(8,40,22,.55)
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.start-card {

    width:
        min(440px, 100%);

    max-height:
        92vh;

    overflow:
        auto;

    background:
        rgba(255,255,255,.97);

    border-radius:
        25px;

    padding:
        24px 20px;

    text-align:
        center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.28);
}

.logo-circle {

    width: 68px;
    height: 68px;

    margin:
        0 auto 12px;

    border-radius:
        50%;

    background:
        #174b2c;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        34px;
}

.start-card h1 {

    margin:
        0;

    color:
        #174b2c;

    font-size:
        24px;
}

.start-card p {

    margin:
        8px 0 17px;

    color:
        #59645c;

    font-size:
        13px;

    line-height:
        1.45;
}


/* =========================================================
   ETAPAS
========================================================= */

.stages {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        8px;

    margin-top:
        12px;
}

.stage-button {

    min-height:
        78px;

    border:
        1px solid
        #dfe8df;

    border-radius:
        15px;

    background:
        #f6f9f6;

    color:
        #174b2c;

    font-weight:
        900;

    font-size:
        12px;

    padding:
        10px;
}

.stage-button span {

    display:
        block;

    font-size:
        26px;

    margin-bottom:
        5px;
}

.stage-button.active {

    background:
        #174b2c;

    color:
        white;

    border-color:
        #174b2c;
}

.stage-button:active {
    transform: scale(.97);
}


/* =========================================================
   BOTÃO INICIAR
========================================================= */

.start-button {

    width:
        100%;

    height:
        51px;

    margin-top:
        15px;

    border:
        none;

    border-radius:
        15px;

    background:
        #174b2c;

    color:
        white;

    font-size:
        14px;

    font-weight:
        900;
}


/* =========================================================
   INSTRUÇÕES
========================================================= */

.instructions {

    margin-top:
        14px;

    padding:
        12px;

    background:
        #f1f5f1;

    border-radius:
        13px;

    color:
        #536057;

    font-size:
        11px;

    line-height:
        1.55;
}


/* =========================================================
   TELAS DAS FASES
========================================================= */

#stagePanel {

    position:
        fixed;

    inset:
        0;

    z-index:
        80;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        18px;

    background:
        rgba(9,43,24,.45);
}

.panel {

    width:
        min(470px,100%);

    max-height:
        90vh;

    overflow:
        auto;

    background:
        rgba(255,255,255,.98);

    border-radius:
        24px;

    padding:
        22px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}

.panel h2 {

    margin:
        0 0 6px;

    color:
        #174b2c;

    font-size:
        21px;
}

.panel p {

    color:
        #5c675f;

    font-size:
        13px;

    line-height:
        1.45;
}


/* =========================================================
   DESBROTA
========================================================= */

#sproutPlant {

    position:
        relative;

    height:
        300px;

    margin:
        10px auto;

    max-width:
        260px;

    background:
        linear-gradient(
            to right,
            transparent 48%,
            #79502f 49%,
            #79502f 53%,
            transparent 54%
        );

    border-radius:
        15px;
}

.sprout {

    position:
        absolute;

    width:
        43px;

    height:
        22px;

    border-radius:
        50%;

    background:
        #2c7c35;

    cursor:
        pointer;
}

.sprout.bad {

    background:
        #4da448;
}

.sprout.good {

    background:
        #b9d67a;
}


/* =========================================================
   AMARRAÇÃO
========================================================= */

#tieArea {

    position:
        relative;

    height:
        270px;

    margin-top:
        12px;

    border-radius:
        17px;

    background:
        #e8dcc8;

    overflow:
        hidden;
}

.tie-wire {

    position:
        absolute;

    left:
        15%;

    right:
        15%;

    height:
        5px;

    background:
        #555;

    border-radius:
        5px;
}

.tie-plant {

    position:
        absolute;

    left:
        50%;

    bottom:
        25px;

    width:
        9px;

    height:
        205px;

    background:
        #387537;

    transform:
        translateX(-50%);
}

.tie-point {

    position:
        absolute;

    width:
        42px;

    height:
        42px;

    border:
        3px solid
        #174b2c;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.9);

    color:
        #174b2c;

    font-weight:
        900;
}


/* =========================================================
   SELEÇÃO
========================================================= */

#selectionArea {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        8px;

    margin-top:
        15px;
}

.selection-box {

    min-height:
        85px;

    border:
        2px dashed
        #aab8ad;

    border-radius:
        14px;

    background:
        #f5f7f5;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    color:
        #174b2c;

    font-weight:
        900;

    font-size:
        12px;

    padding:
        8px;
}

#tomatoSelection {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    justify-content:
        center;

    margin:
        15px 0;
}

.selection-tomato {

    width:
        55px;

    height:
        55px;

    border-radius:
        50%;

    border:
        3px solid
        #8d211c;

    background:
        #d9362e;

    color:
        white;

    font-size:
        11px;

    font-weight:
        900;
}


/* =========================================================
   OCULTAR
========================================================= */

.hidden {
    display:
        none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

    .hud-card {
        padding:
            7px 10px;
    }

    .hud-value {
        font-size:
            16px;
    }

    #controls {

        left:
            10px;

        bottom:
            10px;

        grid-template-columns:
            repeat(3, 50px);

        grid-template-rows:
            repeat(2, 50px);
    }

    .control {

        width:
            50px;

        height:
            50px;
    }

    #actions {

        right:
            10px;

        bottom:
            10px;
    }

    .action-button {

        min-width:
            100px;

        min-height:
            44px;
    }

    .start-card {
        padding:
            20px 16px;
    }
}

</style>

<script type="module">

import * as THREE from "three";


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const GAME_TIME = 60;

const PLAYER_SPEED = 5.5;

const HARVEST_DISTANCE = 4.2;


/* =========================================================
   VARIÁVEIS
========================================================= */

let scene;
let camera;
let renderer;

let player;

let tomatoes = [];

let score = 0;

let timeLeft = GAME_TIME;

let gameStarted = false;

let gameOver = false;

let selectedStage = "harvest";

let lastTime = 0;

let messageTimer = null;


const keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


/* =========================================================
   ELEMENTOS
========================================================= */

const game =
    document.getElementById(
        "game"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const stagePanel =
    document.getElementById(
        "stagePanel"
    );


/* =========================================================
   MATERIAIS
   IMPORTANTE:
   Este bloco vem ANTES do init().
========================================================= */

const materials = {

    grass:
        new THREE.MeshStandardMaterial({
            color:
                0x4f8d3b
        }),

    dirt:
        new THREE.MeshStandardMaterial({
            color:
                0x8a5a35
        }),

    dirtDark:
        new THREE.MeshStandardMaterial({
            color:
                0x704326
        }),

    wood:
        new THREE.MeshStandardMaterial({
            color:
                0x68432a
        }),

    wire:
        new THREE.MeshStandardMaterial({
            color:
                0x4b4b4b,

            metalness:
                .6,

            roughness:
                .5
        }),

    leaf:
        new THREE.MeshStandardMaterial({
            color:
                0x286d2d
        }),

    tomato:
        new THREE.MeshStandardMaterial({
            color:
                0xc92f27,

            roughness:
                .65
        }),

    tomatoLight:
        new THREE.MeshStandardMaterial({
            color:
                0xf04432
        }),

    shirt:
        new THREE.MeshStandardMaterial({
            color:
                0x174b2c
        }),

    skin:
        new THREE.MeshStandardMaterial({
            color:
                0xc88b62
        }),

    pants:
        new THREE.MeshStandardMaterial({
            color:
                0x2c3440
        }),

    shoe:
        new THREE.MeshStandardMaterial({
            color:
                0x202020
        })

};


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function init() {

    createScene();

    createLights();

    createWorld();

    createField();

    createPlayer();

    createCamera();

    createRenderer();

    setupControls();

    setupStageMenu();

    updateHUD();

    animate();

}


/* =========================================================
   CENA
========================================================= */

function createScene() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x8fc8ff
        );

    scene.fog =
        new THREE.Fog(
            0x8fc8ff,
            35,
            125
        );

}


/* =========================================================
   LUZ
========================================================= */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x5a4630,
            2.2
        );

    scene.add(
        ambient
    );


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -20,
        35,
        20
    );

    sun.castShadow =
        true;

    scene.add(
        sun
    );

}


/* =========================================================
   MUNDO
========================================================= */

function createWorld() {

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                180,
                180
            ),
            materials.grass
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y =
        -.05;

    ground.receiveShadow =
        true;

    scene.add(
        ground
    );


    /*
       Corredor principal
    */

    const road =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                8,
                100
            ),
            materials.dirt
        );

    road.rotation.x =
        -Math.PI / 2;

    scene.add(
        road
    );


    /*
       Caminhos laterais
    */

    for (
        let x = -15;
        x <= 15;
        x += 10
    ) {

        const path =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    3,
                    100
                ),
                materials.dirtDark
            );

        path.rotation.x =
            -Math.PI / 2;

        path.position.x =
            x;

        path.position.y =
            .01;

        scene.add(
            path
        );

    }


    /*
       Pequenas pedras
    */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const stone =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .05 +
                    Math.random() * .08,
                    6,
                    6
                ),
                materials.dirtDark
            );

        stone.position.set(

            (Math.random() - .5) * 30,

            .04,

            (Math.random() - .5) * 90

        );

        scene.add(
            stone
        );

    }

}


/* =========================================================
   CAMPO
========================================================= */

function createField() {

    createTomatoRow(
        -7
    );

    createTomatoRow(
        7
    );

}


/* =========================================================
   FILEIRA
========================================================= */

function createTomatoRow(
    x
) {

    for (
        let z = -45;
        z <= 45;
        z += 5
    ) {

        createPlant(
            x,
            z
        );

    }


    /*
       Arames
    */

    for (
        let height = 1.4;
        height <= 2.8;
        height += .7
    ) {

        const wire =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .025,
                    .025,
                    90,
                    6
                ),
                materials.wire
            );

        wire.rotation.x =
            Math.PI / 2;

        wire.position.set(
            x,
            height,
            0
        );

        scene.add(
            wire
        );

    }

}


/* =========================================================
   PLANTA
========================================================= */

function createPlant(
    x,
    z
) {

    /*
       Palanque
    */

    const post =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .10,
                .13,
                3.4,
                8
            ),
            materials.wood
        );

    post.position.set(
        x,
        1.7,
        z
    );

    post.castShadow =
        true;

    scene.add(
        post
    );


    /*
       Cruzeta
    */

    const cross =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                .10,
                .10
            ),
            materials.wood
        );

    cross.position.set(
        x,
        3,
        z
    );

    scene.add(
        cross
    );


    /*
       Caule
    */

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .055,
                .08,
                2.5,
                6
            ),
            materials.leaf
        );

    stem.position.set(
        x,
        1.3,
        z
    );

    scene.add(
        stem
    );


    /*
       Folhas
    */

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const leaf =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .22,
                    7,
                    5
                ),
                materials.leaf
            );

        leaf.scale.y =
            .35;

        leaf.position.set(

            x +
            (Math.random() - .5) * .8,

            .8 +
            Math.random() * 2.1,

            z +
            (Math.random() - .5) * .35

        );

        scene.add(
            leaf
        );

    }


    /*
       Tomates
    */

    const amount =
        3 +
        Math.floor(
            Math.random() * 3
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        tomatoes.push(
            createTomato(
                x,
                z,
                i
            )
        );

    }

}


/* =========================================================
   TOMATE
========================================================= */

function createTomato(
    x,
    z,
    index
) {

    const tomato =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .24,
                12,
                10
            ),
            index % 2 === 0
                ? materials.tomato
                : materials.tomatoLight
        );


    const side =
        Math.random() > .5
            ? 1
            : -1;


    tomato.position.set(

        x +
        side *
        (.30 +
        Math.random() * .35),

        .95 +
        Math.random() * 1.8,

        z +
        (Math.random() - .5) * .35

    );


    tomato.scale.y =
        .82;


    tomato.castShadow =
        true;


    tomato.userData.harvested =
        false;


    scene.add(
        tomato
    );


    /*
       Cabinho
    */

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .025,
                .025,
                .15,
                5
            ),
            materials.leaf
        );

    stem.position.copy(
        tomato.position
    );

    stem.position.y +=
        .22;

    scene.add(
        stem
    );


    tomato.userData.stem =
        stem;


    return tomato;

}

/* =========================================================
   TOUCH
========================================================= */

function bindTouch(
    id,
    direction
) {

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[direction] =
                true;

        }
    );


    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys[direction] =
                false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[direction] =
                false;

        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keys[direction] =
                false;

        }
    );

}

/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(
    delta
) {

    if (
        !gameStarted ||
        gameOver ||
        selectedStage !==
        "harvest"
    ) {
        return;
    }


    let dx = 0;

    let dz = 0;


    if (keys.left)
        dx -= 1;

    if (keys.right)
        dx += 1;

    if (keys.up)
        dz -= 1;

    if (keys.down)
        dz += 1;


    if (
        dx === 0 &&
        dz === 0
    ) {
        return;
    }


    const length =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    dx /=
        length;

    dz /=
        length;


    const speed =
        PLAYER_SPEED *
        delta;


    player.position.x +=
        dx * speed;


    player.position.z +=
        dz * speed;


    /*
       Corredor
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -3.2,
            3.2
        );


    /*
       Limites
    */

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -45,
            40
        );


    /*
       Rotação
    */

    if (
        Math.abs(dx) >
        Math.abs(dz)
    ) {

        player.rotation.y =
            dx > 0
                ? Math.PI / 2
                : -Math.PI / 2;

    } else {

        player.rotation.y =
            dz > 0
                ? Math.PI
                : 0;

    }

}


/* =========================================================
   CÂMERA
========================================================= */

function updateCamera() {

    if (!player)
        return;


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.2,
            player.position.z
        );


    const desired =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 5.8,
            player.position.z + 7.5
        );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target
    );

}


/* =========================================================
   COLHER
========================================================= */

function harvestNearest() {

    if (
        !gameStarted ||
        gameOver ||
        selectedStage !==
        "harvest"
    ) {
        return;
    }


    let nearest =
        null;

    let nearestDistance =
        Infinity;


    tomatoes.forEach(
        tomato => {

            if (
                tomato.userData.harvested
            ) {
                return;
            }


            const distance =
                player.position.distanceTo(
                    tomato.position
                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearest =
                    tomato;

            }

        }
    );


    if (
        !nearest ||
        nearestDistance >
        HARVEST_DISTANCE
    ) {

        showMessage(
            "🍅 Chegue mais perto!"
        );

        return;

    }


    nearest.userData.harvested =
        true;


    scene.remove(
        nearest
    );


    if (
        nearest.userData.stem
    ) {

        scene.remove(
            nearest.userData.stem
        );

    }


    score++;


    updateHUD();


    showMessage(
        "🍅 Tomate colhido! +1"
    );


    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            30
        );

    }


    const remaining =
        tomatoes.filter(
            tomato =>
                !tomato.userData.harvested
        ).length;


    if (
        remaining === 0
    ) {

        finishHarvest();

    }

}

/* =========================================================
   REINICIAR
========================================================= */

function restartGame() {

    tomatoes.forEach(
        tomato => {

            if (
                tomato.parent
            ) {

                tomato.parent.remove(
                    tomato
                );

            }


            if (
                tomato.userData.stem &&
                tomato.userData.stem.parent
            ) {

                tomato.userData.stem.parent.remove(
                    tomato.userData.stem
                );

            }

        }
    );


    tomatoes =
        [];


    createField();


    player.position.set(
        0,
        0,
        38
    );


    score =
        0;


    timeLeft =
        GAME_TIME;


    gameStarted =
        true;


    gameOver =
        false;


    updateHUD();


    showMessage(
        "↻ Nova colheita!"
    );

}

========================================================= */

function updateTimer(
    delta
) {

    if (
        !gameStarted ||
        gameOver ||
        selectedStage !==
        "harvest"
    ) {
        return;
    }


    timeLeft -=
        delta;


    if (
        timeLeft <= 0
    ) {

        timeLeft =
            0;


        gameOver =
            true;


        showMessage(
            "⏱ Tempo encerrado!"
        );


        setTimeout(
            () => {

                startScreen
                    .classList

                        "hidden"
                    );

            600
        );

    updateHUD();

}

        let i = 0;
        i < 12;
        i++
    ) {

            document.createElement(
                "button"
            );


        sprout.className =
            "sprout";


        sprout.style.left =
            (
                20 +
                Math.random() * 60
            ) + "%";


        sprout.style.top =
            (
                10 +
                Math.random() * 78
            ) + "%";


        sprout.dataset.correct =
            Math.random() >
            .35
                ? "true"
                : "false";


        sprout.addEventListener(
            "click",
            () => {

                if (
                    sprout.dataset.correct ===
                    "true"
                ) {

                    sprout.remove();


                    showMessage(
                        "🌱 Broto retirado!"
                    );

                } else {

                    sprout.style.background =
                        "#c94a35";


                    showMessage(
                        "⚠️ Esse broto deve ficar!"
                    );

                }

            }
        );


        plant.appendChild(
            sprout
        );

    }

}

) {

    if (
        button.dataset.done ===
        "true"
    ) {
        return;
    }


    button.dataset.done =
        "true";


    button.textContent =
        "✓";


    button.style.background =
        "#174b2c";

        "white";


    tiedPoints++;

    showMessage(

            closeStage,

        "";


    const types = [
        "EXT B",
        "1A",
        "2A",
        "EXT"
    ];


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const tomato =
            document.createElement(
                "button"
            );


        tomato.className =
            "selection-tomato";


        tomato.textContent =
            "🍅";


        tomato.dataset.type =
            types[
                Math.floor(
                    Math.random() *
                    types.length
                )
            ];


        tomato.addEventListener(
            "click",
            () => {

                currentTomatoType =
                    tomato.dataset.type;


                showMessage(
                    "Tomate selecionado: " +
                    currentTomatoType
                );

            }
        );


        area.appendChild(
            tomato
        );

    }


    document
        .querySelectorAll(
            ".selection-box"
        )
        .forEach(
            box => {

                box.dataset.ready =
                    "true";

            }
        );

}


/* =========================================================
   CATEGORIA DO TOMATE
========================================================= */

function selectTomatoCategory(
    event
) {

    if (
        !currentTomatoType
    ) {

        showMessage(
            "🍅 Primeiro escolha um tomate!"
        );

        return;

    }


    const correct =
        event.currentTarget.dataset.type ===
        currentTomatoType;


    if (
        correct
    ) {

        score +=
            40;


        showMessage(
            "📦 Classificação correta! +40"
        );

    } else {

        score -=
            10;


        if (
            score < 0
        ) {
            score = 0;
        }


        showMessage(
            "❌ Classificação incorreta!"
        );

    }


    const selected =
        document.querySelector(
            ".selection-tomato"
        );


    /*
       Remove o primeiro tomate
       selecionado visualmente.
    */

    const tomatoesOnScreen =
        document.querySelectorAll(
            ".selection-tomato"
        );


    for (
        const tomato of tomatoesOnScreen
    ) {

        if (
            tomato.dataset.type ===
            currentTomatoType
        ) {

            tomato.remove();

            break;

        }

    }


    currentTomatoType =
        "";


    updateHUD();

}


/* =========================================================
   FECHAR ETAPA
========================================================= */

function closeStage() {

    stagePanel.style.display =
        "none";


    startScreen.classList.remove(
        "hidden"
    );


    gameStarted =
        false;


    updateHUD();

}


/* =========================================================
   MENSAGEM
========================================================= */

function showMessage(
    text
) {

    messageElement.textContent =
        text;


    messageElement.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                messageElement
                    .classList
                    .remove(
                        "show"
                    );

            },
            1300
        );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );

}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animate(
    time = 0
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (time - lastTime) /
            1000,
            .05
        );


    lastTime =
        time;


    updatePlayer(
        delta
    );


    updateCamera();


    updateTimer(
        delta
    );


    /*
       Animação leve dos tomates
    */

    tomatoes.forEach(
        (tomato, index) => {

            if (
                tomato.userData.harvested
            ) {
                return;
            }


            tomato.rotation.y +=
                .003;


            const scale =
                1 +
                Math.sin(
                    time * .003 +
                    index
                ) *
                .025;


            tomato.scale.x =
                scale;

            tomato.scale.z =
                scale;

        }
    );


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   INICIA TUDO
   IMPORTANTE:
   init() fica SOMENTE AQUI,
   depois de materials.
========================================================= */

init();

</script>
