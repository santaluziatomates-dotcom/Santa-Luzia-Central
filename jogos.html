<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santa Luzia • Colheita</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#9fcdf1;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

.hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  gap:10px;
  pointer-events:none;
}

.hud-box{
  background:rgba(255,255,255,.90);
  border:1px solid rgba(20,70,35,.15);
  border-radius:14px;
  padding:9px 13px;
  color:#164b27;
  font-weight:800;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.hud-box small{
  display:block;
  font-size:10px;
  opacity:.65;
  margin-bottom:2px;
}

#mensagem{
  position:fixed;
  top:74px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(20,65,30,.9);
  color:white;
  padding:9px 16px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}

#mensagem.show{
  opacity:1;
}

#colher{
  position:fixed;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  border:0;
  border-radius:50px;
  padding:15px 30px;
  background:#c92825;
  color:#fff;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  display:none;
}

#colher.show{
  display:block;
}

.controles{
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:20;
  display:grid;
  grid-template-columns:52px 52px 52px;
  grid-template-rows:52px 52px;
  gap:5px;
}

.controles button{
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.85);
  color:#18532b;
  font-size:22px;
  font-weight:900;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  touch-action:none;
}

#cima{grid-column:2}
#baixo{grid-column:2}
#esq{grid-column:1;grid-row:2}
#dir{grid-column:3;grid-row:2}

#reiniciar{
  position:fixed;
  bottom:18px;
  right:18px;
  z-index:20;
  border:0;
  background:white;
  color:#18532b;
  border-radius:13px;
  padding:12px 15px;
  font-weight:800;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

#resultado{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(5,25,12,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.result-card{
  width:min(390px,100%);
  background:white;
  border-radius:24px;
  padding:28px;
  text-align:center;
  color:#164b27;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.result-card h1{
  font-size:26px;
  margin-bottom:10px;
}

.result-card p{
  margin-bottom:20px;
}

.result-card button{
  border:0;
  border-radius:14px;
  padding:14px 22px;
  background:#17632d;
  color:white;
  font-weight:900;
  font-size:16px;
}

@media (min-width:800px){
  .controles{
    display:none;
  }
}

@media (max-width:600px){
  .hud-box{
    padding:8px 10px;
    font-size:13px;
  }

  #mensagem{
    top:68px;
    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="game"></div>

<div class="hud">
  <div class="hud-box">
    <small>🍅 COLHEITA</small>
    <span id="pontuacao">0 tomates</span>
  </div>

  <div class="hud-box">
    <small>⏱️ TEMPO</small>
    <span id="tempo">60s</span>
  </div>
</div>

<div id="mensagem"></div>

<button id="colher">🍅 COLHER TOMATE</button>

<div class="controles">
  <button id="cima">▲</button>
  <button id="esq">◀</button>
  <button id="dir">▶</button>
  <button id="baixo">▼</button>
</div>

<button id="reiniciar">↻ Reiniciar</button>

<div id="resultado">
  <div class="result-card">
    <h1>🍅 Colheita encerrada!</h1>
    <p id="resultadoTexto"></p>
    <button id="jogarNovamente">Jogar novamente</button>
  </div>
</div>

<script type="module">

import * as THREE from "three";

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const GAME_TIME = 60;

const FIELD_LENGTH = 105;

const PLANTS_PER_ROW = 18;

const PLANT_SPACING = 5.7;

const ROW_X = 6.5;

const ROAD_WIDTH = 8.5;


/* =========================================================
   CENA
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9fcff2);

scene.fog = new THREE.Fog(
  0x9fcff2,
  45,
  145
);


/* =========================================================
   CÂMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
  62,
  window.innerWidth / window.innerHeight,
  0.1,
  250
);

camera.position.set(
  0,
  5.5,
  10
);


/* =========================================================
   RENDER
========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.25)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.05;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LUZ
========================================================= */

const hemi = new THREE.HemisphereLight(
  0xbde4ff,
  0x49632c,
  2.2
);

scene.add(hemi);


const sunLight = new THREE.DirectionalLight(
  0xfff2cf,
  4
);

sunLight.position.set(
  -35,
  45,
  25
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;

sunLight.shadow.camera.left = -45;
sunLight.shadow.camera.right = 45;
sunLight.shadow.camera.top = 55;
sunLight.shadow.camera.bottom = -80;

scene.add(sunLight);


/* =========================================================
   SOL
========================================================= */

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(5,20,20),
  new THREE.MeshBasicMaterial({
    color:0xffe38a
  })
);

sun.position.set(
  -38,
  35,
  -55
);

scene.add(sun);


/* =========================================================
   NUVENS
========================================================= */

const clouds = [];

function createCloud(x,y,z,scale=1){

  const group = new THREE.Group();

  const material =
    new THREE.MeshLambertMaterial({
      color:0xffffff,
      transparent:true,
      opacity:.9
    });

  const parts = [
    [-2,0,0,1.4],
    [0,0.5,0,1.8],
    [2,0,0,1.3],
    [.7,.8,.2,1.25],
    [-.8,.7,.1,1.1]
  ];

  parts.forEach(p=>{

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(
        p[3],
        10,
        10
      ),
      material
    );

    mesh.position.set(
      p[0],
      p[1],
      p[2]
    );

    group.add(mesh);

  });

  group.position.set(x,y,z);

  group.scale.setScalar(scale);

  scene.add(group);

  clouds.push(group);
}

createCloud(-25,29,-45,1.4);
createCloud(15,32,-65,1.7);
createCloud(40,27,-35,1.1);
createCloud(-50,25,5,1.3);


/* =========================================================
   MATERIAIS
========================================================= */

const grassMaterial =
  new THREE.MeshLambertMaterial({
    color:0x4e8738
  });

const roadMaterial =
  new THREE.MeshLambertMaterial({
    color:0x9b7048
  });

const soilMaterial =
  new THREE.MeshLambertMaterial({
    color:0x765032
  });

const soilDarkMaterial =
  new THREE.MeshLambertMaterial({
    color:0x513722
  });

const woodMaterial =
  new THREE.MeshLambertMaterial({
    color:0x694224
  });

const woodLightMaterial =
  new THREE.MeshLambertMaterial({
    color:0x8c5b31
  });

const wireMaterial =
  new THREE.MeshBasicMaterial({
    color:0x353535
  });

const leafMaterial =
  new THREE.MeshLambertMaterial({
    color:0x27752d
  });

const leafLightMaterial =
  new THREE.MeshLambertMaterial({
    color:0x42943b
  });

const stemMaterial =
  new THREE.MeshLambertMaterial({
    color:0x397332
  });

const tomatoGreen =
  new THREE.MeshLambertMaterial({
    color:0x4d8f2d
  });

const tomatoYellow =
  new THREE.MeshLambertMaterial({
    color:0xe0bd32
  });

const tomatoRed =
  new THREE.MeshLambertMaterial({
    color:0xc92b25
  });

const flowerWhite =
  new THREE.MeshLambertMaterial({
    color:0xfffdf0
  });

const flowerYellow =
  new THREE.MeshLambertMaterial({
    color:0xf0c62e
  });


/* =========================================================
   TERRENO
========================================================= */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(
    180,
    180
  ),
  grassMaterial
);

ground.rotation.x = -Math.PI / 2;

ground.position.y = -0.08;

ground.receiveShadow = true;

scene.add(ground);


/* estrada */

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(
    ROAD_WIDTH,
    FIELD_LENGTH + 35
  ),
  roadMaterial
);

road.rotation.x = -Math.PI / 2;

road.position.set(
  0,
  0,
  -FIELD_LENGTH / 2 + 5
);

road.receiveShadow = true;

scene.add(road);


/* terra das duas fileiras */

for(const x of [-ROW_X,ROW_X]){

  const soil = new THREE.Mesh(
    new THREE.PlaneGeometry(
      5.8,
      FIELD_LENGTH + 20
    ),
    soilMaterial
  );

  soil.rotation.x = -Math.PI / 2;

  soil.position.set(
    x,
    .01,
    -FIELD_LENGTH/2 + 3
  );

  scene.add(soil);
}


/* =========================================================
   DETALHES DO CHÃO
========================================================= */

function addGroundDetails(){

  for(let i=0;i<120;i++){

    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        .06 + Math.random()*.13,
        0
      ),
      soilDarkMaterial
    );

    rock.position.set(
      THREE.MathUtils.randFloat(-14,14),
      .05,
      THREE.MathUtils.randFloat(
        -FIELD_LENGTH,
        8
      )
    );

    rock.scale.y = .45;

    scene.add(rock);
  }


  for(let i=0;i<150;i++){

    const grass = new THREE.Mesh(
      new THREE.ConeGeometry(
        .035 + Math.random()*.035,
        .25 + Math.random()*.25,
        4
      ),
      leafLightMaterial
    );

    grass.position.set(
      THREE.MathUtils.randFloat(-15,15),
      .08,
      THREE.MathUtils.randFloat(
        -FIELD_LENGTH,
        8
      )
    );

    grass.rotation.y =
      Math.random()*Math.PI;

    scene.add(grass);
  }
}

addGroundDetails();


/* =========================================================
   FUNÇÕES DE GEOMETRIA
========================================================= */

function cylinderBetween(
  a,
  b,
  radius,
  material,
  segments=8
){

  const direction =
    new THREE.Vector3()
      .subVectors(b,a);

  const length =
    direction.length();

  const geometry =
    new THREE.CylinderGeometry(
      radius,
      radius,
      length,
      segments
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    direction.normalize()
  );

  mesh.castShadow = true;

  return mesh;
}


/* =========================================================
   ESTRUTURA DA ROÇA
========================================================= */

function createPalanque(x,z){

  const group = new THREE.Group();

  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .12,.16,4.4,8
    ),
    woodMaterial
  );

  post.position.y = 2.1;

  post.castShadow = true;

  group.add(post);


  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .10,.12,1.4,8
    ),
    woodLightMaterial
  );

  top.rotation.z = Math.PI/2;

  top.position.y = 4.05;

  group.add(top);

  group.position.set(x,0,z);

  scene.add(group);

  return group;
}


function createCruzeta(x,z){

  const group = new THREE.Group();

  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .12,.16,4.4,8
    ),
    woodMaterial
  );

  post.position.y = 2.1;

  group.add(post);


  const cross = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .09,.11,2.8,8
    ),
    woodLightMaterial
  );

  cross.rotation.z = Math.PI/2;

  cross.position.y = 3.75;

  group.add(cross);

  group.position.set(x,0,z);

  scene.add(group);
}


function createVara(x,z,side){

  const bottom =
    new THREE.Vector3(
      x + side*1.65,
      .15,
      z
    );

  const top =
    new THREE.Vector3(
      x + side*.55,
      3.35,
      z
    );

  const vara =
    cylinderBetween(
      bottom,
      top,
      .045,
      woodLightMaterial,
      6
    );

  scene.add(vara);
}


function createMainWire(x){

  const points = [];

  for(
    let z=4;
    z>=-FIELD_LENGTH-5;
    z-=1
  ){

    points.push(
      new THREE.Vector3(
        x,
        3.45,
        z
      )
    );

  }

  const curve =
    new THREE.CatmullRomCurve3(
      points
    );

  const geometry =
    new THREE.TubeGeometry(
      curve,
      120,
      .018,
      5,
      false
    );

  const wire =
    new THREE.Mesh(
      geometry,
      wireMaterial
    );

  scene.add(wire);
}


function createSupportStructure(x){

  createPalanque(x,3);

  createMainWire(x);

  let supportIndex=0;

  for(
    let z=-2;
    z>-FIELD_LENGTH;
    z-=PLANT_SPACING*8
  ){

    if(supportIndex%2===0){
      createCruzeta(x,z);
    }else{
      createPalanque(x,z);
    }

    supportIndex++;
  }
}

createSupportStructure(-ROW_X);
createSupportStructure(ROW_X);


/* =========================================================
   FOLHAS
========================================================= */

function createLeaf(
  parent,
  x,
  y,
  z,
  scale,
  rotationX,
  rotationY,
  rotationZ
){

  const geometry =
    new THREE.SphereGeometry(
      1,
      6,
      4
    );

  const leaf =
    new THREE.Mesh(
      geometry,
      Math.random()>.45
        ? leafMaterial
        : leafLightMaterial
    );

  leaf.scale.set(
    scale*1.35,
    scale*.18,
    scale*.65
  );

  leaf.position.set(
    x,y,z
  );

  leaf.rotation.set(
    rotationX,
    rotationY,
    rotationZ
  );

  leaf.castShadow = true;

  parent.add(leaf);
}


/* =========================================================
   TOMATES
========================================================= */

const tomatoObjects=[];

function createTomato(
  parent,
  x,
  y,
  z,
  stage
){

  const material =
    stage===0
      ? tomatoGreen
      : stage===1
        ? tomatoYellow
        : tomatoRed;

  const size =
    stage===2
      ? .20
      : .17;

  const tomato =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        size,
        8,
        8
      ),
      material
    );

  tomato.scale.y=.92;

  tomato.position.set(
    x,y,z
  );

  tomato.castShadow=true;

  tomato.userData.mature =
    stage===2;

  tomato.userData.baseY = y;

  parent.add(tomato);

  if(stage===2){
    tomatoObjects.push(tomato);
  }
}


/* =========================================================
   FLORES
========================================================= */

function createFlower(
  parent,
  x,y,z
){

  const flower =
    new THREE.Group();

  for(let i=0;i<5;i++){

    const petal =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .10,
          6,
          6
        ),
        flowerWhite
      );

    const angle =
      (Math.PI*2/5)*i;

    petal.position.set(
      Math.cos(angle)*.13,
      0,
      Math.sin(angle)*.13
    );

    petal.scale.set(
      .8,
      .25,
      .5
    );

    flower.add(petal);
  }


  const center =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .07,
        6,
        6
      ),
      flowerYellow
    );

    flower.add(center);

    flower.position.set(
      x,y,z
    );

    parent.add(flower);
}


/* =========================================================
   TOMATEIRO REALISTA PROCEDURAL
========================================================= */

function createTomatoPlant(
  x,
  z,
  rowSide,
  index
){

  const plant =
    new THREE.Group();

  plant.position.set(
    x,
    0,
    z
  );


  /* caule principal */

  const stem =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .055,
        .09,
        3.15,
        7
      ),
      stemMaterial
    );

  stem.position.y=1.58;

  stem.castShadow=true;

  plant.add(stem);


  /* ramificações */

  const branchLevels=[
    .65,
    1.05,
    1.45,
    1.85,
    2.2,
    2.55,
    2.8
  ];


  branchLevels.forEach(
    (y,i)=>{

      const side =
        i%2===0 ? -1 : 1;

      const length =
        .75 + Math.random()*.35;

      const start =
        new THREE.Vector3(
          0,
          y,
          0
        );

      const end =
        new THREE.Vector3(
          side*length,
          y+.22,
          THREE.MathUtils.randFloat(
            -.12,.12
          )
        );

      const branch =
        cylinderBetween(
          start,
          end,
          .035,
          stemMaterial,
          5
        );

      plant.add(branch);


      /* folhas de cada galho */

      for(let j=0;j<4;j++){

        const t=j/3;

        createLeaf(
          plant,
          THREE.MathUtils.lerp(
            start.x,
            end.x,
            t
          ) + THREE.MathUtils.randFloat(-.12,.12),
          THREE.MathUtils.lerp(
            start.y,
            end.y,
            t
          ) + .12,
          THREE.MathUtils.randFloat(-.12,.12),
          .7,
          .25 + Math.random()*.15,
          Math.random()*Math.PI,
          side>0 ? -.35 : .35
        );
      }

    }
  );


  /* folhas superiores */

  for(let i=0;i<16;i++){

    const y =
      .65 + Math.random()*2.35;

    const side =
      Math.random()<.5 ? -1 : 1;

    createLeaf(
      plant,
      side*(.35+Math.random()*.85),
      y,
      THREE.MathUtils.randFloat(-.3,.3),
      .32+Math.random()*.16,
      .45+Math.random()*.5,
      Math.random()*Math.PI,
      side*.4
    );
  }


  /* cachos */

  const clusterHeights=[
    .9,
    1.35,
    1.8,
    2.2,
    2.6
  ];


  clusterHeights.forEach(
    (y,clusterIndex)=>{

      const side =
        clusterIndex%2===0
          ? -1
          : 1;

      const cx =
        side*(.45+Math.random()*.45);

      const cz =
        THREE.MathUtils.randFloat(
          -.18,.18
        );


      /* galhinho do cacho */

      const branch =
        cylinderBetween(
          new THREE.Vector3(
            0,y,0
          ),
          new THREE.Vector3(
            cx,
            y+.05,
            cz
          ),
          .025,
          stemMaterial,
          5
        );

      plant.add(branch);


      const tomatoCount =
        4 + Math.floor(
          Math.random()*3
        );


      for(
        let t=0;
        t<tomatoCount;
        t++
      ){

        const angle =
          Math.PI*2*t/tomatoCount;

        const radius =
          .12 + Math.random()*.10;

        const stageRoll =
          Math.random();

        let stage;

        if(stageRoll<.43){
          stage=0;
        }else if(stageRoll<.68){
          stage=1;
        }else{
          stage=2;
        }

        createTomato(
          plant,
          cx + Math.cos(angle)*radius,
          y-.13 + Math.sin(t)*.07,
          cz + Math.sin(angle)*radius,
          stage
        );
      }

      /* algumas flores */

      if(clusterIndex===0 || clusterIndex===2){

        createFlower(
          plant,
          cx*.65,
          y+.22,
          cz
        );

      }

    }
  );


  /* pequeno apoio do pé */

  const base =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .11,.14,.35,7
      ),
      stemMaterial
    );

  base.position.y=.18;

  plant.add(base);


  scene.add(plant);
}


/* =========================================================
   PLANTAÇÃO
========================================================= */

for(let row=0;row<2;row++){

  const x =
    row===0
      ? -ROW_X
      : ROW_X;

  for(
    let i=0;
    i<PLANTS_PER_ROW;
    i++
  ){

    const z =
      -i*PLANT_SPACING;

    createTomatoPlant(
      x,
      z,
      row===0 ? -1 : 1,
      i
    );


    /* varinhas alternadas */

    const side =
      i%2===0 ? -1 : 1;

    createVara(
      x,
      z,
      side
    );
  }
}

/* =========================================================
   MOVIMENTO
========================================================= */

const keys={
  up:false,
  down:false,
  left:false,
  right:false
};


function setKey(
  key,
  value
){

  keys[key]=value;
}


window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){
      setKey("up",true);
    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){
      setKey("down",true);
    }

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){
      setKey("left",true);
    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){
      setKey("right",true);
    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){
      setKey("up",false);
    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){
      setKey("down",false);
    }

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){
      setKey("left",false);
    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){
      setKey("right",false);
    }

  }
);


/* controles mobile */

function bindButton(
  id,
  key
){

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      setKey(key,true);
    }
  );

  button.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      setKey(key,false);
    }
  );

  button.addEventListener(
    "pointercancel",
    ()=>{
      setKey(key,false);
    }
  );

  button.addEventListener(
    "pointerleave",
    ()=>{
      setKey(key,false);
    }
  );
}

/* =========================================================
   COLHEITA
========================================================= */

let score=0;

let gameTime=GAME_TIME;

let gameRunning=true;

let nearestTomato=null;


const scoreElement =
  document.getElementById(
    "pontuacao"
  );

const timeElement =
  document.getElementById(
    "tempo"
  );

const messageElement =
  document.getElementById(
    "mensagem"
  );

const harvestButton =
  document.getElementById(
    "colher"
  );


function showMessage(text){

  messageElement.textContent=text;

  messageElement.classList.add("show");

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer =
    setTimeout(
      ()=>{
        messageElement.classList.remove("show");
      },
      1500
    );
}


function updateScore(){

  scoreElement.textContent =
    score===1
      ? "1 tomate"
      : `${score} tomates`;
}


function findNearestTomato(){

  nearestTomato=null;

  let best=999;

  const playerPosition =
    new THREE.Vector3();

  player.getWorldPosition(
    playerPosition
  );

  for(
    const tomato of tomatoObjects
  ){

    if(!tomato.visible) continue;

    const pos =
      new THREE.Vector3();

    tomato.getWorldPosition(pos);

    const distance =
      playerPosition.distanceTo(pos);

    if(
      distance<best &&
      distance<4.5
    ){

      best=distance;

      nearestTomato=tomato;
    }
  }


  if(nearestTomato){

    harvestButton.classList.add(
      "show"
    );

  }else{

    harvestButton.classList.remove(
      "show"
    );

  }
}


function harvest(){

  if(
    !gameRunning ||
    !nearestTomato
  ) return;


  nearestTomato.visible=false;

  score++;

  updateScore();

  showMessage(
    "🍅 Tomate colhido!"
  );

  nearestTomato=null;

  harvestButton.classList.remove(
    "show"
  );
}


harvestButton.addEventListener(
  "click",
  harvest
);


/* =========================================================
   TEMPO
========================================================= */

const clock =
  new THREE.Clock();

let secondCounter=0;


function finishGame(){

  gameRunning=false;

  harvestButton.classList.remove(
    "show"
  );

  document.getElementById(
    "resultadoTexto"
  ).textContent =
    `Você colheu ${score} ${

}

/* =========================================================
   ANIMAÇÃO
========================================================= */

const cameraTarget =
  new THREE.Vector3();

function animate(){

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      .05
    );


  /* tempo */

  if(gameRunning){

    secondCounter+=delta;

    if(
      secondCounter>=1
    ){

      secondCounter=0;

      gameTime--;

      timeElement.textContent =
        `${Math.max(
          gameTime,
          0
        )}s`;

      if(
        gameTime<=0
      ){

        finishGame();

      }

    }
  }


  /* movimento */

  if(gameRunning){

    const speed =
      3.8*delta;

    if(keys.up){
      player.position.z-=speed;
    }

    if(keys.down){
      player.position.z+=speed;
    }

    if(keys.left){
      player.position.x-=speed;
    }

    if(keys.right){
      player.position.x+=speed;
    }


    player.position.x =
      THREE.MathUtils.clamp(
        player.position.x,
        -3.2,
        3.2
      );

    player.position.z =
      THREE.MathUtils.clamp(
        player.position.z,
        -FIELD_LENGTH+4,
        7
      );
  }


  /* procurar tomate */

  findNearestTomato();


  /* pequenas variações dos tomates */

  const time =
    performance.now()*.002;

  tomatoObjects.forEach(
    (tomato,index)=>{

      if(!tomato.visible)
        return;

      tomato.position.y =
        tomato.userData.baseY +
        Math.sin(
          time + index
        )*.015;

    }
  );


  /* nuvens */

  clouds.forEach(
    cloud=>{

      cloud.position.x +=
        delta*.35;

      if(
        cloud.position.x>65
      ){
        cloud.position.x=-65;
      }

    }
  );


  /* câmera */

  cameraTarget.set(
    player.position.x,
    player.position.y+1.2,
    player.position.z
  );

  const desiredCamera =
    new THREE.Vector3(
      player.position.x,
      player.position.y+5.2,
      player.position.z+8.5
    );

  camera.position.lerp(
    desiredCamera,
    .075
  );

  camera.lookAt(
    cameraTarget
  );


  renderer.render(
    scene,
    camera
  );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.25
      )
    );

  }
);

</script>
