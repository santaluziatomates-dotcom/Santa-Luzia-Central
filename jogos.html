<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Santa Luzia Games • Colheita</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #9cc9ef;
    font-family: Arial, Helvetica, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

.hud {
    position: fixed;
    top: 18px;
    left: 18px;
    right: 18px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.hud-card {
    min-width: 150px;
    padding: 12px 18px;
    background: rgba(255,255,255,.94);
    border: 2px solid rgba(255,255,255,.8);
    border-radius: 22px;
    box-shadow:
        0 5px 18px rgba(0,0,0,.15),
        inset 0 1px 0 rgba(255,255,255,.8);
    color: #234b32;
}

.hud-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
}

.hud-value {
    margin-top: 3px;
    font-size: 30px;
    font-weight: 800;
}

#message {
    position: fixed;
    left: 50%;
    bottom: 160px;
    transform: translateX(-50%);
    z-index: 25;

    max-width: 330px;
    padding: 14px 22px;

    background: rgba(30,86,50,.94);
    color: white;

    border-radius: 24px;

    font-size: 17px;
    font-weight: 700;
    text-align: center;

    box-shadow: 0 6px 20px rgba(0,0,0,.22);

    opacity: 0;
    pointer-events: none;

    transition: opacity .2s ease;
}

#message.show {
    opacity: 1;
}

/* =========================
   CONTROLES
========================= */

.controls {
    position: fixed;
    left: 18px;
    bottom: 28px;
    z-index: 30;

    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px;
    gap: 10px;
}

.control {
    width: 64px;
    height: 64px;

    border: 0;
    border-radius: 20px;

    background: rgba(255,255,255,.94);
    color: #245536;

    font-size: 30px;
    font-weight: 900;

    box-shadow: 0 5px 15px rgba(0,0,0,.16);

    touch-action: manipulation;
}

.control:active {
    transform: scale(.94);
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

/* =========================
   BOTÕES
========================= */

.actions {
    position: fixed;
    right: 18px;
    bottom: 28px;
    z-index: 30;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.action {
    min-width: 190px;
    min-height: 58px;

    border: 0;
    border-radius: 20px;

    font-size: 18px;
    font-weight: 800;

    box-shadow: 0 5px 15px rgba(0,0,0,.16);

    touch-action: manipulation;
}

.harvest {
    background: #245b35;
    color: white;
}

.restart {
    background: rgba(255,255,255,.95);
    color: #245b35;
}

.action:active {
    transform: scale(.96);
}

/* =========================
   RESULTADO
========================= */

#result {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(15,35,24,.72);
    backdrop-filter: blur(6px);
}

.result-card {
    width: min(90%, 360px);
    padding: 28px;

    background: white;
    border-radius: 28px;

    text-align: center;

    box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.result-card h1 {
    margin: 0 0 12px;
    color: #245b35;
}

.result-card p {
    color: #4d5c52;
    font-size: 18px;
}

.result-card button {
    width: 100%;
    padding: 15px;

    border: 0;
    border-radius: 16px;

    background: #245b35;
    color: white;

    font-size: 17px;
    font-weight: 800;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .hud {
        top: 14px;
        left: 12px;
        right: 12px;
    }

    .hud-card {
        min-width: 125px;
        padding: 10px 14px;
        border-radius: 18px;
    }

    .hud-label {
        font-size: 13px;
    }

    .hud-value {
        font-size: 24px;
    }

    .controls {
        left: 12px;
        bottom: 18px;

        grid-template-columns: 58px 58px 58px;
        grid-template-rows: 58px 58px;
    }

    .control {
        width: 58px;
        height: 58px;
        border-radius: 18px;
    }

    .actions {
        right: 12px;
        bottom: 18px;
    }

    .action {
        min-width: 160px;
        min-height: 54px;
        font-size: 16px;
    }

    #message {
        bottom: 145px;
        max-width: 290px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- HUD -->
<div class="hud">

    <div class="hud-card">
        <div class="hud-label">🍅 SANTA LUZIA</div>
        <div class="hud-value">
            <span id="score">0</span> tomates
        </div>
    </div>

    <div class="hud-card">
        <div class="hud-label">⏱️ TEMPO</div>
        <div class="hud-value">
            <span id="time">60</span>
        </div>
    </div>

</div>

<div id="message"></div>

<!-- CONTROLES -->
<div class="controls">

    <button class="control up" data-key="ArrowUp">▲</button>
    <button class="control left" data-key="ArrowLeft">◀</button>
    <button class="control down" data-key="ArrowDown">▼</button>
    <button class="control right" data-key="ArrowRight">▶</button>

</div>

<!-- AÇÕES -->
<div class="actions">

    <button class="action harvest" id="harvest">
        🍅 COLHER
    </button>

    <button class="action restart" id="restart">
        ↻ RECOMEÇAR
    </button>

</div>

<!-- RESULTADO -->
<div id="result">

    <div class="result-card">

        <h1>🍅 Colheita encerrada!</h1>

        <p>
            Você colheu
            <strong id="finalScore">0</strong>
            tomates.
        </p>

        <button id="resultRestart">
            JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const GAME_TIME = 60;

const FIELD_LENGTH = 110;

const PLANT_SPACING = 2.25;

const PLANTS_PER_SECTION = 8;

const ROW_X = 6.4;

const ROAD_WIDTH = 8.5;


/* =========================================================
   CENA
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9fcdf1);

scene.fog = new THREE.Fog(
    0x9fcdf1,
    65,
    170
);


/* =========================================================
   CÂMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    62,
    window.innerWidth / window.innerHeight,
    0.1,
    300
);

camera.position.set(
    0,
    5.5,
    9
);


/* =========================================================
   RENDER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.6)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.05;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   ILUMINAÇÃO
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xd8edff,
    0x657449,
    1.9
);

scene.add(ambient);


const sunLight = new THREE.DirectionalLight(
    0xfff0c2,
    3.5
);

sunLight.position.set(
    -35,
    60,
    35
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;

sunLight.shadow.camera.left = -70;
sunLight.shadow.camera.right = 70;
sunLight.shadow.camera.top = 70;
sunLight.shadow.camera.bottom = -70;

sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 180;

scene.add(sunLight);


/* =========================================================
   SOL
========================================================= */

const sun = new THREE.Mesh(

    new THREE.SphereGeometry(
        5,
        24,
        24
    ),

    new THREE.MeshBasicMaterial({
        color: 0xffdf72
    })

);

sun.position.set(
    -45,
    65,
    -75
);

scene.add(sun);


/* =========================================================
   CÉU / NUVENS
========================================================= */

function createCloud(
    x,
    y,
    z,
    scale = 1
) {

    const cloud = new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 1
        });


    const parts = [
        [-2, 0, 0, 1.7],
        [0, .3, 0, 2.1],
        [2, 0, 0, 1.6],
        [.8, .8, 0, 1.2]
    ];


    for (const p of parts) {

        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(
                p[3],
                12,
                8
            ),
            material
        );

        mesh.position.set(
            p[0],
            p[1],
            p[2]
        );

        cloud.add(mesh);
    }


    cloud.position.set(
        x,
        y,
        z
    );

    cloud.scale.setScalar(scale);

    scene.add(cloud);

    return cloud;
}


const clouds = [];

clouds.push(
    createCloud(-25, 35, -35, 1.7)
);

clouds.push(
    createCloud(25, 42, -70, 2.2)
);

clouds.push(
    createCloud(0, 32, -120, 1.5)
);

clouds.push(
    createCloud(55, 37, -25, 1.3)
);


/* =========================================================
   MATERIAIS
========================================================= */

const soilMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x87572f,
        roughness: 1
    });


const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x9d7044,
        roughness: 1
    });


const greenMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x6d9c4c,
        roughness: 1
    });


const woodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x6d4427,
        roughness: .95
    });


const darkWoodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4d2e1d,
        roughness: 1
    });


const wireMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x242820,
        roughness: .75,
        metalness: .15
    });


/* =========================================================
   CHÃO
========================================================= */

function createGround() {

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(
            100,
            FIELD_LENGTH + 80
        ),
        greenMaterial
    );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.z =
        -FIELD_LENGTH / 2;

    ground.receiveShadow = true;

    scene.add(ground);


    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(
            ROAD_WIDTH,
            FIELD_LENGTH + 30
        ),
        roadMaterial
    );

    road.rotation.x =
        -Math.PI / 2;

    road.position.y =
        0.012;

    road.position.z =
        -FIELD_LENGTH / 2;

    road.receiveShadow = true;

    scene.add(road);


    // Faixas de terra onde ficam as plantas

    for (const x of [-ROW_X, ROW_X]) {

        const bed = new THREE.Mesh(
            new THREE.PlaneGeometry(
                4.5,
                FIELD_LENGTH + 30
            ),
            soilMaterial
        );

        bed.rotation.x =
            -Math.PI / 2;

        bed.position.set(
            x,
            0.025,
            -FIELD_LENGTH / 2
        );

        bed.receiveShadow = true;

        scene.add(bed);
    }
}

createGround();


/* =========================================================
   DETALHES DO SOLO
========================================================= */

function createGroundDetails() {

    const rockMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x513b29,
            roughness: 1
        });


    for (
        let i = 0;
        i < 180;
        i++
    ) {

        const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                0.06 + Math.random() * .08,
                0
            ),
            rockMaterial
        );


        const side =
            Math.random() > .5
                ? 1
                : -1;


        rock.position.set(
            side * (
                ROAD_WIDTH / 2 +
                Math.random() * 3.5
            ),
            .04,
            -Math.random() *
                FIELD_LENGTH
        );


        rock.rotation.y =
            Math.random() * Math.PI;


        scene.add(rock);
    }


    // pequenos matinhos

    const grassMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x39723a,
            roughness: 1
        });


    for (
        let i = 0;
        i < 220;
        i++
    ) {

        const grass =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    .025,
                    .15 + Math.random() * .15,
                    3
                ),
                grassMaterial
            );


        grass.position.set(
            (Math.random() - .5) * 80,
            .08,
            -Math.random() * FIELD_LENGTH
        );


        grass.rotation.z =
            (Math.random() - .5) * .6;


        scene.add(grass);
    }
}

createGroundDetails();


/* =========================================================
   FUNÇÃO PARA CRIAR CILINDRO ENTRE DOIS PONTOS
========================================================= */

function cylinderBetween(
    a,
    b,
    radius,
    material,
    segments = 7
) {

    const direction =
        new THREE.Vector3()
            .subVectors(b, a);

    const length =
        direction.length();


    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            segments
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(
        a.clone().add(b).multiplyScalar(.5)
    );


    mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
    );


    mesh.castShadow = true;

    return mesh;
}


/* =========================================================
   ESTRUTURA REAL DA PLANTAÇÃO
========================================================= */

function createMainPalanque(
    x,
    z
) {

    const group =
        new THREE.Group();


    const post = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .11,
            .14,
            4.2,
            8
        ),
        darkWoodMaterial
    );


    post.position.y =
        2.1;

    post.rotation.z =
        (Math.random() - .5) * .05;

    post.castShadow = true;

    group.add(post);


    // pequena ponta acima do arame

    const top = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .08,
            .09,
            .7,
            7
        ),
        woodMaterial
    );

    top.position.y =
        4.45;

    top.castShadow = true;

    group.add(top);


    group.position.set(
        x,
        0,
        z
    );


    scene.add(group);

    return group;
}


function createCruzeta(
    x,
    z
) {

    const group =
        new THREE.Group();


    const post = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .10,
            .14,
            4.1,
            8
        ),
        darkWoodMaterial
    );

    post.position.y =
        2.05;

    post.castShadow = true;

    group.add(post);


    // cruzeta horizontal

    const cross = new THREE.Mesh(
        new THREE.BoxGeometry(
            2.6,
            .16,
            .16
        ),
        woodMaterial
    );

    cross.position.y =
        3.55;

    cross.castShadow = true;

    group.add(cross);


    group.position.set(
        x,
        0,
        z
    );


    scene.add(group);

    return group;
}


/* =========================================================
   VARINHAS / APOIOS ALTERNADOS
========================================================= */

function createVara(
    x,
    z,
    side
) {

    const start =
        new THREE.Vector3(
            x + side * .95,
            .15,
            z
        );


    const end =
        new THREE.Vector3(
            x - side * .35,
            3.65,
            z
        );


    const vara =
        cylinderBetween(
            start,
            end,
            .045,
            woodMaterial,
            6
        );


    scene.add(vara);

    return vara;
}


/* =========================================================
   ARAME PRINCIPAL
========================================================= */

function createMainWire(
    x
) {

    const start =
        new THREE.Vector3(
            x,
            3.35,
            4
        );


    const end =
        new THREE.Vector3(
            x,
            3.35,
            -FIELD_LENGTH - 4
        );


    const wire =
        cylinderBetween(
            start,
            end,
            .025,
            wireMaterial,
            6
        );


    scene.add(wire);
}


/* =========================================================
   CRUZETAS + PALANQUES
========================================================= */

function createSupportStructure(
    x
) {

    // Primeiro palanque

    createMainPalanque(
        x,
        2
    );


    let section = 0;


    for (
        let z = -PLANTS_PER_SECTION * PLANT_SPACING;
        z > -FIELD_LENGTH;
        z -= PLANTS_PER_SECTION * PLANT_SPACING
    ) {

        section++;


        if (section % 2 === 1) {

            createCruzeta(
                x,
                z
            );

        } else {

            createMainPalanque(
                x,
                z
            );
        }
    }


    createMainWire(x);
}


createSupportStructure(-ROW_X);
createSupportStructure(ROW_X);


/* =========================================================
   FOLHA
========================================================= */

function createLeaf(
    position,
    scale,
    rotationY = 0
) {

    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color()
                    .setHSL(
                        .30 + Math.random() * .04,
                        .55,
                        .30 + Math.random() * .12
                    ),
            roughness: .95
        });


    const leaf =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1,
                7,
                5
            ),
            material
        );


    leaf.scale.set(
        scale * 1.4,
        scale * .22,
        scale * .65
    );


    leaf.position.copy(
        position
    );


    leaf.rotation.y =
        rotationY;

    leaf.rotation.z =
        (Math.random() - .5) * .5;


    leaf.castShadow = true;


    scene.add(leaf);

    return leaf;
}


/* =========================================================
   TOMATE
========================================================= */

const tomatoObjects = [];


function createTomato(
    position,
    color,
    mature = false,
    scale = 1
) {

    const group =
        new THREE.Group();


    const tomatoMaterial =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: .62,
            metalness: .02
        });


    const tomato =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .24 * scale,
                12,
                10
            ),
            tomatoMaterial
        );


    tomato.scale.y =
        1.05;


    tomato.castShadow = true;


    group.add(tomato);


    // parte verde do tomate

    const crown =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .10 * scale,
                .12 * scale,
                5
            ),
            new THREE.MeshStandardMaterial({
                color: 0x356d35,
                roughness: 1
            })
        );


    crown.position.y =
        .21 * scale;


    crown.rotation.x =
        Math.PI;


    group.add(crown);


    group.position.copy(
        position
    );


    group.userData.mature =
        mature;


    group.userData.tomato =
        true;


    scene.add(group);


    if (mature) {

        tomatoObjects.push(group);
    }


    return group;
}


/* =========================================================
   FLORES
========================================================= */

function createFlower(
    position,
    scale = 1
) {

    const group =
        new THREE.Group();


    const white =
        new THREE.MeshStandardMaterial({
            color: 0xf8f4dc,
            roughness: 1
        });


    const yellow =
        new THREE.MeshStandardMaterial({
            color: 0xe5bd3e,
            roughness: .8
        });


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const petal =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .075 * scale,
                    7,
                    5
                ),
                white
            );


        const angle =
            i *
            Math.PI *
            2 /
            5;


        petal.position.set(
            Math.cos(angle) *
                .10 * scale,
            0,
            Math.sin(angle) *
                .10 * scale
        );


        petal.scale.y =
            .55;


        group.add(petal);
    }


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .055 * scale,
                7,
                6
            ),
            yellow
        );


    center.position.y =
        .01;


    group.add(center);


    group.position.copy(
        position
    );


    scene.add(group);
}


/* =========================================================
   GALHOS
========================================================= */

function createBranch(
    base,
    end
) {

    const branch =
        cylinderBetween(
            base,
            end,
            .035,
            new THREE.MeshStandardMaterial({
                color: 0x3f6734,
                roughness: 1
            }),
            6
        );


    scene.add(branch);

    return branch;
}


/* =========================================================
   PÉ DE TOMATE
========================================================= */

function createTomatoPlant(
    x,
    z,
    index
) {

    const plant =
        new THREE.Group();


    // caule principal

    const stemMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x386438,
            roughness: 1
        });


    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .065,
                .09,
                3.25,
                7
            ),
            stemMaterial
        );


    stem.position.y =
        1.65;

    stem.castShadow = true;

    plant.add(stem);


    // pequenos galhos laterais

    const branchCount = 8;


    for (
        let b = 0;
        b < branchCount;
        b++
    ) {

        const y =
            .65 + b * .34;


        const direction =
            b % 2 === 0
                ? 1
                : -1;


        const base =
            new THREE.Vector3(
                0,
                y,
                0
            );


        const end =
            new THREE.Vector3(
                direction *
                    (.75 + Math.random() * .35),
                y +
                    (.15 + Math.random() * .2),
                (Math.random() - .5) * .4
            );


        const branch =
            createBranch(
                end.clone().add(
                    new THREE.Vector3(x,0,z)
                ),
                end.clone().add(
                    new THREE.Vector3(x,0,z)
                )
            );


        // corrigindo posição do galho dentro do grupo

        branch.position.sub(
            new THREE.Vector3(x,0,z)
        );


        plant.add(branch);


        // folhas

        for (
            let l = 0;
            l < 3;
            l++
        ) {

            const leaf =
                createLeaf(
                    new THREE.Vector3(
                        end.x +
                            (Math.random()-.5)*.35,
                        end.y +
                            (Math.random()-.5)*.25,
                        end.z +
                            (Math.random()-.5)*.35
                    ),
                    .42 + Math.random()*.18,
                    Math.random() * Math.PI
                );


            leaf.position.sub(
                new THREE.Vector3(x,0,z)
            );


            plant.add(leaf);
        }
    }


    /*
       FOLHAGEM EXTRA

       Isso deixa o pé mais cheio,
       parecido com a foto da plantação real.
    */

    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const y =
            .45 +
            Math.random() * 2.5;


        const angle =
            Math.random() *
            Math.PI * 2;


        const radius =
            .25 +
            Math.random() * .65;


        const leaf =
            createLeaf(
                new THREE.Vector3(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                ),
                .32 +
                    Math.random() * .20,
                angle
            );


        leaf.position.sub(
            new THREE.Vector3(x,0,z)
        );


        plant.add(leaf);
    }


    /*
       CACHOS DE TOMATES

       Alguns verdes,
       alguns amarelos,
       alguns vermelhos.
    */

    const clusters = 5;


    for (
        let c = 0;
        c < clusters;
        c++
    ) {

        const y =
            .8 +
            c * .48 +
            Math.random() * .18;


        const side =
            c % 2 === 0
                ? 1
                : -1;


        const clusterX =
            side *
            (.58 + Math.random() * .25);


        const clusterZ =
            (Math.random() - .5) *
            .25;


        const amount =
            4 + Math.floor(
                Math.random() * 3
            );


        for (
            let t = 0;
            t < amount;
            t++
        ) {

            const stage =
                Math.random();


            let color;
            let mature = false;


            if (stage < .38) {

                color = 0x4f9b3d;

            } else if (stage < .63) {

                color = 0xd2a82d;

            } else {

                color = 0xd83b2f;
                mature = true;
            }


            const tomato =
                createTomato(
                    new THREE.Vector3(
                        x +
                            clusterX +
                            (Math.random()-.5)*.35,

                        y +
                            (Math.random()-.5)*.35,

                        z +
                            clusterZ +
                            (Math.random()-.5)*.25
                    ),
                    color,
                    mature,
                    .75 +
                        Math.random()*.35
                );


            tomato.position.sub(
                new THREE.Vector3(x,0,z)
            );


            plant.add(tomato);
        }
    }


    // flores

    for (
        let f = 0;
        f < 5;
        f++
    ) {

        const flower =
            createFlower(
                new THREE.Vector3(
                    x +
                        (Math.random()-.5)*1.1,
                    1.1 +
                        Math.random()*1.5,
                    z +
                        (Math.random()-.5)*.8
                ),
                .8
            );


        flower.position.sub(
            new THREE.Vector3(x,0,z)
        );


        plant.add(flower);
    }


    plant.position.set(
        0,
        0,
        0
    );


    scene.add(plant);

    return plant;
}


/* =========================================================
   PLANTAÇÃO
========================================================= */

const plantGroups = [];

let plantIndex = 0;


for (
    let rowSide of [-1, 1]
) {

    const x =
        rowSide * ROW_X;


    for (
        let z = -2;
        z > -FIELD_LENGTH;
        z -= PLANT_SPACING
    ) {

        const plant =
            createTomatoPlant(
                x,
                z,
                plantIndex
            );


        plantGroups.push(
            plant
        );


        /*
           VARINHAS

           Alternância:

           /  \  /  \  /  \

           Uma de cada lado.
        */

        const side =
            plantIndex % 2 === 0
                ? 1
                : -1;


        createVara(
            x,
            z,
            side
        );


        plantIndex++;
    }
}

/* =========================================================
   CONTROLES MOBILE
========================================================= */

document
    .querySelectorAll(".control")
    .forEach(button => {

        const key =
            button.dataset.key;


        const start = event => {

            event.preventDefault();

            keys[key] = true;
        };


        const stop = event => {

            event.preventDefault();

            keys[key] = false;
        };


        button.addEventListener(
            "pointerdown",
            start
        );

        button.addEventListener(
            "pointerup",
            stop
        );

        button.addEventListener(
            "pointercancel",
            stop
        );

        button.addEventListener(
            "pointerleave",
            stop
        );
    });


/* =========================================================
   MOVIMENTO
========================================================= */

const clock =
    new THREE.Clock();


function updatePlayer(delta) {

    const speed = 4.2;


    let dx = 0;
    let dz = 0;


    if (
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ) {
        dx -= 1;
    }


    if (
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ) {
        dx += 1;
    }


    if (
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ) {
        dz -= 1;
    }


    if (
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ) {
        dz += 1;
    }


    if (
        dx !== 0 ||
        dz !== 0
    ) {

        const length =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        dx /= length;
        dz /= length;


        player.position.x +=
            dx *
            speed *
            delta;


        player.position.z +=
            dz *
            speed *
            delta;


        // personagem não entra nas plantações

        player.position.x =
            THREE.MathUtils.clamp(
                player.position.x,
                -3.35,
                3.35
            );


        player.position.z =
            THREE.MathUtils.clamp(
                player.position.z,
                -FIELD_LENGTH + 3,
                7
            );


        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );
    }
}


/* =========================================================
   TOMATE MAIS PRÓXIMO
========================================================= */

let nearestTomato = null;


function findNearestTomato() {

    nearestTomato = null;

    let bestDistance =
        Infinity;


    for (
        const tomato of tomatoObjects
    ) {

        if (
            !tomato.visible ||
            !tomato.userData.mature
        ) {
            continue;
        }


        const distance =
            player.position.distanceTo(
                tomato.getWorldPosition(
                    new THREE.Vector3()
                )
            );


        if (
            distance < bestDistance
        ) {

            bestDistance =
                distance;

            nearestTomato =
                tomato;
        }
    }


    return nearestTomato;
}


/* =========================================================
   COLHER
========================================================= */

let score = 0;


function harvestTomato() {

    const tomato =
        findNearestTomato();


    if (!tomato) {

        showMessage(
            "🍅 Nenhum tomate maduro por perto."
        );

        return;
    }


    const worldPosition =
        tomato.getWorldPosition(
            new THREE.Vector3()
        );


    const distance =
        player.position.distanceTo(
            worldPosition
        );


    if (distance > 4.2) {

        showMessage(
            "🍅 TOMATE NO ALCANCE • chegue mais perto"
        );

        return;
    }


    tomato.visible = false;


    score++;


    document
        .getElementById("score")
        .textContent = score;


    // tomate aparece na caixa

    const picked =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .09,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0xd83229,
                roughness: .6
            })
        );


    picked.position.set(
        (Math.random()-.5)*.25,
        .98 +
            Math.random()*.35,
        .48 +
            Math.random()*.25
    );


    picked.castShadow = true;

    player.add(picked);


    showMessage(
        "🍅 Tomate colhido!"
    );
}


document
    .getElementById("harvest")
    .addEventListener(
        "click",
        harvestTomato
    );


/* =========================================================
   MENSAGEM
========================================================= */

let messageTimer = null;


function showMessage(
    text
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =========================================================
   TEMPO
========================================================= */

let timeLeft =
    GAME_TIME;

let gameRunning =
    true;


const timeElement =
    document.getElementById(
        "time"
    );


function finishGame() {

    gameRunning = false;

    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        score;


    document
        .getElementById(
            "result"
        )
        .style.display =
        "flex";
}


function updateTimer() {

    if (!gameRunning) {
        return;
    }


    timeLeft -= 1;


    if (
        timeLeft < 0
    ) {
        timeLeft = 0;
    }


    timeElement.textContent =
        timeLeft;


    if (
        timeLeft <= 0
    ) {

        finishGame();
    }
}


setInterval(
    updateTimer,
    1000
);


/* =========================================================
   REINICIAR
========================================================= */

function restartGame() {

    location.reload();
}


document
    .getElementById("restart")
    .addEventListener(
        "click",
        restartGame
    );


document
    .getElementById("resultRestart")
    .addEventListener(
        "click",
        restartGame
    );


/* =========================================================
   CÂMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();


function updateCamera() {

    const desired =
        new THREE.Vector3(
            player.position.x * .35,
            5.7,
            player.position.z + 8.5
        );


    camera.position.lerp(
        desired,
        .075
    );


    cameraTarget.set(
        player.position.x,
        1.35,
        player.position.z - 7
    );


    camera.lookAt(
        cameraTarget
    );
}


/* =========================================================
   ANIMAÇÃO DAS NUVENS
========================================================= */

function updateClouds(
    delta
) {

    for (
        const cloud of clouds
    ) {

        cloud.position.x +=
            delta * .25;


        if (
            cloud.position.x > 80
        ) {

            cloud.position.x =
                -80;
        }
    }
}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (gameRunning) {

        updatePlayer(
            delta
        );
    }


    updateCamera();

    updateClouds(
        delta
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
