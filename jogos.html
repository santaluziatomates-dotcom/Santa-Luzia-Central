<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Santa Luzia Games • Colheita</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#9fcdf1;

    font-family:
    Arial,
    Helvetica,
    sans-serif;
}

#game{

    position:fixed;

    inset:0;

    overflow:hidden;
}

canvas{

    display:block;

    width:100%;
    height:100%;
}


/* =========================
HUD
========================= */

.hud{

    position:fixed;

    top:18px;
    left:18px;
    right:18px;

    z-index:20;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hud-card{

    min-width:150px;

    padding:12px 18px;

    background:
    rgba(255,255,255,.94);

    border:
    2px solid
    rgba(255,255,255,.8);

    border-radius:22px;

    box-shadow:
    0 5px 18px rgba(0,0,0,.15);

    color:#234b32;
}

.hud-label{

    font-size:15px;

    font-weight:700;

    letter-spacing:1px;
}

.hud-value{

    margin-top:3px;

    font-size:30px;

    font-weight:800;
}


/* =========================
MENSAGEM
========================= */

#message{

    position:fixed;

    left:50%;
    bottom:160px;

    transform:
    translateX(-50%);

    z-index:25;

    max-width:330px;

    padding:
    14px 22px;

    background:
    rgba(30,86,50,.94);

    color:white;

    border-radius:24px;

    font-size:17px;

    font-weight:700;

    text-align:center;

    box-shadow:
    0 6px 20px
    rgba(0,0,0,.22);

    opacity:0;

    pointer-events:none;

    transition:
    opacity .2s ease;
}

#message.show{

    opacity:1;
}


/* =========================
CONTROLES
========================= */

.controls{

    position:fixed;

    left:18px;
    bottom:28px;

    z-index:30;

    display:grid;

    grid-template-columns:
    64px 64px 64px;

    grid-template-rows:
    64px 64px;

    gap:10px;
}

.control{

    width:64px;
    height:64px;

    border:0;

    border-radius:20px;

    background:
    rgba(255,255,255,.94);

    color:#245536;

    font-size:30px;

    font-weight:900;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.16);

    touch-action:manipulation;
}

.control:active{

    transform:scale(.94);
}

.up{

    grid-column:2;
    grid-row:1;
}

.left{

    grid-column:1;
    grid-row:2;
}

.down{

    grid-column:2;
    grid-row:2;
}

.right{

    grid-column:3;
    grid-row:2;
}


/* =========================
AÇÕES
========================= */

.actions{

    position:fixed;

    right:18px;
    bottom:28px;

    z-index:30;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.action{

    min-width:190px;

    min-height:58px;

    border:0;

    border-radius:20px;

    font-size:18px;

    font-weight:800;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.16);

    touch-action:manipulation;
}

.harvest{

    background:#245b35;

    color:white;
}

.restart{

    background:
    rgba(255,255,255,.95);

    color:#245b35;
}

.action:active{

    transform:scale(.96);
}


/* =========================
RESULTADO
========================= */

#result{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:
    rgba(15,35,24,.72);

    backdrop-filter:
    blur(6px);
}

.result-card{

    width:min(90%,360px);

    padding:28px;

    background:white;

    border-radius:28px;

    text-align:center;

    box-shadow:
    0 15px 50px
    rgba(0,0,0,.3);
}

.result-card h1{

    margin:
    0 0 12px;

    color:#245b35;
}

.result-card p{

    color:#4d5c52;

    font-size:18px;
}

.result-card button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:16px;

    background:#245b35;

    color:white;

    font-size:17px;

    font-weight:800;
}


/* =========================
MOBILE
========================= */

@media(max-width:600px){

    .hud{

        top:14px;

        left:12px;
        right:12px;
    }

    .hud-card{

        min-width:125px;

        padding:
        10px 14px;

        border-radius:18px;
    }

    .hud-label{

        font-size:13px;
    }

    .hud-value{

        font-size:24px;
    }

    .controls{

        left:12px;
        bottom:18px;

        grid-template-columns:
        58px 58px 58px;

        grid-template-rows:
        58px 58px;
    }

    .control{

        width:58px;
        height:58px;

        border-radius:18px;
    }

    .actions{

        right:12px;
        bottom:18px;
    }

    .action{

        min-width:160px;

        min-height:54px;

        font-size:16px;
    }

    #message{

        bottom:145px;

        max-width:290px;

        font-size:15px;
    }
}

</style>

</head>

<script type="module">

import * as THREE
from "three";


/* =========================================================
CONFIGURAÇÕES
========================================================= */

const GAME_TIME = 60;


/*
    Campo mais curto para o celular.

    Depois que a base estiver aprovada,
    podemos aumentar tranquilamente.
*/

const FIELD_LENGTH = 90;


/*
    Não usamos 75cm reais.

    Aqui usamos uma distância menor
    para deixar a plantação bonita
    dentro da tela.
*/

const PLANT_SPACING = 2.0;


/*
    Cada bloco possui 8 pés.

    Exemplo:

    PALANQUE
       |
    8 PÉS
       |
    CRUZETA
       |
    8 PÉS
       |
    PALANQUE
*/

const PLANTS_PER_SECTION = 8;


/*
    Distância da estrada.
*/

const ROW_X = 6.2;


/*
    Estrada central.
*/

const ROAD_WIDTH = 8;


/* =========================================================
CENA
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x9fcdf1
    );


scene.fog =
    new THREE.Fog(
        0x9fcdf1,
        55,
        135
    );


/* =========================================================
CÂMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        .1,

        250

    );


camera.position.set(
    0,
    5.5,
    9
);


/* =========================================================
RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
        "high-performance"

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        1.25
    )

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.05;


document
.getElementById("game")
.appendChild(
    renderer.domElement
);


/* =========================================================
ILUMINAÇÃO
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(

        0xd9efff,

        0x526b3d,

        1.8

    );


scene.add(
    hemisphere
);


const sunLight =
    new THREE.DirectionalLight(

        0xffedc0,

        3.2

    );


sunLight.position.set(
    -40,
    55,
    30
);


sunLight.castShadow =
    true;


/*
    Shadow menor para
    economizar memória.
*/

sunLight.shadow.mapSize.width =
    1024;

sunLight.shadow.mapSize.height =
    1024;


sunLight.shadow.camera.left =
    -55;

sunLight.shadow.camera.right =
    55;

sunLight.shadow.camera.top =
    60;

sunLight.shadow.camera.bottom =
    -60;

sunLight.shadow.camera.near =
    1;

sunLight.shadow.camera.far =
    150;


scene.add(
    sunLight
);


/* =========================================================
SOL
========================================================= */

const sun =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4,
            16,
            12
        ),

        new THREE.MeshBasicMaterial({

            color:
            0xffdf72

        })

    );


sun.position.set(

    -42,
    48,
    -80

);


scene.add(
    sun
);


/* =========================================================
NUVENS
========================================================= */

const cloudMaterial =
    new THREE.MeshBasicMaterial({

        color:
        0xffffff,

        transparent:true,

        opacity:.88

    });


function createCloud(
    x,
    y,
    z,
    scale
){

    const cloud =
        new THREE.Group();


    const parts = [

        [-1.8,0,0,1.4],

        [0,.25,0,1.8],

        [1.8,0,0,1.3],

        [.7,.65,0,1.05]

    ];


    for(
        const part
        of parts
    ){

        const mesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    part[3],
                    8,
                    6
                ),

                cloudMaterial

            );


        mesh.position.set(

            part[0],
            part[1],
            part[2]

        );


        cloud.add(
            mesh
        );

    }


    cloud.position.set(
        x,
        y,
        z
    );


    cloud.scale.setScalar(
        scale
    );


    scene.add(
        cloud
    );


    return cloud;
}


const clouds = [

    createCloud(
        -25,
        34,
        -30,
        1.5
    ),

    createCloud(
        25,
        39,
        -65,
        1.9
    ),

    createCloud(
        -5,
        32,
        -110,
        1.4
    )

];


/* =========================================================
MATERIAIS REUTILIZADOS
========================================================= */

const groundMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x6e994d,

        roughness:1

    });


const soilMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x80552f,

        roughness:1

    });


const roadMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x9f7448,

        roughness:1

    });


const woodMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x70472b,

        roughness:.95

    });


const darkWoodMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x4a2d1c,

        roughness:1

    });


const wireMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x24251f,

        roughness:.8,

        metalness:.1

    });


const stemMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x3c6838,

        roughness:1

    });


const leafMaterials = [

    new THREE.MeshStandardMaterial({

        color:
        0x3f7b3b,

        roughness:1

    }),

    new THREE.MeshStandardMaterial({

        color:
        0x579347,

        roughness:1

    }),

    new THREE.MeshStandardMaterial({

        color:
        0x6da951,

        roughness:1

    })

];


const redMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0xd9382d,

        roughness:.65

    });


const greenTomatoMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x4d963e,

        roughness:.7

    });


const yellowTomatoMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0xd6a82d,

        roughness:.68

    });


const flowerWhiteMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0xf4eed8,

        roughness:1

    });


const flowerYellowMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0xe4bd3e,

        roughness:.9

    });


/* =========================================================
CHÃO
========================================================= */

function createGround(){

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                90,
                FIELD_LENGTH + 30
            ),

            groundMaterial

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.z =
        -FIELD_LENGTH / 2;


    ground.receiveShadow =
        true;


    scene.add(
        ground
    );


    const road =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                ROAD_WIDTH,
                FIELD_LENGTH + 30
            ),

            roadMaterial

        );


    road.rotation.x =
        -Math.PI / 2;


    road.position.y =
        .01;


    road.position.z =
        -FIELD_LENGTH / 2;


    road.receiveShadow =
        true;


    scene.add(
        road
    );


    /*
        Camas de terra
        onde ficam os tomates.
    */

    for(
        const x
        of [-ROW_X, ROW_X]
    ){

        const bed =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    4.2,
                    FIELD_LENGTH + 30
                ),

                soilMaterial

            );


        bed.rotation.x =
            -Math.PI / 2;


        bed.position.set(

            x,
            .025,
            -FIELD_LENGTH / 2

        );


        bed.receiveShadow =
            true;


        scene.add(
            bed
        );

    }

}


createGround();


/* =========================================================
PEDRAS / VEGETAÇÃO
========================================================= */

const rockMaterial =
    new THREE.MeshStandardMaterial({

        color:
        0x553c2a,

        roughness:1

    });


const rockGeometry =
    new THREE.DodecahedronGeometry(
        .075,
        0
    );


for(
    let i=0;
    i<90;
    i++
){

    const rock =
        new THREE.Mesh(

            rockGeometry,

            rockMaterial

        );


    rock.position.set(

        (Math.random()-.5) *
        16,

        .04,

        -Math.random() *
        FIELD_LENGTH

    );


    rock.scale.setScalar(

        .6 +
        Math.random()*.8

    );


    scene.add(
        rock
    );

}


/* =========================================================
CILINDRO ENTRE PONTOS
========================================================= */

function cylinderBetween(

    a,
    b,
    radius,
    material,
    segments=6

){

    const direction =
        new THREE.Vector3()
        .subVectors(
            b,
            a
        );


    const length =
        direction.length();


    /*
        Proteção importante.

        Nunca criamos cilindro
        com tamanho zero.
    */

    if(
        length < .001
    ){

        return null;

    }


    const geometry =
        new THREE.CylinderGeometry(

            radius,
            radius,

            length,

            segments

        );


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.copy(

        a.clone()
        .add(b)
        .multiplyScalar(.5)

    );


    mesh.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            1,
            0
        ),

        direction.normalize()

    );


    mesh.castShadow =
        true;


    return mesh;

}


/* =========================================================
PALANQUE
========================================================= */

function createPalanque(
    x,
    z
){

    const group =
        new THREE.Group();


    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .105,
                .14,
                4.4,
                7
            ),

            darkWoodMaterial

        );


    post.position.y =
        2.2;


    post.rotation.z =
        (Math.random()-.5)*.04;


    post.castShadow =
        true;


    group.add(
        post
    );


    const top =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .07,
                .08,
                .65,
                6
            ),

            woodMaterial

        );


    top.position.y =
        4.65;


    top.castShadow =
        true;


    group.add(
        top
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );

}


/* =========================================================
CRUZETA
========================================================= */

function createCruzeta(
    x,
    z
){

    const group =
        new THREE.Group();


    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .10,
                .14,
                4.35,
                7
            ),

            darkWoodMaterial

        );


    post.position.y =
        2.18;


    post.castShadow =
        true;


    group.add(
        post
    );


    const cross =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.5,
                .14,
                .14
            ),

            woodMaterial

        );


    cross.position.y =
        3.65;


    cross.castShadow =
        true;


    group.add(
        cross
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );

}


/* =========================================================
VARINHA
========================================================= */

function createVara(
    x,
    z,
    side
){

    const bottom =
        new THREE.Vector3(

            x +
            side*.7,

            .12,

            z

        );


    const top =
        new THREE.Vector3(

            x -
            side*.28,

            3.55,

            z

        );


    const vara =
        cylinderBetween(

            bottom,
            top,

            .038,

            woodMaterial,

            5

        );


    if(
        vara
    ){

        scene.add(
            vara
        );

    }

}


/* =========================================================
ARAMES
========================================================= */

function createWire(
    x,
    height
){

    const start =
        new THREE.Vector3(

            x,
            height,
            3

        );


    const end =
        new THREE.Vector3(

            x,
            height,
            -FIELD_LENGTH-3

        );


    const wire =
        cylinderBetween(

            start,
            end,

            .018,

            wireMaterial,

            5

        );


    if(
        wire
    ){

        scene.add(
            wire
        );

    }

}


/*
    A estrutura real tem:

    1º PALANQUE
       |
       | 8 pés
       |
    CRUZETA
       |
       | 8 pés
       |
    PALANQUE
       |
       | 8 pés
       |
    CRUZETA
*/

function createSupportStructure(
    x
){

    const sectionLength =
        PLANTS_PER_SECTION *
        PLANT_SPACING;


    createPalanque(
        x,
        2
    );


    let index = 1;


    for(

        let z =
        2-sectionLength;

        z >
        -FIELD_LENGTH;

        z -= sectionLength

    ){

        if(
            index % 2 === 1
        ){

            createCruzeta(
                x,
                z
            );

        }else{

            createPalanque(
                x,
                z
            );

        }


        index++;

    }


    /*
        Um arame principal.
    */

    createWire(
        x,
        3.35
    );

}


createSupportStructure(
    -ROW_X
);


createSupportStructure(
    ROW_X
);


/* =========================================================
FOLHA
========================================================= */

const leafGeometry =
    new THREE.SphereGeometry(
        1,
        6,
        5
    );


function createLeaf(
    group,
    x,
    y,
    z,
    size,
    rotation
){

    const material =
        leafMaterials[
            Math.floor(
                Math.random() *
                leafMaterials.length
            )
        ];


    const leaf =
        new THREE.Mesh(

            leafGeometry,
            material

        );


    leaf.position.set(
        x,
        y,
        z
    );


    leaf.scale.set(

        size*1.5,

        size*.22,

        size*.7

    );


    leaf.rotation.y =
        rotation;


    leaf.rotation.z =
        (Math.random()-.5)*.4;


    leaf.castShadow =
        true;


    group.add(
        leaf
    );

}


/* =========================================================
TOMATE
========================================================= */

const tomatoGeometry =
    new THREE.SphereGeometry(
        .23,
        9,
        7
    );


const crownGeometry =
    new THREE.ConeGeometry(
        .09,
        .11,
        5
    );


const tomatoObjects = [];


function createTomato(

    group,

    x,
    y,
    z,

    material,

    mature

){

    const tomatoGroup =
        new THREE.Group();


    const tomato =
        new THREE.Mesh(

            tomatoGeometry,

            material

        );


    tomato.scale.y =
        1.05;


    tomato.castShadow =
        true;


    tomatoGroup.add(
        tomato
    );


    const crown =
        new THREE.Mesh(

            crownGeometry,

            stemMaterial

        );


    crown.position.y =
        .22;


    crown.rotation.x =
        Math.PI;


    tomatoGroup.add(
        crown
    );


    tomatoGroup.position.set(
        x,
        y,
        z
    );


    tomatoGroup.userData.mature =
        mature;


    tomatoGroup.userData.tomato =
        true;


    group.add(
        tomatoGroup
    );


    if(
        mature
    ){

        tomatoObjects.push(
            tomatoGroup
        );

    }

}

const flowerPetalGeometry =
    new THREE.SphereGeometry(
        .075,
        6,
        5
    );


const flowerCenterGeometry =
    new THREE.SphereGeometry(
        .05,
        6,
        5
    );


function createFlower(
    group,
    x,
    y,
    z
){

    const flower =
        new THREE.Group();


    for(
        let i=0;
        i<5;
        i++
    ){

        const petal =
            new THREE.Mesh(

                flowerPetalGeometry,

                flowerWhiteMaterial

            );


        const angle =
            i *
            Math.PI*2 /
            5;


        petal.position.set(

            Math.cos(angle)*.10,

            0,

            Math.sin(angle)*.10

        );


        petal.scale.y =
            .55;


        flower.add(
            petal
        );

    }


    const center =
        new THREE.Mesh(

            flowerCenterGeometry,

            flowerYellowMaterial

        );


    flower.add(
        center
    );


    flower.position.set(
        x,
        y,
        z
    );


    group.add(
        flower
    );

}


/* =========================================================
PÉ DE TOMATE
========================================================= */

function createTomatoPlant(
    x,
    z,
    index
){

    const plant =
        new THREE.Group();


    /*
        CAULE PRINCIPAL
    */

    const stem =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .055,
                .085,
                3.2,
                6
            ),

            stemMaterial

        );


    stem.position.y =
        1.6;


    stem.castShadow =
        true;


    plant.add(
        stem
    );


    /*
        GALHOS
    */

    for(
        let b=0;
        b<7;
        b++
    ){

        const y =
            .65 +
            b*.38;


        const side =
            b%2===0
            ? 1
            : -1;


        const base =
            new THREE.Vector3(
                0,
                y,
                0
            );


        const end =
            new THREE.Vector3(

                side *
                (.45 +
                Math.random()*.25),

                y +
                .12,

                (Math.random()-.5)*.25

            );


        const worldBase =
            base.clone();


        const worldEnd =
            end.clone();


        const branch =
            cylinderBetween(

                worldBase,
                worldEnd,

                .025,

                stemMaterial,

                5

            );


        if(
            branch
        ){

            plant.add(
                branch
            );

        }


        /*
            folhas dos galhos
        */

        createLeaf(

            plant,

            end.x,

            end.y+.08,

            end.z+.05,

            .28,

            side*.7

        );


        createLeaf(

            plant,

            end.x*.75,

            end.y-.05,

            end.z-.08,

            .25,

            -side*.9

        );

    }


    /*
        FOLHAGEM PRINCIPAL

        Poucas folhas grandes,
        em vez de milhares de objetos.
    */

    for(
        let i=0;
        i<15;
        i++
    ){

        const y =
            .45 +
            Math.random()*2.45;


        const angle =
            Math.random() *
            Math.PI*2;


        const radius =
            .25 +
            Math.random()*.48;


        createLeaf(

            plant,

            Math.cos(angle)*radius,

            y,

            Math.sin(angle)*radius,

            .28 +
            Math.random()*.12,

            angle

        );

    }


    /*
        CACHOS DE TOMATES
    */

    for(
        let c=0;
        c<4;
        c++
    ){

        const y =
            .75 +
            c*.55;


        const side =
            c%2===0
            ? 1
            : -1;


        const baseX =
            side *
            (.45 +
            Math.random()*.18);


        /*
            3 ou 4 tomates por cacho.
        */

        const amount =
            3 +
            Math.floor(
                Math.random()*2
            );


        for(
            let t=0;
            t<amount;
            t++
        ){

            const stage =
                Math.random();


            let material;
            let mature =
                false;


            if(
                stage < .42
            ){

                material =
                    greenTomatoMaterial;

            }else if(
                stage < .65
            ){

                material =
                    yellowTomatoMaterial;

            }else{

                material =
                    redMaterial;

                mature =
                    true;

            }


            createTomato(

                plant,

                baseX +
                (Math.random()-.5)*.28,

                y +
                (Math.random()-.5)*.28,

                (Math.random()-.5)*.22,

                material,

                mature

            );

        }

    }


    /*
        FLORES

        Algumas ainda estão florindo.
    */

    for(
        let f=0;
        f<3;
        f++
    ){

        createFlower(

            plant,

            (Math.random()-.5)*.9,

            1.1 +
            Math.random()*1.5,

            (Math.random()-.5)*.45

        );

    }


    /*
        POSICIONAMENTO
    */

    plant.position.set(
        x,
        0,
        z
    );


    scene.add(
        plant
    );


    return plant;

}


/* =========================================================
PLANTAÇÃO
========================================================= */

const plantGroups = [];


/*
    Cada lado possui
    sua própria sequência.

    Importante:

    As varinhas alternam
    de lado em lado.
*/

for(
    const rowSide
    of [-1,1]
){

    const x =
        rowSide *
        ROW_X;


    let plantNumber = 0;


    for(

        let z=-2;

        z>-FIELD_LENGTH;

        z-=PLANT_SPACING

    ){

        const plant =
            createTomatoPlant(

                x,
                z,
                plantNumber

            );


        plantGroups.push(
            plant
        );


        /*
            Alternância:

            /
            \
            /
            \
        */

        const side =
            plantNumber%2===0
            ? 1
            : -1;


        createVara(
            x,
            z,
            side
        );


        plantNumber++;

    }

}

/* =========================================================
MOVIMENTO
========================================================= */

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
){

    const speed =
        4.2;


    let dx=0;
    let dz=0;


    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx--;

    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx++;

    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dz--;

    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dz++;

    }


    if(
        dx!==0 ||
        dz!==0
    ){

        const length =
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        dx/=length;
        dz/=length;


        player.position.x +=
            dx *
            speed *
            delta;


        player.position.z +=
            dz *
            speed *
            delta;


        /*
            Mantém o trabalhador
            na estrada.
        */

        player.position.x =
            THREE.MathUtils.clamp(

                player.position.x,

                -3.2,

                3.2

            );


        player.position.z =
            THREE.MathUtils.clamp(

                player.position.z,

                -FIELD_LENGTH+3,

                7

            );


        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }

}


/* =========================================================
TOMATE MAIS PRÓXIMO
========================================================= */

let nearestTomato =
    null;


function findNearestTomato(){

    nearestTomato =
        null;


    let best =
        Infinity;


    const temp =
        new THREE.Vector3();


    for(
        const tomato
        of tomatoObjects
    ){

        if(
            !tomato.visible ||
            !tomato.userData.mature
        ){

            continue;

        }


        tomato.getWorldPosition(
            temp
        );


        const distance =
            player.position.distanceTo(
                temp
            );


        if(
            distance < best
        ){

            best =
                distance;

            nearestTomato =
                tomato;

        }

    }


    return nearestTomato;

}


/* =========================================================
COLHEITA
========================================================= */

let score =
    0;


function harvestTomato(){

    const tomato =
        findNearestTomato();


    if(
        !tomato
    ){

        showMessage(
            "🍅 Nenhum tomate maduro por perto."
        );

        return;

    }


    const worldPosition =
        tomato.getWorldPosition(
            new THREE.Vector3()
        );


    const distance =
        player.position.distanceTo(
            worldPosition
        );


    if(
        distance > 4.2
    ){

        showMessage(
            "🍅 TOMATE NO ALCANCE • chegue mais perto"
        );

        return;

    }


    tomato.visible =
        false;


    score++;


    document
    .getElementById("score")
    .textContent =
        score;


    /*
        Coloca um tomate
        na caixa.
    */

    const picked =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .09,
                8,
                6
            ),

            redMaterial

        );


    picked.position.set(

        (Math.random()-.5)*.25,

        .98+
        Math.random()*.35,

        .48+
        Math.random()*.25

    );


    picked.castShadow =
        true;


    player.add(
        picked
    );


    showMessage(
        "🍅 Tomate colhido!"
    );

}


document
.getElementById("harvest")
.addEventListener(
    "click",
    harvestTomato
);

MENSAGEM
========================================================= */

let messageTimer =
    null;


function showMessage(
    text
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(

            () => {

                message.classList.remove(
                    "show"
                );

            },

            1800

        );

}


/* =========================================================
TEMPO
========================================================= */

let timeLeft =
    GAME_TIME;


let gameRunning =
    true;


const timeElement =
    document.getElementById(
        "time"
    );


function finishGame(){

    gameRunning =
        false;


    document
    .getElementById(
        "finalScore"
    )
    .textContent =
        score;


    document
    .getElementById(
        "result"
    )
    .style.display =
        "flex";

}


function updateTimer(){

    if(
        !gameRunning
    ){

        return;

    }


    timeLeft--;


    if(
        timeLeft < 0
    ){

        timeLeft =
            0;

    }


    timeElement.textContent =
        timeLeft;


    if(
        timeLeft <= 0
    ){

        finishGame();

    }

}


setInterval(
    updateTimer,
    1000
);

/* =========================================================
CÂMERA
========================================================= */

const cameraTarget =
    new THREE.Vector3();


function updateCamera(){

    const desired =
        new THREE.Vector3(

            player.position.x*.3,

            5.8,

            player.position.z+8.5

        );


    camera.position.lerp(

        desired,

        .075

    );


    cameraTarget.set(

        player.position.x,

        1.35,

        player.position.z-7

    );


    camera.lookAt(
        cameraTarget
    );

}


/* =========================================================
NUVENS
========================================================= */

function updateClouds(
    delta
){

    for(
        const cloud
        of clouds
    ){

        cloud.position.x +=
            delta*.18;


        if(
            cloud.position.x > 70
        ){

            cloud.position.x =
                -70;

        }

    }

}


/* =========================================================
ANIMAÇÃO
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameRunning
    ){

        updatePlayer(
            delta
        );

    }


    updateCamera();


    updateClouds(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);
