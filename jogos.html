<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Santa Luzia Games • Colheita</title>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #9fcdf1;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#game {

    position: fixed;

    inset: 0;

    overflow: hidden;
}

canvas {

    display: block;

    width: 100%;
    height: 100%;
}


/* =========================================================
   HUD
========================================================= */

.hud {

    position: fixed;

    top: 18px;
    left: 18px;
    right: 18px;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    pointer-events: none;
}


.hud-card {

    min-width: 150px;

    padding:
        12px 18px;

    background:
        rgba(255,255,255,.94);

    border:
        2px solid rgba(255,255,255,.8);

    border-radius:
        22px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.15),
        inset 0 1px 0 rgba(255,255,255,.8);

    color:
        #234b32;
}


.hud-label {

    font-size:
        15px;

    font-weight:
        700;

    letter-spacing:
        1px;
}


.hud-value {

    margin-top:
        3px;

    font-size:
        30px;

    font-weight:
        800;
}


/* =========================================================
   MENSAGEM
========================================================= */

#message {

    position: fixed;

    left: 50%;
    bottom: 160px;

    transform:
        translateX(-50%);

    z-index: 25;

    max-width:
        330px;

    padding:
        14px 22px;

    background:
        rgba(30,86,50,.94);

    color:
        white;

    border-radius:
        24px;

    font-size:
        17px;

    font-weight:
        700;

    text-align:
        center;

    box-shadow:
        0 6px 20px rgba(0,0,0,.22);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s ease;
}


#message.show {

    opacity:
        1;
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    position: fixed;

    left: 18px;
    bottom: 28px;

    z-index: 30;

    display: grid;

    grid-template-columns:
        64px 64px 64px;

    grid-template-rows:
        64px 64px;

    gap:
        10px;
}


.control {

    width: 64px;
    height: 64px;

    border: 0;

    border-radius:
        20px;

    background:
        rgba(255,255,255,.94);

    color:
        #245536;

    font-size:
        30px;

    font-weight:
        900;

    box-shadow:
        0 5px 15px rgba(0,0,0,.16);

    touch-action:
        manipulation;
}


.control:active {

    transform:
        scale(.94);
}


.up {

    grid-column:
        2;

    grid-row:
        1;
}


.left {

    grid-column:
        1;

    grid-row:
        2;
}


.down {

    grid-column:
        2;

    grid-row:
        2;
}


.right {

    grid-column:
        3;

    grid-row:
        2;
}


/* =========================================================
   AÇÕES
========================================================= */

.actions {

    position: fixed;

    right: 18px;
    bottom: 28px;

    z-index: 30;

    display: flex;

    flex-direction:
        column;

    gap:
        10px;
}


.action {

    min-width:
        190px;

    min-height:
        58px;

    border:
        0;

    border-radius:
        20px;

    font-size:
        18px;

    font-weight:
        800;

    box-shadow:
        0 5px 15px rgba(0,0,0,.16);

    touch-action:
        manipulation;
}


.harvest {

    background:
        #245b35;

    color:
        white;
}


.restart {

    background:
        rgba(255,255,255,.95);

    color:
        #245b35;
}


.action:active {

    transform:
        scale(.96);
}


/* =========================================================
   RESULTADO
========================================================= */

#result {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items:
        center;

    justify-content:
        center;

    background:
        rgba(15,35,24,.72);

    backdrop-filter:
        blur(6px);
}


.result-card {

    width:
        min(90%, 360px);

    padding:
        28px;

    background:
        white;

    border-radius:
        28px;

    text-align:
        center;

    box-shadow:
        0 15px 50px rgba(0,0,0,.3);
}


.result-card h1 {

    margin:
        0 0 12px;

    color:
        #245b35;
}


.result-card p {

    color:
        #4d5c52;

    font-size:
        18px;
}


.result-card button {

    width:
        100%;

    padding:
        15px;

    border:
        0;

    border-radius:
        16px;

    background:
        #245b35;

    color:
        white;

    font-size:
        17px;

    font-weight:
        800;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .hud {

        top:
            14px;

        left:
            12px;

        right:
            12px;
    }


    .hud-card {

        min-width:
            125px;

        padding:
            10px 14px;

        border-radius:
            18px;
    }


    .hud-label {

        font-size:
            13px;
    }


    .hud-value {

        font-size:
            24px;
    }


    .controls {

        left:
            12px;

        bottom:
            18px;

        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            58px 58px;
    }


    .control {

        width:
            58px;

        height:
            58px;

        border-radius:
            18px;
    }


    .actions {

        right:
            12px;

        bottom:
            18px;
    }


    .action {

        min-width:
            160px;

        min-height:
            54px;

        font-size:
            16px;
    }


    #message {

        bottom:
            145px;

        max-width:
            290px;

        font-size:
            15px;
    }

}

</style>

</head>

<script type="module">

import * as THREE
    from "three";


import {
    GLTFLoader
} from
    "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const GAME_TIME =
    60;


const FIELD_LENGTH =
    125;


const PLANT_SPACING =
    1.55;


/*
   No jogo reduzimos a distância real
   para deixar a plantação mais divertida.
*/


const PLANTS_PER_SECTION =
    8;


const ROW_X =
    6.4;


const ROAD_WIDTH =
    8.5;


/*
   Futuro modelo real.

   Quando tivermos o arquivo:

   assets/pe-tomate.glb

   o jogo tentará carregar automaticamente.

   Se ele não existir,
   o jogo continua usando
   o pé procedural.
*/

const TOMATO_GLB =
    "assets/pe-tomate.glb";


/* =========================================================
   CENA
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x9fcdf1
    );


scene.fog =
    new THREE.FogExp2(
        0x9fcdf1,
        0.009
    );


/* =========================================================
   CÂMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        58,

        window.innerWidth /
        window.innerHeight,

        0.1,

        350

    );


camera.position.set(
    0,
    5.5,
    9
);


/* =========================================================
   RENDER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        powerPreference:
            "high-performance",

        alpha:
            false

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        1.7
    )

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.08;


document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   ILUMINAÇÃO
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(

        0xcfe8ff,

        0x4c6339,

        1.65

    );


scene.add(
    hemisphere
);


const sunLight =
    new THREE.DirectionalLight(

        0xffe5ad,

        3.8

    );


sunLight.position.set(
    -45,
    70,
    35
);


sunLight.castShadow =
    true;


sunLight.shadow.mapSize.width =
    2048;


sunLight.shadow.mapSize.height =
    2048;


sunLight.shadow.camera.left =
    -75;


sunLight.shadow.camera.right =
    75;


sunLight.shadow.camera.top =
    75;


sunLight.shadow.camera.bottom =
    -75;


sunLight.shadow.camera.near =
    1;


sunLight.shadow.camera.far =
    190;


scene.add(
    sunLight
);


/* =========================================================
   SOL
========================================================= */

const sun =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4.5,
            24,
            24
        ),

        new THREE.MeshBasicMaterial({

            color:
                0xffdf75

        })

    );


sun.position.set(
    -55,
    65,
    -80
);


scene.add(
    sun
);


/* =========================================================
   NUVENS
========================================================= */

function createCloud(
    x,
    y,
    z,
    scale
) {

    const cloud =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0xffffff,

            roughness:
                1

        });


    const parts = [

        [-2, 0, 0, 1.6],

        [0, .35, 0, 2.0],

        [2, 0, 0, 1.5],

        [.8, .75, 0, 1.1]

    ];


    for (
        const part
        of parts
    ) {

        const mesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    part[3],

                    12,

                    8

                ),

                material

            );


        mesh.position.set(

            part[0],
            part[1],
            part[2]

        );


        cloud.add(
            mesh
        );

    }


    cloud.position.set(
        x,
        y,
        z
    );


    cloud.scale.setScalar(
        scale
    );


    scene.add(
        cloud
    );


    return cloud;
}


const clouds = [

    createCloud(
        -30,
        34,
        -35,
        1.8
    ),

    createCloud(
        25,
        40,
        -70,
        2.2
    ),

    createCloud(
        0,
        31,
        -120,
        1.5
    ),

    createCloud(
        55,
        37,
        -20,
        1.4
    )

];


/* =========================================================
   MATERIAIS
========================================================= */

const soilMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x80502d,

        roughness:
            1

    });


const roadMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x9b7046,

        roughness:
            1

    });


const grassMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x649449,

        roughness:
            1

    });


const woodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x754726,

        roughness:
            .95

    });


const darkWoodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x4a2c1b,

        roughness:
            1

    });


const wireMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x252820,

        roughness:
            .72,

        metalness:
            .15

    });


/* =========================================================
   CHÃO
========================================================= */

function createGround() {

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                100,

                FIELD_LENGTH + 80

            ),

            grassMaterial

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.z =
        -FIELD_LENGTH / 2;


    ground.receiveShadow =
        true;


    scene.add(
        ground
    );


    const road =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                ROAD_WIDTH,

                FIELD_LENGTH + 35

            ),

            roadMaterial

        );


    road.rotation.x =
        -Math.PI / 2;


    road.position.y =
        .012;


    road.position.z =
        -FIELD_LENGTH / 2;


    road.receiveShadow =
        true;


    scene.add(
        road
    );


    /*
       Canteiros
    */

    for (
        const x of [
            -ROW_X,
            ROW_X
        ]
    ) {

        const bed =
            new THREE.Mesh(

                new THREE.PlaneGeometry(

                    4.7,

                    FIELD_LENGTH + 35

                ),

                soilMaterial

            );


        bed.rotation.x =
            -Math.PI / 2;


        bed.position.set(

            x,
            .025,
            -FIELD_LENGTH / 2

        );


        bed.receiveShadow =
            true;


        scene.add(
            bed
        );

    }

}


createGround();


/* =========================================================
   DETALHES DO SOLO
========================================================= */

function createGroundDetails() {

    const rockMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x523a28,

            roughness:
                1

        });


    for (
        let i = 0;
        i < 240;
        i++
    ) {

        const rock =
            new THREE.Mesh(

                new THREE.DodecahedronGeometry(

                    .05 +
                    Math.random() * .08,

                    0

                ),

                rockMaterial

            );


        const side =
            Math.random() > .5
                ? 1
                : -1;


        rock.position.set(

            side *
            (
                ROAD_WIDTH / 2 +
                Math.random() * 4
            ),

            .04,

            -Math.random() *
            FIELD_LENGTH

        );


        rock.rotation.y =
            Math.random() *
            Math.PI;


        rock.castShadow =
            true;


        scene.add(
            rock
        );

    }


    const grassBladeMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x3e783b,

            roughness:
                1

        });


    for (
        let i = 0;
        i < 300;
        i++
    ) {

        const blade =
            new THREE.Mesh(

                new THREE.ConeGeometry(

                    .025,
                    .12 +
                    Math.random() * .18,

                    3

                ),

                grassBladeMaterial

            );


        blade.position.set(

            (
                Math.random() -
                .5
            ) * 85,

            .08,

            -Math.random() *
            FIELD_LENGTH

        );


        blade.rotation.z =
            (
                Math.random() -
                .5
            ) * .7;


        scene.add(
            blade
        );

    }

}


createGroundDetails();


/* =========================================================
   CILINDRO ENTRE PONTOS
========================================================= */

function cylinderBetween(

    a,
    b,
    radius,
    material,
    segments = 7

) {

    const direction =
        new THREE.Vector3()
            .subVectors(
                b,
                a
            );


    const length =
        direction.length();


    const geometry =
        new THREE.CylinderGeometry(

            radius,
            radius,
            length,
            segments

        );


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.copy(

        a.clone()
            .add(b)
            .multiplyScalar(.5)

    );


    mesh.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            1,
            0
        ),

        direction.normalize()

    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    return mesh;

}


/* =========================================================
   PALANQUE
========================================================= */

function createMainPalanque(
    x,
    z
) {

    const group =
        new THREE.Group();


    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .11,
                .15,
                4.5,
                8

            ),

            darkWoodMaterial

        );


    post.position.y =
        2.25;


    post.rotation.z =
        (
            Math.random() -
            .5
        ) * .04;


    post.castShadow =
        true;


    group.add(
        post
    );


    /*
       Ponta acima do arame
    */

    const top =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .075,
                .09,
                .75,
                7

            ),

            woodMaterial

        );


    top.position.y =
        4.82;


    top.castShadow =
        true;


    group.add(
        top
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );


    return group;

}


/* =========================================================
   CRUZETA
========================================================= */

function createCruzeta(
    x,
    z
) {

    const group =
        new THREE.Group();


    const post =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .10,
                .14,
                4.35,
                8

            ),

            darkWoodMaterial

        );


    post.position.y =
        2.175;


    post.castShadow =
        true;


    group.add(
        post
    );


    /*
       Cruzeta diagonalizada
       para parecer mais natural.
    */

    const cross =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                2.7,
                .16,
                .16

            ),

            woodMaterial

        );


    cross.position.y =
        3.65;


    cross.rotation.z =
        .02;


    cross.castShadow =
        true;


    group.add(
        cross
    );


    group.position.set(
        x,
        0,
        z
    );


    scene.add(
        group
    );


    return group;

}


/* =========================================================
   VARINHA ALTERNADA
========================================================= */

function createVara(
    x,
    z,
    side
) {

    /*
       Uma de cada lado:

       /
       \
       /
       \
    */

    const start =
        new THREE.Vector3(

            x +
            side * .62,

            .12,

            z

        );


    const end =
        new THREE.Vector3(

            x -
            side * .18,

            3.65,

            z

        );


    const vara =
        cylinderBetween(

            start,
            end,

            .042,

            woodMaterial,

            6

        );


    scene.add(
        vara
    );


    return vara;

}


/* =========================================================
   ARAME
========================================================= */

function createMainWire(
    x
) {

    const start =
        new THREE.Vector3(

            x,
            3.65,
            4.3

        );


    const end =
        new THREE.Vector3(

            x,
            3.65,
            -FIELD_LENGTH - 3

        );


    const wire =
        cylinderBetween(

            start,
            end,

            .022,

            wireMaterial,

            6

        );


    scene.add(
        wire
    );


    return wire;

}


/* =========================================================
   ESTRUTURA REAL DA ROÇA
========================================================= */

function createSupportStructure(
    x
) {

    /*
       PALANQUE INICIAL
    */

    createMainPalanque(
        x,
        3
    );


    /*
       Depois de cada 8 pés:

       8 pés
       CRUZETA

       8 pés
       PALANQUE

       8 pés
       CRUZETA

       8 pés
       PALANQUE
    */


    const sectionDistance =
        PLANTS_PER_SECTION *
        PLANT_SPACING;


    for (
        let section = 1;
        section <= 5;
        section++
    ) {

        const z =
            3 -
            section *
            sectionDistance;


        if (
            section % 2 === 1
        ) {

            createCruzeta(
                x,
                z
            );

        } else {

            createMainPalanque(
                x,
                z
            );

        }

    }


    /*
       UM ÚNICO FIO PRINCIPAL
    */

    createMainWire(
        x
    );

}


createSupportStructure(
    -ROW_X
);


createSupportStructure(
    ROW_X
);


/* =========================================================
   FOLHAS
========================================================= */

function createLeaf(
    position,
    scale,
    rotationY = 0
) {

    const material =
        new THREE.MeshStandardMaterial({

            color:
                new THREE.Color()
                    .setHSL(

                        .30 +
                        Math.random() * .04,

                        .55,

                        .28 +
                        Math.random() * .14

                    ),

/* =========================================================
   PÉ PROCEDURAL
========================================================= */

function createProceduralPlant(
    x,
    z
) {

    const plant =
        new THREE.Group();


    const stemMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x3a6838,

            roughness:
                1

        });


    /*
       CAULE PRINCIPAL
    */

    const stem =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .065,
                .095,
                3.35,
                8

            ),

            stemMaterial

        );


    stem.position.y =
        1.68;


    stem.castShadow =
        true;


    plant.add(
        stem
    );


    /*
       GALHOS
    */

    for (
        let b = 0;
        b < 9;
        b++
    ) {

        const y =
            .55 +
            b *
            .31;


        const direction =
            b % 2 === 0
                ? 1
                : -1;


        const base =
            new THREE.Vector3(

                0,
                y,
                0

            );


        const end =
            new THREE.Vector3(

                direction *
                (
                    .55 +
                    Math.random() *
                    .35
                ),

                y +
                .15 +
                Math.random() *
                .18,

                (
                    Math.random() -
                    .5
                ) *
                .35

            );


        const branch =
            createBranch(

                base.clone()
                    .add(
                        new THREE.Vector3(
                            x,
                            0,
                            z
                        )
                    ),

                end.clone()
                    .add(
                        new THREE.Vector3(
                            x,
                            0,
                            z
                        )
                    )

            );


        branch.position.sub(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );


        plant.add(
            branch
        );


        /*
           FOLHAS NOS GALHOS
        */

        for (
            let l = 0;
            l < 3;
            l++
        ) {

            const leaf =
                createLeaf(

                    new THREE.Vector3(

                        end.x +
                        (
                            Math.random() -
                            .5
                        ) *
                        .35,

                        end.y +
                        (
                            Math.random() -
                            .5
                        ) *
                        .25,

                        end.z +
                        (
                            Math.random() -
                            .5
                        ) *
                        .35

                    ),

                    .35 +
                    Math.random() *
                    .18,

                    Math.random() *
                    Math.PI

                );


            leaf.position.sub(
                new THREE.Vector3(
                    x,
                    0,
                    z
                )
            );


            plant.add(
                leaf
            );

        }

    }


    /*
       FOLHAGEM EXTRA
    */

    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const y =
            .45 +
            Math.random() *
            2.6;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const radius =
            .25 +
            Math.random() *
            .70;


        const leaf =
            createLeaf(

                new THREE.Vector3(

                    Math.cos(angle) *
                    radius,

                    y,

                    Math.sin(angle) *
                    radius

                ),

                .30 +
                Math.random() *
                .22,

                angle

            );


        leaf.position.sub(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );


        plant.add(
            leaf
        );

    }


    /*
       CACHOS
    */

    const clusters =
        6;


    for (
        let c = 0;
        c < clusters;
        c++
    ) {

        const y =
            .65 +
            c *
            .45 +
            Math.random() *
            .15;


        const side =
            c % 2 === 0
                ? 1
                : -1;


        const clusterX =
            side *
            (
                .52 +
                Math.random() *
                .28
            );


        const amount =
            4 +
            Math.floor(
                Math.random() *
                3
            );


        for (
            let t = 0;
            t < amount;
            t++
        ) {

            const stage =
                Math.random();


            let color;
            let mature =
                false;


            /*
               VERDE
            */

            if (
                stage <
                .38
            ) {

                color =
                    0x4c983c;

            }


            /*
               AMARELO
            */

            else if (
                stage <
                .63
            ) {

                color =
                    0xd3a92e;

            }


            /*
               VERMELHO MADURO
            */

            else {

                color =
                    0xd7392c;

                mature =
                    true;

            }


            const tomato =
                createTomato(

                    new THREE.Vector3(

                        x +
                        clusterX +
                        (
                            Math.random() -
                            .5
                        ) *
                        .35,

                        y +
                        (
                            Math.random() -
                            .5
                        ) *
                        .35,

                        z +
                        (
                            Math.random() -
                            .5
                        ) *
                        .30

                    ),

                    color,

                    mature,

                    .75 +
                    Math.random() *
                    .35

                );


            tomato.position.sub(

                new THREE.Vector3(
                    x,
                    0,
                    z
                )

            );


            plant.add(
                tomato
            );

        }

    }


    /*
       FLORES
    */

    for (
        let f = 0;
        f < 7;
        f++
    ) {

        const flower =
            createFlower(

                new THREE.Vector3(

                    x +
                    (
                        Math.random() -
                        .5
                    ) *
                    1.1,

                    1.0 +
                    Math.random() *
                    1.7,

                    z +
                    (
                        Math.random() -
                        .5
                    ) *
                    .8

                ),

                .75

            );


        flower.position.sub(

            new THREE.Vector3(
                x,
                0,
                z
            )

        );


        plant.add(
            flower
        );

    }


    scene.add(
        plant
    );


    return plant;

}

async function loadRealTomatoPlant() {

    try {

        const result =
            await gltfLoader.loadAsync(
                TOMATO_GLB
            );


        glbPlant =
            result.scene;


        glbPlant.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;


                    if (
                        object.material
                    ) {

                        object.material
                            .roughness ??=
                            .75;

                    }

                }

            }
        );


        glbPlant.visible =
            false;


        scene.add(
            glbPlant
        );


        glbAvailable =
            true;


        console.log(
            "🍅 GLB do pé de tomate carregado."
        );


        replacePlantsWithGLB();

    }

    catch (
        error
    ) {

        console.log(
            "ℹ️ GLB ainda não encontrado. Usando pé procedural."
        );

    }

}

/* =========================================================
   MOVIMENTO
========================================================= */

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
) {

    const speed =
        4.2;


    let dx =
        0;


    let dz =
        0;


    if (
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ) {

        dx -=
            1;

    }


    if (
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ) {

        dx +=
            1;

    }


    if (
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ) {

        dz -=
            1;

    }


    if (
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ) {

        dz +=
            1;

    }


    if (
        dx !== 0 ||
        dz !== 0
    ) {

        const length =
            Math.sqrt(

                dx * dx +
                dz * dz

            );


        dx /=
            length;


        dz /=
            length;


        player.position.x +=
            dx *
            speed *
            delta;


        player.position.z +=
            dz *
            speed *
            delta;


        /*
           Mantemos o jogador
           no corredor.
        */

        player.position.x =
            THREE.MathUtils.clamp(

                player.position.x,

                -3.35,

                3.35

            );


        player.position.z =
            THREE.MathUtils.clamp(

                player.position.z,

                -FIELD_LENGTH + 3,

                7

            );


        player.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }

}

let nearestTomato =
    null;


function findNearestTomato() {

    nearestTomato =
        null;


    let bestDistance =
        Infinity;


    for (
        const tomato
        of tomatoObjects
    ) {

        if (
            !tomato.visible ||
            !tomato.userData.mature
        ) {

            continue;

        }


        const worldPosition =
            tomato.getWorldPosition(

                new THREE.Vector3()

            );


        const distance =
            player.position.distanceTo(
                worldPosition
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;


            nearestTomato =
                tomato;

        }

    }


    return nearestTomato;

}

}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            .05

        );


    const elapsed =
        performance.now();


    if (
        gameRunning
    ) {

        updatePlayer(
            delta
        );

    }


    updateCamera();


    updateClouds(
        delta
    );


    animatePlants(
        elapsed
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   CARREGAR GLB
========================================================= */

loadRealTomatoPlant();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>
