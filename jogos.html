<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Santa Luzia Games • Colheita</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #8fc7ff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

.hud-card {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(19,68,38,.12);
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
}

.hud-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .8px;
    color: #174b2c;
    margin-bottom: 3px;
}

.hud-value {
    font-size: 20px;
    font-weight: 900;
    color: #173d25;
}

#timer {
    color: #a43b27;
}

#message {
    position: fixed;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 30;

    padding: 11px 18px;
    border-radius: 30px;

    background: rgba(255,255,255,.95);
    color: #174b2c;

    font-size: 13px;
    font-weight: 800;

    box-shadow: 0 6px 20px rgba(0,0,0,.12);

    opacity: 0;
    transition: opacity .2s ease;

    pointer-events: none;
    white-space: nowrap;
}

#message.show {
    opacity: 1;
}

/* =========================
   CONTROLES
========================= */

#controls {
    position: fixed;
    left: 18px;
    bottom: 20px;
    z-index: 40;

    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 7px;
}

.control {
    width: 58px;
    height: 58px;

    border: none;
    border-radius: 17px;

    background: rgba(255,255,255,.90);
    color: #174b2c;

    font-size: 23px;
    font-weight: 900;

    box-shadow: 0 5px 15px rgba(0,0,0,.18);

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
    touch-action: none;
}

.control:active {
    transform: scale(.94);
    background: #174b2c;
    color: white;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}

/* =========================
   BOTÕES DIREITA
========================= */

#actions {
    position: fixed;
    right: 18px;
    bottom: 20px;
    z-index: 40;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.action-button {
    min-width: 120px;
    min-height: 50px;

    border: none;
    border-radius: 16px;

    padding: 0 16px;

    background: rgba(255,255,255,.94);
    color: #174b2c;

    font-size: 13px;
    font-weight: 900;

    box-shadow: 0 5px 15px rgba(0,0,0,.18);
}

.action-button:active {
    transform: scale(.96);
}

#harvestButton {
    background: #174b2c;
    color: white;
}

/* =========================
   TELA INICIAL
========================= */

#startScreen {
    position: fixed;
    inset: 0;

    z-index: 100;

    background:
        linear-gradient(
            rgba(11,43,25,.20),
            rgba(11,43,25,.50)
        );

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.start-card {
    width: min(430px, 100%);

    background: rgba(255,255,255,.97);
    border-radius: 26px;

    padding: 28px 22px;

    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,.28);
}

.logo-circle {
    width: 72px;
    height: 72px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background: #174b2c;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 37px;
}

.start-card h1 {
    margin: 0;
    color: #174b2c;
    font-size: 25px;
}

.start-card p {
    margin: 9px 0 20px;
    color: #5b665e;
    font-size: 14px;
    line-height: 1.5;
}

.start-button {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 15px;

    background: #174b2c;
    color: white;

    font-size: 15px;
    font-weight: 900;
}

.instructions {
    margin-top: 18px;
    padding: 13px;

    background: #f1f5f1;
    border-radius: 14px;

    color: #526056;
    font-size: 12px;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #hud {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .hud-card {
        padding: 8px 11px;
        border-radius: 13px;
    }

    .hud-value {
        font-size: 17px;
    }

    #message {
        top: 75px;
        font-size: 11px;
    }

    #controls {
        left: 12px;
        bottom: 12px;

        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(2, 52px);
    }

    .control {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        font-size: 20px;
    }

    #actions {
        right: 12px;
        bottom: 12px;
    }

    .action-button {
        min-width: 105px;
        min-height: 46px;
        font-size: 11px;
    }
}
</style>

<script type="module">

import * as THREE from "three";


/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const GAME_TIME = 60;

const FIELD_WIDTH = 34;
const FIELD_LENGTH = 100;

const PLAYER_SPEED = 5.5;

const HARVEST_DISTANCE = 4.2;


/* =========================================================
   VARIÁVEIS
========================================================= */

let scene;
let camera;
let renderer;

let player;

let tomatoes = [];

let score = 0;

let timeLeft = GAME_TIME;

let gameStarted = false;
let gameOver = false;

let lastTime = 0;

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};


/* =========================================================
   ELEMENTOS HTML
========================================================= */

const game = document.getElementById("game");

const scoreElement =
    document.getElementById("score");

const timerElement =
    document.getElementById("timer");

const messageElement =
    document.getElementById("message");

const startScreen =
    document.getElementById("startScreen");


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

init();


function init() {

    createScene();

    createLights();

    createWorld();

    createField();

    createPlayer();

    createCamera();

    createRenderer();

    setupControls();

    animate();

}


/* =========================================================
   CENA
========================================================= */

function createScene() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x8fc8ff);

    scene.fog =
        new THREE.Fog(
            0x8fc8ff,
            35,
            125
        );

}


/* =========================================================
   ILUMINAÇÃO
========================================================= */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x5a4630,
            2.2
        );

    scene.add(ambient);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -20,
        35,
        20
    );

    sun.castShadow = true;

    scene.add(sun);

}


/* =========================================================
   MATERIAIS
========================================================= */

const materials = {

    grass:
        new THREE.MeshStandardMaterial({
            color: 0x4f8d3b
        }),

    dirt:
        new THREE.MeshStandardMaterial({
            color: 0x8a5a35
        }),

    dirtDark:
        new THREE.MeshStandardMaterial({
            color: 0x704326
        }),

    wood:
        new THREE.MeshStandardMaterial({
            color: 0x68432a
        }),

    wire:
        new THREE.MeshStandardMaterial({
            color: 0x4b4b4b,
            metalness: .6,
            roughness: .5
        }),

    leaf:
        new THREE.MeshStandardMaterial({
            color: 0x286d2d
        }),

    tomato:
        new THREE.MeshStandardMaterial({
            color: 0xc92f27,
            roughness: .65
        }),

    tomatoLight:
        new THREE.MeshStandardMaterial({
            color: 0xf04432
        }),

    shirt:
        new THREE.MeshStandardMaterial({
            color: 0x174b2c
        }),

    skin:
        new THREE.MeshStandardMaterial({
            color: 0xc88b62
        }),

    pants:
        new THREE.MeshStandardMaterial({
            color: 0x2c3440
        }),

    shoe:
        new THREE.MeshStandardMaterial({
            color: 0x202020
        })

};


/* =========================================================
   MUNDO
========================================================= */

function createWorld() {

    const groundGeometry =
        new THREE.PlaneGeometry(
            180,
            180
        );

    const ground =
        new THREE.Mesh(
            groundGeometry,
            materials.grass
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y = -0.05;

    ground.receiveShadow = true;

    scene.add(ground);


    /*
       Estrada principal
    */

    const roadGeometry =
        new THREE.PlaneGeometry(
            8,
            FIELD_LENGTH
        );

    const road =
        new THREE.Mesh(
            roadGeometry,
            materials.dirt
        );

    road.rotation.x =
        -Math.PI / 2;

    road.position.set(
        0,
        0,
        0
    );

    scene.add(road);


    /*
       Pequenos caminhos laterais
    */

    for (
        let x = -15;
        x <= 15;
        x += 10
    ) {

        const path =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    3,
                    FIELD_LENGTH
                ),
                materials.dirtDark
            );

        path.rotation.x =
            -Math.PI / 2;

        path.position.set(
            x,
            0.01,
            0
        );

        scene.add(path);

    }


    /*
       Pequenos detalhes de terra
    */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const stone =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .05 + Math.random() * .08,
                    6,
                    6
                ),
                materials.dirtDark
            );

        stone.position.set(
            (Math.random() - .5) * 30,
            .04,
            (Math.random() - .5) * 90
        );

        scene.add(stone);

    }

}


/* =========================================================
   CAMPO DE TOMATES
========================================================= */

function createField() {

    /*
       Duas fileiras principais.

       O corredor central é onde
       o personagem poderá caminhar.
    */

    createTomatoRow(-7);

    createTomatoRow(7);

}


/* =========================================================
   FILEIRA
========================================================= */

function createTomatoRow(x) {

    const spacing = 5;

    for (
        let z = -45;
        z <= 45;
        z += spacing
    ) {

        createPlant(
            x,
            z
        );

    }

    /*
       Arames horizontais
    */

    for (
        let wireHeight = 1.4;
        wireHeight <= 2.8;
        wireHeight += .7
    ) {

        const wire =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .025,
                    .025,
                    90,
                    6
                ),
                materials.wire
            );

        wire.rotation.x =
            Math.PI / 2;

        wire.position.set(
            x,
            wireHeight,
            0
        );

        scene.add(wire);

    }

}


/* =========================================================
   PLANTA
========================================================= */

function createPlant(x, z) {

    /*
       Palanque
    */

    const post =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .10,
                .13,
                3.4,
                8
            ),
            materials.wood
        );

    post.position.set(
        x,
        1.7,
        z
    );

    post.castShadow = true;

    scene.add(post);


    /*
       Pequena cruzeta no topo
    */

    const cross =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.0,
                .10,
                .10
            ),
            materials.wood
        );

    cross.position.set(
        x,
        3.0,
        z
    );

    scene.add(cross);


    /*
       Planta principal
    */

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .055,
                .08,
                2.5,
                6
            ),
            materials.leaf
        );

    stem.position.set(
        x,
        1.3,
        z
    );

    scene.add(stem);


    /*
       Galhos
    */

    for (
        let branch = 0;
        branch < 4;
        branch++
    ) {

        const branchMesh =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .025,
                    .035,
                    1.2,
                    5
                ),
                materials.leaf
            );

        branchMesh.rotation.z =
            branch % 2 === 0
                ? .55
                : -.55;

        branchMesh.position.set(
            x +
            (branch % 2 === 0 ? .28 : -.28),
            1.0 + branch * .35,
            z
        );

        scene.add(branchMesh);

    }


    /*
       Folhas
    */

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const leaf =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .22,
                    7,
                    5
                ),
                materials.leaf
            );

        leaf.scale.y = .35;

        leaf.position.set(
            x +
            (Math.random() - .5) * .8,

            .8 +
            Math.random() * 2.1,

            z +
            (Math.random() - .5) * .35
        );

        leaf.rotation.z =
            Math.random() * Math.PI;

        scene.add(leaf);

    }


    /*
       Tomates

       Eles ficam próximos
       da planta, nunca no chão.
    */

    const tomatoCount =
        3 + Math.floor(Math.random() * 3);


    for (
        let i = 0;
        i < tomatoCount;
        i++
    ) {

        const tomato =
            createTomato(
                x,
                z,
                i
            );

        tomatoes.push(tomato);

    }

}


/* =========================================================
   TOMATE
========================================================= */

function createTomato(x, z, index) {

    const tomato =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .24,
                12,
                10
            ),
            index % 2 === 0
                ? materials.tomato
                : materials.tomatoLight
        );


    const side =
        Math.random() > .5
            ? 1
            : -1;


    tomato.position.set(

        x +
        side *
        (.30 + Math.random() * .35),

        .95 +
        Math.random() * 1.8,

        z +
        (Math.random() - .5) * .35

    );


    tomato.scale.y = .82;

    tomato.castShadow = true;

    tomato.userData.isTomato = true;

    tomato.userData.harvested = false;


    scene.add(tomato);


    /*
       Cabinho
    */

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .025,
                .025,
                .15,
                5
            ),
            materials.leaf
        );

    stem.position.copy(
        tomato.position
    );

    stem.position.y += .22;

    scene.add(stem);


    tomato.userData.stem =
        stem;


    return tomato;

}


/* =========================================================
   PERSONAGEM
========================================================= */

function createPlayer() {

    player =
        new THREE.Group();


    /*
       Corpo
    */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                .8,
                .38
            ),
            materials.shirt
        );

    body.position.y =
        1.15;

    player.add(body);


    /*
       Cabeça
    */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .27,
                16,
                12
            ),
            materials.skin
        );

    head.position.y =
        1.75;

    player.add(head);


    /*
       Boné
    */

    const cap =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .30,
                .30,
                .12,
                16
            ),
            materials.shirt
        );

    cap.position.y =
        2.02;

    player.add(cap);


    /*
       Pernas
    */

    const legGeometry =
        new THREE.BoxGeometry(
            .18,
            .7,
            .20
        );


    const leftLeg =
        new THREE.Mesh(
            legGeometry,
            materials.pants
        );

    leftLeg.position.set(
        -.14,
        .45,
        0
    );

    player.add(leftLeg);


    const rightLeg =
        new THREE.Mesh(
            legGeometry,
            materials.pants
        );

    rightLeg.position.set(
        .14,
        .45,
        0
    );

    player.add(rightLeg);


    /*
       Braços
    */

    const armGeometry =
        new THREE.BoxGeometry(
            .16,
            .65,
            .16
        );


    const leftArm =
        new THREE.Mesh(
            armGeometry,
            materials.skin
        );

    leftArm.position.set(
        -.40,
        1.18,
        0
    );

    leftArm.rotation.z =
        -.15;

    player.add(leftArm);


    const rightArm =
        new THREE.Mesh(
            armGeometry,
            materials.skin
        );

    rightArm.position.set(
        .40,
        1.18,
        0
    );

    rightArm.rotation.z =
        .15;

    player.add(rightArm);


    /*
       Botas
    */

    const shoeGeometry =
        new THREE.BoxGeometry(
            .22,
            .14,
            .36
        );


    const leftShoe =
        new THREE.Mesh(
            shoeGeometry,
            materials.shoe
        );

    leftShoe.position.set(
        -.14,
        .08,
        -.05
    );

    player.add(leftShoe);


    const rightShoe =
        new THREE.Mesh(
            shoeGeometry,
            materials.shoe
        );

    rightShoe.position.set(
        .14,
        .08,
        -.05
    );

    player.add(rightShoe);


    /*
       Posição inicial

       Dentro do corredor.
    */

    player.position.set(
        0,
        0,
        38
    );


    scene.add(player);

}


/* =========================================================
   CÂMERA
========================================================= */

function createCamera() {

    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            .1,
            200
        );


    camera.position.set(
        0,
        6,
        45
    );


    camera.lookAt(
        player.position
    );

}


/* =========================================================
   RENDERER
========================================================= */

function createRenderer() {

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.shadowMap.enabled = true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    game.appendChild(
        renderer.domElement
    );


    window.addEventListener(
        "resize",
        resize
    );

}


/* =========================================================
   CONTROLES
========================================================= */

function setupControls() {

    /*
       Teclado
    */

    window.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "ArrowUp" ||
                event.key.toLowerCase() === "w"
            ) {
                keys.up = true;
            }

            if (
                event.key === "ArrowDown" ||
                event.key.toLowerCase() === "s"
            ) {
                keys.down = true;
            }

            if (
                event.key === "ArrowLeft" ||
                event.key.toLowerCase() === "a"
            ) {
                keys.left = true;
            }

            if (
                event.key === "ArrowRight" ||
                event.key.toLowerCase() === "d"
            ) {
                keys.right = true;
            }

            if (
                event.code === "Space"
            ) {
                harvestNearest();
            }

        }
    );


    window.addEventListener(
        "keyup",
        event => {

            if (
                event.key === "ArrowUp" ||
                event.key.toLowerCase() === "w"
            ) {
                keys.up = false;
            }

            if (
                event.key === "ArrowDown" ||
                event.key.toLowerCase() === "s"
            ) {
                keys.down = false;
            }

            if (
                event.key === "ArrowLeft" ||
                event.key.toLowerCase() === "a"
            ) {
                keys.left = false;
            }

            if (
                event.key === "ArrowRight" ||
                event.key.toLowerCase() === "d"
            ) {
                keys.right = false;
            }

        }
    );


    /*
       Botões touch
    */

    bindTouchButton(
        "up",
        "up"
    );

    bindTouchButton(
        "down",
        "down"
    );

    bindTouchButton(
        "left",
        "left"
    );

    bindTouchButton(
        "right",
        "right"
    );


    /*
       Colher
    */

    document
        .getElementById("harvestButton")
        .addEventListener(
            "click",
            harvestNearest
        );


    /*
       Reiniciar
    */

    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            restartGame
        );


    /*
       Começar
    */

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            startGame
        );


    /*
       Clique direto no tomate
    */

    renderer.domElement.addEventListener(
        "pointerdown",
        event => {

            if (!gameStarted || gameOver)
                return;

            /*
               Ignora região dos controles.
            */

            if (
                event.clientY >
                window.innerHeight - 150
            ) {
                return;
            }


            harvestNearest();

        }
    );

}


function bindTouchButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );

}


/* =========================================================
   COMEÇAR
========================================================= */

function startGame() {

    startScreen.classList.add(
        "hidden"
    );

    gameStarted = true;
    gameOver = false;

    score = 0;

    timeLeft = GAME_TIME;

    updateHUD();

    showMessage(
        "🍅 Boa colheita!"
    );

}


/* =========================================================
   RECOMEÇAR
========================================================= */

function restartGame() {

    /*
       Remove tomates atuais
    */

    tomatoes.forEach(
        tomato => {

            if (
                tomato.parent
            ) {
                tomato.parent.remove(
                    tomato
                );
            }

            if (
                tomato.userData.stem &&
                tomato.userData.stem.parent
            ) {
                tomato.userData.stem.parent.remove(
                    tomato.userData.stem
                );
            }

        }
    );


    tomatoes = [];


    /*
       Recria as fileiras
    */

    createField();


    player.position.set(
        0,
        0,
        38
    );


    player.rotation.y = 0;


    score = 0;

    timeLeft = GAME_TIME;

    gameStarted = true;

    gameOver = false;

    startScreen.classList.add(
        "hidden"
    );

    updateHUD();

    showMessage(
        "↻ Nova colheita!"
    );

}


/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(
    delta
) {

    if (
        !gameStarted ||
        gameOver
    ) {
        return;
    }


    let dx = 0;
    let dz = 0;


    if (keys.left)
        dx -= 1;

    if (keys.right)
        dx += 1;

    if (keys.up)
        dz -= 1;

    if (keys.down)
        dz += 1;


    if (
        dx === 0 &&
        dz === 0
    ) {
        return;
    }


    const length =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    dx /= length;
    dz /= length;


    const speed =
        PLAYER_SPEED *
        delta;


    player.position.x +=
        dx * speed;


    player.position.z +=
        dz * speed;


    /*
       Limites laterais.

       O jogador fica no
       corredor central.
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -3.2,
            3.2
        );


    /*
       Limite da plantação
    */

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -45,
            40
        );


    /*
       Rotação do personagem
    */

    if (
        Math.abs(dx) >
        Math.abs(dz)
    ) {

        player.rotation.y =
            dx > 0
                ? Math.PI / 2
                : -Math.PI / 2;

    } else {

        player.rotation.y =
            dz > 0
                ? Math.PI
                : 0;

    }

}


/* =========================================================
   CÂMERA SEGUINDO JOGADOR
========================================================= */

function updateCamera() {

    if (!player)
        return;


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.2,
            player.position.z
        );


    const desired =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 5.8,
            player.position.z + 7.5
        );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target
    );

}


/* =========================================================
   COLHER TOMATE
========================================================= */

function harvestNearest() {

    if (
        !gameStarted ||
        gameOver
    ) {
        return;
    }


    let nearest = null;

    let nearestDistance =
        Infinity;


    tomatoes.forEach(
        tomato => {

            if (
                tomato.userData.harvested
            ) {
                return;
            }


            const distance =
                player.position.distanceTo(
                    tomato.position
                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearest =
                    tomato;

            }

        }
    );


    if (
        !nearest ||
        nearestDistance >
        HARVEST_DISTANCE
    ) {

        showMessage(
            "🍅 Chegue mais perto do tomate!"
        );

        return;

    }


    /*
       Marca colhido
    */

    nearest.userData.harvested =
        true;


    /*
       Remove tomate
    */

    scene.remove(
        nearest
    );


    if (
        nearest.userData.stem
    ) {

        scene.remove(
            nearest.userData.stem
        );

    }


    score++;


    updateHUD();


    showMessage(
        "🍅 Tomate colhido! +1"
    );


    /*
       Pequena vibração
       quando disponível.
    */

    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            30
        );

    }


    /*
       Verifica final
    */

    const remaining =
        tomatoes.filter(
            t =>
                !t.userData.harvested
        ).length;


    if (
        remaining === 0
    ) {

        finishGame(
            "🏆 Você colheu todos os tomates!"
        );

    }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    scoreElement.textContent =
        score;


    timerElement.textContent =
        Math.max(
            0,
            Math.ceil(timeLeft)
        );

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(
    delta
) {

    if (
        !gameStarted ||
        gameOver
    ) {
        return;
    }


    timeLeft -= delta;


    if (
        timeLeft <= 0
    ) {

        timeLeft = 0;

        finishGame(
            "⏱ Tempo encerrado!"
        );

    }


    updateHUD();

}


/* =========================================================
   FINAL
========================================================= */

function finishGame(
    text
) {

    gameOver = true;

    showMessage(
        text
    );


    setTimeout(
        () => {

            startScreen.classList.remove(
                "hidden"
            );


            const card =
                startScreen.querySelector(
                    ".start-card"
                );


            card.querySelector(
                "h1"
            ).textContent =
                "Colheita encerrada";


            card.querySelector(
                "p"
            ).innerHTML =
                `
                Você colheu
                <b>${score}</b>
                tomate${score === 1 ? "" : "s"}.
                <br><br>
                Esta é a primeira versão
                do nosso jogo 3D.
                `;


            card.querySelector(
                ".start-button"
            ).textContent =
                "JOGAR NOVAMENTE";


            gameStarted = false;

        },
        800
    );

}


/* =========================================================
   MENSAGEM
========================================================= */

let messageTimeout = null;


function showMessage(
    text
) {

    messageElement.textContent =
        text;


    messageElement.classList.add(
        "show"
    );


    clearTimeout(
        messageTimeout
    );


    messageTimeout =
        setTimeout(
            () => {

                messageElement.classList.remove(
                    "show"
                );

            },
            1300
        );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );

}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animate(
    time = 0
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (time - lastTime) / 1000,
            .05
        );


    lastTime = time;


    updatePlayer(
        delta
    );


    updateCamera();


    updateTimer(
        delta
    );


    /*
       Pequena animação dos tomates
       para dar vida ao cenário.
    */

    tomatoes.forEach(
        (tomato, index) => {

            if (
                tomato.userData.harvested
            ) {
                return;
            }


            tomato.rotation.y +=
                .003;


            const scale =
                1 +
                Math.sin(
                    time * .003 +
                    index
                ) * .025;


            tomato.scale.x =
                scale;

            tomato.scale.z =
                scale;

        }
    );


    renderer.render(
        scene,
        camera
    );

}

</script>
