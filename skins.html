<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob Azul - Santa Luzia Central</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f3f3;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 30px 20px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #666;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .voltar {
      display: inline-block;
      margin-bottom: 25px;
      text-decoration: none;
      color: #222;
      font-weight: bold;
    }

    .skin {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .skin h2 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .foto {
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .codigo-titulo {
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .codigo {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 16px;
    }

    .copiar {
      border: none;
      background: #222;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .mensagem {
      color: #228B22;
      font-weight: bold;
      margin-top: -18px;
      margin-bottom: 20px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <header>
    <img class="logo" src="IMG_6552.PNG" alt="Santa Luzia">
    <h1>SKINS</h1>
    <p class="subtitulo">Skins de teste da Santa Luzia Central</p>
  </header>

  <main>

    <a class="voltar" href="index.html">← Voltar para o início</a>

    <section class="skin">

      <h2>BOB AZUL 💙</h2>

      <img class="foto" src="bob.azul.sta.jpeg" alt="Bob Azul - Cabine">

      <h3 class="codigo-titulo">🚛 CÓDIGO DA CABINE</h3>

      <div class="codigo" id="codigoCabine">
        BUZpNIw.jpeg
      </div>

      <button class="copiar" onclick="copiarCodigo('codigoCabine', 'mensagemCabine')">
        📋 COPIAR CÓDIGO DA CABINE
      </button>

      <div class="mensagem" id="mensagemCabine"></div>

      <img class="foto" src="carroceria.bob.jpeg" alt="Bob Azul - Carroceria">

      <h3 class="codigo-titulo">📦 CÓDIGO DA CARROCERIA</h3>

      <div class="codigo" id="codigoCarroceria">
        NdKtdY2.jpeg
      </div>

      <button class="copiar" onclick="copiarCodigo('codigoCarroceria', 'mensagemCarroceria')">
        📋 COPIAR CÓDIGO DA CARROCERIA
      </button>

      <div class="mensagem" id="mensagemCarroceria"></div>

    </section>

  </main>

  <script>
    function copiarCodigo(idCodigo, idMensagem) {
      const codigo = document.getElementById(idCodigo).innerText.trim();

      navigator.clipboard.writeText(codigo).then(function() {
        document.getElementById(idMensagem).innerText =
          "✅ Código copiado!";
      });
    }
  </script>

</body>
</html>
