/* =========================

========================= */

});

/* =========================
   FUNÇÕES DE CONSTRUÇÃO
========================= */

function box(parent,x,y,z,w,h,d,material,cast=true){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

function cylinder(parent,x,y,z,radius,height,material,segments=12){

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      height,
      segments
    ),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

/* =========================
   COLISÕES
========================= */

const obstacles=[];

function addObstacle(x,z,w,d){

  obstacles.push({
    x,z,
    w,d
  });

}

function collides(x,z){

  const radius=.48;

  for(const o of obstacles){

    const nearestX=THREE.MathUtils.clamp(
      x,
      o.x-o.w/2,
      o.x+o.w/2
    );

    const nearestZ=THREE.MathUtils.clamp(
      z,
      o.z-o.d/2,
      o.z+o.d/2
    );

    const dx=x-nearestX;
    const dz=z-nearestZ;

    if(dx*dx+dz*dz<radius*radius){
      return true;
    }

  }

  return false;
}

/* =========================
   CONSTRUÇÕES
========================= */

function building(x,z,w,d,wallMat,roofMat){

  const group=new THREE.Group();
  group.position.set(x,0,z);

  box(group,0,1.6,0,w,3.2,d,wallMat);

  // Telhado em duas partes
  const a=box(
    group,-w*.25,3.35,0,
    w*.58,.22,d+.5,
    roofMat
  );

  a.rotation.z=-.48;

  const b=box(
    group,w*.25,3.35,0,
    w*.58,.22,d+.5,
    roofMat
  );

  b.rotation.z=.48;

  // Porta
  box(
    group,0,1.05,-d/2-.045,
    w*.22,2.1,.1,
    wood
  );

  // Janelas
  box(
    group,-w*.28,1.35,-d/2-.06,
    .85,1.25,.1,
    glass
  );

  box(
    group,w*.28,1.35,-d/2-.06,
    .85,1.25,.1,
    glass
  );

  scene.add(group);

  addObstacle(x,z,w,d);

  return group;
}

function signTexture(){

  const c=document.createElement('canvas');

  c.width=1200;
  c.height=320;

  const ctx=c.getContext('2d');

  ctx.fillStyle='#173d29';
  ctx.fillRect(0,0,1200,320);

  ctx.strokeStyle='#e8e2c9';
  ctx.lineWidth=12;
  ctx.strokeRect(10,10,1180,300);

  // Logo oficial
  const logo=new Image();

  logo.onload=()=>{

    ctx.drawImage(
      logo,
      35,65,
      190,190
    );

    texture.needsUpdate=true;

  };

  logo.onerror=()=>{
    console.log('Não foi possível carregar icon-192.PNG');
  };

  logo.src='../icon-192.PNG';

  ctx.textAlign='center';

  ctx.fillStyle='#fff7e7';
  ctx.font='bold 72px Arial';

  ctx.fillText(
    'FAZENDA SANTA LUZIA',
    710,135
  );

  ctx.fillStyle='#f0c9c4';
  ctx.font='bold 48px Arial';

  ctx.fillText(
    'TOMATES',
    710,205
  );

  ctx.fillStyle='#d7e9d7';
  ctx.font='bold 25px Arial';

  ctx.fillText(
    'TRADIÇÃO • QUALIDADE • PRODUÇÃO',
    710,255
  );

  const texture=new THREE.CanvasTexture(c);

  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

function sign(x,y,z,w,h){

  // Suporte de madeira
  box(
    scene,x,y,z,
    w,h,.3,
    wood
  );

  // Frente da placa
  const front=new THREE.Mesh(
    new THREE.PlaneGeometry(w-.3,h-.3),
    new THREE.MeshBasicMaterial({
      map:signTexture()
    })
  );

  front.position.set(
    x,y,z-.16
  );

  scene.add(front);

  // Pilares
  box(
    scene,x-w*.42,y-h*.95,z,
    .3,h*1.9,.3,
    wood
  );

  box(
    scene,x+w*.42,y-h*.95,z,
    .3,h*1.9,.3,
    wood
  );

}

function silo(x,z){

  const group=new THREE.Group();

  addObstacle(x,z,4.5,4.5);

/* =========================
   PLANTAÇÕES
========================= */

function cropField(cx,cz,rows,cols,spacingX,spacingZ,type){

  const width=cols*spacingX+2;
  const depth=rows*spacingZ+2;

  const patch=new THREE.Mesh(
    new THREE.PlaneGeometry(width,depth),
    dirt
  );

  patch.rotation.x=-Math.PI/2;
  patch.position.set(cx,.015,cz);

  scene.add(patch);

  // Linhas de plantação
  for(let r=0;r<rows;r++){

    const z=cz-depth/2+1.2+r*spacingZ;

    for(let c=0;c<cols;c++){

      const x=cx-width/2+1.2+c*spacingX;

      if(type==='tomato'){

        // Caule
        box(
          scene,x,.45,z,
          .12,.85,.12,
          green,false
        );

        // Frutos
        for(let k=0;k<4;k++){

          const fruit=new THREE.Mesh(
            new THREE.SphereGeometry(.19,10,8),
            tomato
          );

          fruit.position.set(
            x+(k%2)*.2-.1,
            .48+Math.floor(k/2)*.2,
            z+.12
          );

          fruit.castShadow=true;

          scene.add(fruit);

        }

        // Folhas
        const leaves=new THREE.Mesh(
          new THREE.SphereGeometry(.42,8,6),
          leaf
        );

        leaves.scale.set(1,.35,.65);
        leaves.position.set(x,.86,z);

        scene.add(leaves);

      }else{

        // Montinho da batata
        const mound=new THREE.Mesh(
          new THREE.SphereGeometry(.48,10,7),
          potato
        );

        mound.scale.set(1,.3,.55);
        mound.position.set(x,.18,z);

        scene.add(mound);

        // Folhagem
        const top=new THREE.Mesh(
          new THREE.SphereGeometry(.34,8,6),
          leaf
        );

        top.scale.set(1,.65,1);
        top.position.set(x,.48,z);

        scene.add(top);

      }

    }

  }

}

function tree(x,z,s=1){

  const group=new THREE.Group();

  group.position.set(x,0,z);

  cylinder(
    group,0,1.1*s,0,
    .27*s,2.2*s,
    wood,8
  );

  for(let i=0;i<3;i++){

    const crown=new THREE.Mesh(
      new THREE.SphereGeometry(1.25*s,10,8),
      i%2?darkGrass:green
    );

    crown.position.set(
      (i-1)*.55*s,
      2.5*s+(i===1?.55*s:0),
      0
    );

    crown.castShadow=true;
    crown.receiveShadow=true;

    group.add(crown);

  }

  scene.add(group);

  addObstacle(x,z,1.5*s,1.5*s);

}

/* =========================
   VEGETAÇÃO DECORATIVA
========================= */

function bush(x,z,s=1){

  const group=new THREE.Group();

  group.position.set(x,0,z);

  for(let i=0;i<3;i++){

    const b=new THREE.Mesh(
      new THREE.SphereGeometry(.45*s,8,6),
      i%2?darkGrass:leaf
    );

    b.position.set(
      (i-1)*.35*s,
      .4*s,
      0
    );

    group.add(b);

  }

  scene.add(group);

}

for(let i=0;i<55;i++){

  const x=Math.sin(i*14.2)*45;
  const z=Math.cos(i*8.4)*48;

  if(
    Math.abs(x)>6 &&
    Math.abs(z)>5 &&
    !(x>8&&x<27&&z<-5&&z>-22)
  ){

    bush(x,z,.7+(i%3)*.15);

  }

}

/* =========================
   CAMINHÕES E TRATOR
========================= */

function vehicle(x,z,color,isTruck=false){

  const g=new THREE.Group();

  g.position.set(x,0,z);

  const bodyMat=mat(color,.65);

  box(
    g,0,.95,0,
    isTruck?5.2:2.8,
    .85,
    isTruck?2.1:1.7,
    bodyMat
  );

  if(isTruck){

    box(
      g,-.9,1.9,.05,
      2.3,1.25,1.95,
      bodyMat
    );

    box(
      g,-.9,2,.99,
      1.55,.8,.04,
      glass
    );

    box(
      g,1.7,1.75,0,
      1.5,1.1,1.95,
      cream
    );

  }else{

    box(
      g,-.1,1.8,0,
      1.5,1.1,1.45,
      glass
    );

    box(
      g,1.15,.9,0,
      1.4,.45,1.6,
      metal
    );

  }

  const wheelX=isTruck?[-1.7,1.5]:[-.9,1];

  for(const wx of wheelX){

    for(const wz of [-.95,.95]){

      const w=new THREE.Mesh(
        new THREE.CylinderGeometry(.48,.48,.25,16),
        tire
      );

      w.rotation.x=Math.PI/2;
      w.position.set(wx,.48,wz);

      w.castShadow=true;

      g.add(w);

    }

  }

  scene.add(g);

  addObstacle(
    x,z,
    isTruck?5.5:3.2,
    isTruck?2.6:2.2
  );

  return g;

}

    new THREE.CylinderGeometry(.105,.13,.65,10),
    sleeve
  );

  arm.rotation.z=flip?-.25:.25;
  arm.position.set(x,y,z);

  hands.add(arm);

  const palm=new THREE.Mesh(
    new THREE.BoxGeometry(.22,.17,.2),
    skin
  );

  palm.position.set(
    x+(flip?-.03:.03),
    y+.34,
    z-.02
  );

  hands.add(palm);

  for(let i=0;i<4;i++){

    const f=new THREE.Mesh(
      new THREE.CylinderGeometry(.035,.04,.15,7),
      skin
    );

    f.position.set(
      x+(i-1.5)*.055+(flip?-.03:.03),
      y+.22,
      z-.1
    );

    f.rotation.x=-.35;

    hands.add(f);

  }

}

hand(-.38,-.62,-1.05,false);
hand(.38,-.62,-1.05,true);

hands.visible=false;

/* =========================
   MOVIMENTAÇÃO
========================= */

let yaw=0;
let pitch=0;
let started=false;

const keys={};

addEventListener('keydown',e=>{

  keys[e.code]=true;

  if([
    'Space',
    'ArrowUp',
    'ArrowDown',
    'ArrowLeft',
    'ArrowRight'
  ].includes(e.code)){

    e.preventDefault();

  }

});

addEventListener('keyup',e=>{
  keys[e.code]=false;
});

let joy={x:0,y:0};

let dragLook=false;
let lastX=0;
let lastY=0;

const controls=document.getElementById('controls');
const stick=document.getElementById('stick');

let joyId=null;

controls.addEventListener('pointerdown',e=>{

  joyId=e.pointerId;

  controls.setPointerCapture(joyId);

  updateJoy(e);

});

controls.addEventListener('pointermove',e=>{

  if(e.pointerId===joyId){
    updateJoy(e);
  }

});

function updateJoy(e){

  const r=controls.getBoundingClientRect();

  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);

  const len=Math.hypot(dx,dy);
  const max=36;

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;

  }

  joy.x=dx/max;
  joy.y=dy/max;

  stick.style.transform=`translate(${dx}px,${dy}px)`;

}

function resetJoy(){

  joy={x:0,y:0};
  joyId=null;

  stick.style.transform='translate(0,0)';

}

controls.addEventListener('pointerup',resetJoy);
controls.addEventListener('pointercancel',resetJoy);

/* =========================
   OLHAR AO REDOR
========================= */

renderer.domElement.addEventListener('pointerdown',e=>{

  if(!started)return;

  // Evita capturar o toque do joystick
  if(e.pointerType==='touch' && e.clientX<150 && e.clientY>innerHeight-160){
    return;
  }

  dragLook=true;

  lastX=e.clientX;
  lastY=e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);

});

renderer.domElement.addEventListener('pointermove',e=>{

  if(!dragLook)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  yaw-=dx*.004;

  pitch=Math.max(
    -1.15,
    Math.min(1.15,pitch-dy*.004)
  );

});

renderer.domElement.addEventListener('pointerup',()=>{
  dragLook=false;
});

renderer.domElement.addEventListener('pointercancel',()=>{
  dragLook=false;
});

/* =========================
   ENTRAR NA FAZENDA
========================= */

document.getElementById('start').addEventListener('click',()=>{

  started=true;

  document.getElementById('welcome').style.display='none';

  hands.visible=true;

  if(matchMedia('(pointer:fine)').matches){

    renderer.domElement.requestPointerLock?.();

  }

});

document.addEventListener('mousemove',e=>{

  if(
    document.pointerLockElement===renderer.domElement
    && started
  ){

    yaw-=e.movementX*.0025;

    pitch=Math.max(
      -1.1,
      Math.min(1.1,pitch-e.movementY*.0025)
    );

  }

});

/* =========================
   LOOP DO JOGO
========================= */

const clock=new THREE.Clock();

let walkTime=0;

function animate(){

  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.05);

  if(started){

    camera.rotation.set(pitch,yaw,0);

    const forward=new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

    const right=new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

    let move=new THREE.Vector3();

    if(keys.KeyW||keys.ArrowUp)move.add(forward);
    if(keys.KeyS||keys.ArrowDown)move.sub(forward);
    if(keys.KeyD||keys.ArrowRight)move.add(right);
    if(keys.KeyA||keys.ArrowLeft)move.sub(right);

    move.addScaledVector(forward,-joy.y);
    move.addScaledVector(right,joy.x);

    const moving=move.lengthSq()>0;

    if(moving){

      move.normalize();

      const speed=5.2*delta;

      const nextX=camera.position.x+move.x*speed;
      const nextZ=camera.position.z+move.z*speed;

      // Colisão independente nos eixos
      if(!collides(nextX,camera.position.z)){
        camera.position.x=nextX;
      }

      if(!collides(camera.position.x,nextZ)){
        camera.position.z=nextZ;
      }

      walkTime+=delta*9;

    }

    // Limites do mapa
    camera.position.x=THREE.MathUtils.clamp(
      camera.position.x,-58,58
    );

    camera.position.z=THREE.MathUtils.clamp(
      camera.position.z,-58,68
    );

    camera.position.y=1.7;

    // Movimento leve das mãos
    const bob=moving?Math.sin(walkTime)*.025:0;

    hands.position.y=bob;
    hands.position.x=moving?Math.cos(walkTime*.5)*.012:0;

  }

  renderer.render(scene,camera);

}

animate();

/* =========================
   AJUSTE DE TELA
========================= */

addEventListener('resize',()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

});

</script>
