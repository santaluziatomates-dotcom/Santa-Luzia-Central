
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>Presépio Santa Luzia 2026</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080d1b;
  color: #fff;
  font-family: Georgia, serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 680px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 75% 20%, #39405a 0%, transparent 35%),
    linear-gradient(180deg, #080d1b 0%, #151d33 55%, #393039 100%);
}

/* CÉU */

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 10% 15%, #fff 90%, transparent),
    radial-gradient(2px 2px at 25% 35%, #fff 90%, transparent),
    radial-gradient(1px 1px at 40% 12%, #fff 90%, transparent),
    radial-gradient(2px 2px at 65% 22%, #fff 90%, transparent),
    radial-gradient(1px 1px at 80% 10%, #fff 90%, transparent),
    radial-gradient(2px 2px at 90% 38%, #fff 90%, transparent),
    radial-gradient(1px 1px at 55% 43%, #fff 90%, transparent);
  background-size: 300px 250px;
  animation: twinkle 5s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .4; }
  to { opacity: 1; }
}

.moon {
  position: absolute;
  top: 11%;
  left: 12%;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f4e8c5;
  box-shadow: 0 0 35px #f4e8c577;
}

/* ESTRELA DE BELÉM */

.star-glow {
  position: absolute;
  top: 12%;
  right: 16%;
  width: 100px;
  height: 100px;
  background: #ffe7a2;
  border-radius: 50%;
  filter: blur(40px);
  opacity: .55;
  animation: glow 3s infinite alternate;
}

.star {
  position: absolute;
  top: 14%;
  right: calc(16% + 28px);
  width: 44px;
  height: 44px;
  background: #fff0bc;
  clip-path: polygon(
    50% 0%, 61% 38%, 100% 50%,
    61% 62%, 50% 100%, 39% 62%,
    0% 50%, 39% 38%
  );
  filter: drop-shadow(0 0 15px #ffe7a2);
  animation: starshine 3s infinite alternate;
}

@keyframes starshine {
  from { transform: scale(.9); }
  to { transform: scale(1.15); }
}

@keyframes glow {
  from { opacity: .3; }
  to { opacity: .7; }
}

/* TÍTULO */

.intro {
  position: absolute;
  z-index: 10;
  top: 5%;
  width: 100%;
  text-align: center;
  padding: 15px;
  text-shadow: 0 2px 15px #000;
}

.intro small {
  color: #e5c88e;
  letter-spacing: 4px;
  font-size: 10px;
}

.intro h1 {
  margin-top: 12px;
  color: #f3dfb8;
  font-size: clamp(32px, 8vw, 45px);
  font-weight: normal;
}

.intro p {
  margin-top: 9px;
  font-size: 13px;
  color: #ddd2c0;
}

/* MONTANHAS */

.mountain {
  position: absolute;
  bottom: 27%;
  width: 120%;
  left: -10%;
  height: 32%;
  clip-path: polygon(
    0 70%, 12% 35%, 22% 60%, 35% 15%,
    48% 65%, 62% 22%, 75% 60%, 88% 30%,
    100% 65%, 100% 100%, 0 100%
  );
}

.mountain.back {
  background: #252c3c;
  bottom: 30%;
  opacity: .8;
  transform: scaleX(-1);
}

.mountain.front {
  background: linear-gradient(90deg, #303344, #222838);
}

/* TERRENO DA CIDADE */

.hill {
  position: absolute;
  bottom: 0;
  width: 120%;
  left: -10%;
  height: 43%;
  background: linear-gradient(180deg, #68513f, #302725);
  border-radius: 50% 50% 0 0 / 15% 15% 0 0;
}

/* CIDADE */

.city {
  position: absolute;
  z-index: 3;
  bottom: 29%;
  width: 100%;
  height: 31%;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: 5px;
  padding: 0 7px;
}

.house {
  position: relative;
  width: 14%;
  max-width: 88px;
  height: 65%;
  background:
    linear-gradient(90deg, #59483d, #9a7658 48%, #614a3c);
  border: 1px solid #a68a69;
  border-bottom: 0;
  box-shadow: inset 0 0 15px #291d19;
}

.house.tall { height: 82%; }
.house.short { height: 52%; }
.house.medium { height: 70%; }

.house::before {
  content: "";
  position: absolute;
  top: -20px;
  left: -7px;
  width: calc(100% + 14px);
  height: 22px;
  background: linear-gradient(180deg, #5a4132, #392b26);
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  border-bottom: 2px solid #a17a57;
}

.house::after {
  content: "";
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  height: 3px;
  background: #b08a65;
  opacity: .35;
}

.window {
  position: absolute;
  top: 34%;
  left: 50%;
  transform: translateX(-50%);
  width: 13px;
  height: 20px;
  border-radius: 7px 7px 0 0;
  background: #ffd17b;
  box-shadow: 0 0 18px 5px #ffc56a77;
}

.door {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 36px;
  background: linear-gradient(90deg, #35241c, #694632);
  border: 2px solid #4a3428;
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
}

.door::after {
  content: "";
  position: absolute;
  right: 4px;
  top: 18px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #d7ae69;
}

.roof-detail {
  position: absolute;
  z-index: 2;
  top: -4px;
  left: 0;
  width: 100%;
  height: 3px;
  background: #b08b68;
}

/* CAMINHO */

.path {
  position: absolute;
  z-index: 4;
  bottom: 0;
  left: 31%;
  width: 38%;
  height: 34%;
  background:
    linear-gradient(90deg, #554334, #9b7957 50%, #554334);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  opacity: .9;
}

.path::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0 45px,
    #3f312b 47px 49px
  );
}

/* TOCHAS */

.torch {
  position: absolute;
  z-index: 5;
  bottom: 25%;
  width: 8px;
  height: 17px;
  background: #ffd17b;
  border-radius: 50%;
  box-shadow: 0 0 18px 7px #ffbd5a66;
  animation: fire 1.5s infinite alternate;
}

.torch.left { left: 13%; }
.torch.right { right: 13%; }

@keyframes fire {
  from { opacity: .65; transform: scale(.9); }
  to { opacity: 1; transform: scale(1.1); }
}

/* FINAL */

.footer {
  position: absolute;
  z-index: 10;
  bottom: 4%;
  width: 100%;
  text-align: center;
  padding: 10px;
  text-shadow: 0 2px 10px #000;
}

.footer p {
  font-size: 13px;
  color: #e8d9bc;
  margin-bottom: 17px;
}

button {
  padding: 14px 30px;
  border: 1px solid #d6b77d;
  border-radius: 30px;
  background: linear-gradient(135deg, #98764d, #49382a);
  color: #fff1d2;
  font-family: Georgia, serif;
  font-size: 14px;
}

button:active {
  transform: scale(.96);
}

@media (max-height: 750px) {
  .city { bottom: 27%; height: 29%; }
  .mountain { bottom: 26%; }
  .footer { bottom: 2%; }
}
</style>
</head>

<body>

<div class="scene">

  <div class="stars"></div>
  <div class="moon"></div>

  <div class="star-glow"></div>
  <div class="star"></div>

  <div class="intro">
    <small>SANTA LUZIA APRESENTA</small>
    <h1>Belém</h1>
    <p>Uma noite que mudou a história da humanidade</p>
  </div>

  <div class="mountain back"></div>
  <div class="mountain front"></div>

  <div class="hill"></div>

  <div class="city">

    <div class="house short">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house tall">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house medium">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house tall">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house medium">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house short">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

    <div class="house medium">
      <div class="roof-detail"></div>
      <div class="window"></div>
      <div class="door"></div>
    </div>

  </div>

  <div class="path"></div>

  <div class="torch left"></div>
  <div class="torch right"></div>

  <div class="footer">
    <p>Prepare seu coração para conhecer essa história.</p>
    <button onclick="alert('Em breve: a história do nascimento de Jesus!')">
      Iniciar a história
    </button>
  </div>

</div>

</body>
</html>
