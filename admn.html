<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel ADM • Santa Luzia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f4;
      color: #183322;
    }

    .topo {
      background: #176b3a;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .topo h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .topo p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    .voltar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 12px 14px;
      padding: 9px 13px;
      background: #ffffff;
      color: #176b3a;
      border: 1px solid #dfe5df;
      border-radius: 11px;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
    }

    .container {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto 40px;
    }

    .bloqueio {
      background: white;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    .bloqueio .icone {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .bloqueio h2 {
      margin: 0 0 8px;
      color: #176b3a;
    }

    .bloqueio p {
      color: #68756d;
      font-size: 14px;
      line-height: 1.5;
    }

    .bloqueio a {
      display: inline-block;
      margin-top: 12px;
      background: #176b3a;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .conta {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 15px;
      padding: 14px 16px;
      margin-top: 5px;
      margin-bottom: 18px;
    }

    .conta strong {
      color: #176b3a;
    }

    .conta small {
      display: block;
      margin-top: 4px;
      color: #68756d;
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-resumo {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 15px;
      padding: 16px;
    }

    .card-resumo span {
      display: block;
      font-size: 11px;
      color: #718078;
      font-weight: bold;
      text-transform: uppercase;
    }

    .card-resumo strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
      color: #176b3a;
    }

    .barra {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .barra input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d7e0d9;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .barra input:focus {
      border-color: #176b3a;
    }

    .titulo-secao {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 18px 0 12px;
    }

    .titulo-secao h2 {
      margin: 0;
      font-size: 19px;
      color: #176b3a;
    }

    .lista {
      display: grid;
      gap: 13px;
    }

    .motorista {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 17px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.035);
    }

    .motorista-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .motorista-nome {
      min-width: 0;
    }

    .motorista-nome h3 {
      margin: 0;
      font-size: 17px;
      color: #183322;
    }

    .motorista-nome p {
      margin: 5px 0 0;
      color: #6d7a72;
      font-size: 12px;
    }

    .codigo {
      display: inline-block;
      margin-top: 7px;
      background: #edf7ef;
      color: #176b3a;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 900;
    }

    .status-badge {
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-ativo {
      background: #e5f7ea;
      color: #16833d;
    }

    .status-pendente {
      background: #fff5d8;
      color: #a36c00;
    }

    .status-inativo {
      background: #ffe7e7;
      color: #b82d2d;
    }

    .info-linha {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .info {
      background: #f7f9f7;
      border-radius: 10px;
      padding: 9px;
    }

    .info small {
      display: block;
      font-size: 9px;
      color: #77837c;
      text-transform: uppercase;
      font-weight: bold;
    }

    .info strong {
      display: block;
      margin-top: 3px;
      font-size: 12px;
    }

    .controle {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #edf0ed;
    }

    .controle-titulo {
      font-size: 11px;
      font-weight: 900;
      color: #176b3a;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      transition: .15s;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-ativo {
      background: #e2f5e8;
      color: #16783a;
    }

    .btn-pendente {
      background: #fff3cf;
      color: #9a6800;
    }

    .btn-inativo {
      background: #ffe4e4;
      color: #a92b2b;
    }

    .btn-salario-on {
      background: #176b3a;
      color: white;
    }

    .btn-salario-off {
      background: #edf0ed;
      color: #58645d;
    }

    .stacoin-box {
      margin-top: 14px;
      padding: 13px;
      border-radius: 13px;
      background: linear-gradient(135deg, #fffdf3, #f8f5e5);
      border: 1px solid #eadf9f;
    }

    .stacoin-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .stacoin-titulo {
      font-size: 12px;
      font-weight: 900;
      color: #735800;
    }

    .stacoin-saldo {
      font-size: 17px;
      font-weight: 900;
      color: #176b3a;
      white-space: nowrap;
    }

    .stacoin-acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-stacoin {
      border: 0;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-adicionar {
      background: #176b3a;
      color: white;
    }

    .btn-retirar {
      background: #fff;
      color: #a62b2b;
      border: 1px solid #e6bcbc;
    }

    .vazio {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #718078;
    }

    .carregando {
      padding: 25px;
      text-align: center;
      color: #66746b;
    }

    .mensagem {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: #183322;
      color: white;
      padding: 12px 17px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      z-index: 9999;
      max-width: calc(100% - 30px);
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      display: none;
    }

    /* MODAL STACOIN */

    .modal-fundo {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 15, .58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 5000;
    }

    .modal {
      width: min(430px, 100%);
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .modal h2 {
      margin: 0;
      color: #176b3a;
      font-size: 20px;
    }

    .modal-subtitulo {
      margin: 5px 0 18px;
      color: #6d7a72;
      font-size: 12px;
    }

    .tipo-operacao {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .tipo-entrada {
      background: #e5f7ea;
      color: #176b3a;
    }

    .tipo-saida {
      background: #ffe8e8;
      color: #a72d2d;
    }

    .campo {
      margin-bottom: 13px;
    }

    .campo label {
      display: block;
      font-size: 10px;
      font-weight: 900;
      color: #536158;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .campo input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d6dfd8;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .campo input:focus {
      border-color: #176b3a;
    }

    .modal-botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 17px;
    }

    .modal-botoes button {
      padding: 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-cancelar {
      background: #eef1ee;
      color: #526058;
      border: 0;
    }

    .btn-confirmar {
      background: #176b3a;
      color: white;
      border: 0;
    }

    .btn-confirmar.saida {
      background: #a72d2d;
    }

    @media (max-width: 760px) {
      .resumo {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .topo h1 {
        font-size: 21px;
      }

      .info-linha {
        grid-template-columns: 1fr 1fr;
      }

      .motorista-topo {
        align-items: flex-start;
      }

      .stacoin-topo {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>👑 PAINEL ADM</h1>
    <p>Gestão interna • Santa Luzia Tomates</p>
  </div>

  <a href="index.html" class="voltar">
    ← VOLTAR PARA A CENTRAL
  </a>

  <main class="container">

    <div id="bloqueio" class="bloqueio" style="display:none;"></div>

    <section id="painel" style="display:none;">

      <div class="conta">
        <strong>👤 Conta conectada</strong>
        <small id="contaInfo">Carregando...</small>
      </div>

      <div class="resumo">
        <div class="card-resumo">
          <span>Total</span>
          <strong id="totalMotoristas">0</strong>
        </div>

        <div class="card-resumo">
          <span>Ativos</span>
          <strong id="totalAtivos">0</strong>
        </div>

        <div class="card-resumo">
          <span>Salário ativo</span>
          <strong id="totalSalario">0</strong>
        </div>

        <div class="card-resumo">
          <span>STACOIN</span>
          <strong id="totalStacoin">0</strong>
        </div>
      </div>

      <div class="barra">
        <input
          type="search"
          id="busca"
          placeholder="🔎 Buscar por nome, apelido, código ou cargo..."
        >
      </div>

      <div class="titulo-secao">
        <h2>🚛 Motoristas</h2>
      </div>

      <div id="listaMotoristas" class="lista">
        <div class="carregando">
          Carregando motoristas...
        </div>
      </div>

    </section>

  </main>

  <div id="mensagem" class="mensagem"></div>

  <!-- MODAL STACOIN -->

  <div id="modalStacoin" class="modal-fundo">

    <div class="modal">

      <h2 id="modalStacoinTitulo">🪙 STACOIN</h2>

      <div id="modalStacoinSubtitulo" class="modal-subtitulo">
        Alterar saldo do motorista
      </div>

      <div id="tipoOperacao" class="tipo-operacao tipo-entrada">
        ➕ ADICIONAR STACOIN
      </div>

      <div class="campo">
        <label>Motorista</label>
        <input
          type="text"
          id="stacoinMotorista"
          readonly
        >
      </div>

      <div class="campo">
        <label>Valor</label>
        <input
          type="number"
          id="stacoinValor"
          min="1"
          step="1"
          placeholder="Ex.: 1000"
        >
      </div>

      <div class="campo">
        <label>Motivo</label>
        <input
          type="text"
          id="stacoinMotivo"
          maxlength="150"
          placeholder="Ex.: Bonificação ADM"
        >
      </div>

      <div class="modal-botoes">

        <button
          type="button"
          class="btn-cancelar"
          onclick="fecharModalStacoin()"
        >
          CANCELAR
        </button>

        <button
          type="button"
          id="btnConfirmarStacoin"
          class="btn-confirmar"
          onclick="confirmarStacoin()"
        >
          CONFIRMAR
        </button>

      </div>

    </div>

  </div>

<script>
  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://cckypvqophyviphqhich.supabase.co";

  /*
    COLOQUE AQUI A MESMA CHAVE PÚBLICA QUE JÁ ESTÁ FUNCIONANDO
    NO SEU INDEX.HTML.
  */
  const SUPABASE_ANON_KEY =
    "sb_publishable_M_6iIpO4FhNhxskWG0XXrA_Uwuw_bbP";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      }
    );


  /* =========================================================
     ESTADO
  ========================================================= */

  let motoristas = [];

  let motoristaStacoinSelecionado = null;

  let tipoStacoinSelecionado = "entrada";


  /* =========================================================
     UTILIDADES
  ========================================================= */

  function escaparHTML(valor) {
    return String(valor ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatarNumero(valor) {
    const numero = Number(valor || 0);

    return numero.toLocaleString("pt-BR");
  }


  function mostrarMensagem(texto, tempo = 3200) {
    const elemento = document.getElementById("mensagem");

    elemento.textContent = texto;
    elemento.style.display = "block";

    clearTimeout(window.timerMensagem);

    window.timerMensagem = setTimeout(() => {
      elemento.style.display = "none";
    }, tempo);
  }


  function mostrarBloqueio(titulo, texto, mostrarLink = false) {

    const bloqueio =
      document.getElementById("bloqueio");

    bloqueio.innerHTML = `
      <div class="icone">🔒</div>

      <h2>${escaparHTML(titulo)}</h2>

      <p>
        ${escaparHTML(texto)}
      </p>

      ${
        mostrarLink
          ? `
            <a href="index.html">
              ← VOLTAR PARA A CENTRAL
            </a>
          `
          : ""
      }
    `;

    bloqueio.style.display = "block";

    document.getElementById("painel").style.display = "none";
  }


  /* =========================================================
     AUTENTICAÇÃO
  ========================================================= */

  async function iniciarPainel() {

    try {

      const {
        data: sessionData,
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        console.error(sessionError);

        mostrarBloqueio(
          "Não foi possível verificar",
          sessionError.message || "Erro ao verificar sua sessão.",
          true
        );

        return;
      }

      const session = sessionData?.session;

      if (!session) {

        mostrarBloqueio(
          "Login necessário",
          "Entre primeiro na sua conta Google pela Santa Luzia Central e depois volte para o Painel ADM.",
          true
        );

        return;
      }

      const email =
        session.user?.email ||
        "Conta conectada";

      document.getElementById("contaInfo").textContent =
        email;

      /* VERIFICA ADM */

      const {
        data: souAdm,
        error: admError
      } = await supabaseClient.rpc("sou_adm");

      if (admError) {

        console.error("Erro sou_adm:", admError);

        mostrarBloqueio(
          "Não foi possível verificar",
          admError.message ||
          "O sistema não conseguiu confirmar sua autorização de administrador.",
          true
        );

        return;
      }

      if (!souAdm) {

        mostrarBloqueio(
          "Acesso restrito",
          "Esta área é exclusiva para administradores da Santa Luzia.",
          true
        );

        return;
      }

      document.getElementById("bloqueio").style.display =
        "none";

      document.getElementById("painel").style.display =
        "block";

      await carregarMotoristas();

    } catch (erro) {

      console.error(erro);

      mostrarBloqueio(
        "Erro ao abrir o painel",
        erro?.message ||
        "Ocorreu um erro inesperado.",
        true
      );
    }
  }


  /* =========================================================
     CARREGAR MOTORISTAS
  ========================================================= */

  async function carregarMotoristas() {

    const lista =
      document.getElementById("listaMotoristas");

    lista.innerHTML = `
      <div class="carregando">
        Carregando motoristas...
      </div>
    `;

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "listar_motoristas_adm"
    );

    if (error) {

      console.error(error);

      lista.innerHTML = `
        <div class="vazio">
          ❌ Não foi possível carregar os motoristas.<br><br>
          ${escaparHTML(error.message)}
        </div>
      `;

      return;
    }

    motoristas = Array.isArray(data)
      ? data
      : [];

    atualizarResumo();

    renderizarMotoristas();
  }


  /* =========================================================
     RESUMO
  ========================================================= */

  function atualizarResumo() {

    const total =
      motoristas.length;

    const ativos =
      motoristas.filter(m =>
        String(m.status || "").toLowerCase() === "ativo"
      ).length;

    const salario =
      motoristas.filter(m =>
        Boolean(m.salario_ativo)
      ).length;

    const stacoin =
      motoristas.reduce(
        (total, m) =>
          total + Number(m.saldo_stacoin || 0),
        0
      );

    document.getElementById("totalMotoristas")
      .textContent = total;

    document.getElementById("totalAtivos")
      .textContent = ativos;

    document.getElementById("totalSalario")
      .textContent = salario;

    document.getElementById("totalStacoin")
      .textContent = formatarNumero(stacoin);
  }


  /* =========================================================
     RENDERIZAR MOTORISTAS
  ========================================================= */

  function renderizarMotoristas() {

    const lista =
      document.getElementById("listaMotoristas");

    const busca =
      document.getElementById("busca")
        .value
        .trim()
        .toLowerCase();

    const filtrados =
      motoristas.filter(m => {

        const texto = [
          m.nome,
          m.apelido,
          m.codigo,
          m.cargo,
          m.categoria,
          m.status
        ]
          .join(" ")
          .toLowerCase();

        return texto.includes(busca);
      });

    if (!filtrados.length) {

      lista.innerHTML = `
        <div class="vazio">
          Nenhum motorista encontrado.
        </div>
      `;

      return;
    }

    lista.innerHTML =
      filtrados
        .map(m => criarCardMotorista(m))
        .join("");
  }


  function criarCardMotorista(m) {

    const status =
      String(m.status || "pendente")
        .toLowerCase();

    let statusClasse =
      "status-pendente";

    let statusTexto =
      "🟡 PENDENTE";

    if (status === "ativo") {

      statusClasse =
        "status-ativo";

      statusTexto =
        "🟢 ATIVO";

    } else if (status === "inativo") {

      statusClasse =
        "status-inativo";

      statusTexto =
        "🔴 INATIVO";
    }

    const salarioAtivo =
      Boolean(m.salario_ativo);

    const saldo =
      Number(m.saldo_stacoin || 0);

    return `
      <article class="motorista">

        <div class="motorista-topo">

          <div class="motorista-nome">

            <h3>
              ${escaparHTML(m.nome || "Sem nome")}
            </h3>

            <p>
              ${escaparHTML(m.apelido || "Sem apelido")}
              •
              ${escaparHTML(m.cargo || "Sem cargo")}
            </p>

            <span class="codigo">
              ${escaparHTML(m.codigo || "SEM ID")}
            </span>

          </div>

          <span class="status-badge ${statusClasse}">
            ${statusTexto}
          </span>

        </div>


        <div class="info-linha">

          <div class="info">
            <small>Categoria</small>
            <strong>
              ${escaparHTML(m.categoria || "—")}
            </strong>
          </div>

          <div class="info">
            <small>Nível</small>
            <strong>
              ${escaparHTML(m.nível ?? m.nivel ?? "—")}
            </strong>
          </div>

          <div class="info">
            <small>XP</small>
            <strong>
              ${formatarNumero(m.xp || 0)}
            </strong>
          </div>

        </div>


        <!-- STATUS -->

        <div class="controle">

          <div class="controle-titulo">
            🔐 Status do motorista
          </div>

          <div class="botoes">

            <button
              type="button"
              class="btn btn-ativo"
              onclick="alterarStatus(${Number(m.id)}, 'ativo')"
            >
              🟢 ATIVO
            </button>

            <button
              type="button"
              class="btn btn-pendente"
              onclick="alterarStatus(${Number(m.id)}, 'pendente')"
            >
              🟡 PENDENTE
            </button>

            <button
              type="button"
              class="btn btn-inativo"
              onclick="alterarStatus(${Number(m.id)}, 'inativo')"
            >
              🔴 INATIVO
            </button>

          </div>

        </div>


        <!-- SALÁRIO -->

        <div class="controle">

          <div class="controle-titulo">
            💰 Salário quinzenal
          </div>

          <div class="botoes">

            <button
              type="button"
              class="btn ${
                salarioAtivo
                  ? "btn-salario-on"
                  : "btn-salario-off"
              }"
              onclick="alterarSalario(${Number(m.id)}, ${!salarioAtivo})"
            >
              ${
                salarioAtivo
                  ? "🟢 SALÁRIO ATIVO"
                  : "⚪ SALÁRIO INATIVO"
              }
            </button>

          </div>

        </div>


        <!-- STACOIN -->

        <div class="stacoin-box">

          <div class="stacoin-topo">

            <div class="stacoin-titulo">
              🪙 STACOIN
            </div>

            <div class="stacoin-saldo">
              ${formatarNumero(saldo)} STC
            </div>

          </div>

          <div class="stacoin-acoes">

            <button
              type="button"
              class="btn-stacoin btn-adicionar"
              onclick="abrirModalStacoin(${Number(m.id)}, 'entrada')"
            >
              ➕ ADICIONAR STACOIN
            </button>

            <button
              type="button"
              class="btn-stacoin btn-retirar"
              onclick="abrirModalStacoin(${Number(m.id)}, 'saida')"
            >
              ➖ RETIRAR STACOIN
            </button>

          </div>

        </div>

      </article>
    `;
  }


  /* =========================================================
     ALTERAR STATUS
  ========================================================= */

  async function alterarStatus(id, novoStatus) {

    const motorista =
      motoristas.find(m =>
        Number(m.id) === Number(id)
      );

    if (!motorista) {
      mostrarMensagem("Motorista não encontrado.");
      return;
    }

    const nomes = {
      ativo: "ATIVO",
      pendente: "PENDENTE",
      inativo: "INATIVO"
    };

    const confirmou =
      confirm(
        `Alterar ${motorista.nome} para ${nomes[novoStatus]}?`
      );

    if (!confirmou) {
      return;
    }

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "definir_status_motorista",
      {
        p_motorista_id: Number(id),
        p_status: novoStatus
      }
    );

    if (error) {

      console.error(error);

      mostrarMensagem(
        "❌ " + (error.message || "Não foi possível alterar o status.")
      );

      return;
    }

    if (!data?.sucesso) {

      mostrarMensagem(
        "❌ Não foi possível alterar o status."
      );

      return;
    }

    motorista.status =
      novoStatus;

    atualizarResumo();

    renderizarMotoristas();

    mostrarMensagem(
      `✅ ${motorista.nome} agora está ${nomes[novoStatus]}.`
    );
  }


  /* =========================================================
     ALTERAR SALÁRIO
  ========================================================= */

  async function alterarSalario(id, ativo) {

    const motorista =
      motoristas.find(m =>
        Number(m.id) === Number(id)
      );

    if (!motorista) {
      mostrarMensagem("Motorista não encontrado.");
      return;
    }

    const confirmou =
      confirm(
        `${ativo ? "Ativar" : "Desativar"} o salário de ${motorista.nome}?`
      );

    if (!confirmou) {
      return;
    }

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "definir_salario_ativo",
      {
        p_motorista_id: Number(id),
        p_ativo: Boolean(ativo)
      }
    );

    if (error) {

      console.error(error);

      mostrarMensagem(
        "❌ " + (error.message || "Não foi possível alterar o salário.")
      );

      return;
    }

    motorista.salario_ativo =
      Boolean(ativo);

    atualizarResumo();

    renderizarMotoristas();

    mostrarMensagem(
      ativo
        ? `✅ Salário ativado para ${motorista.nome}.`
        : `⚪ Salário desativado para ${motorista.nome}.`
    );
  }


  /* =========================================================
     MODAL STACOIN
  ========================================================= */

  function abrirModalStacoin(id, tipo) {

    const motorista =
      motoristas.find(m =>
        Number(m.id) === Number(id)
      );

    if (!motorista) {

      mostrarMensagem(
        "Motorista não encontrado."
      );

      return;
    }

    motoristaStacoinSelecionado =
      motorista;

    tipoStacoinSelecionado =
      tipo;

    const modal =
      document.getElementById("modalStacoin");

    const motoristaCampo =
      document.getElementById("stacoinMotorista");

    const valorCampo =
      document.getElementById("stacoinValor");

    const motivoCampo =
      document.getElementById("stacoinMotivo");

    const tipoElemento =
      document.getElementById("tipoOperacao");

    const botaoConfirmar =
      document.getElementById("btnConfirmarStacoin");

    motoristaCampo.value =
      `${motorista.nome} • ${motorista.codigo || "SEM ID"}`;

    valorCampo.value =
      "";

    motivoCampo.value =
      "";

    if (tipo === "entrada") {

      tipoElemento.className =
        "tipo-operacao tipo-entrada";

      tipoElemento.textContent =
        "➕ ADICIONAR STACOIN";

      botaoConfirmar.className =
        "btn-confirmar";

    } else {

      tipoElemento.className =
        "tipo-operacao tipo-saida";

      tipoElemento.textContent =
        "➖ RETIRAR STACOIN";

      botaoConfirmar.className =
        "btn-confirmar saida";
    }

    modal.style.display =
      "flex";

    setTimeout(() => {
      valorCampo.focus();
    }, 100);
  }


  function fecharModalStacoin() {

    document.getElementById(
      "modalStacoin"
    ).style.display = "none";

    motoristaStacoinSelecionado =
      null;

    tipoStacoinSelecionado =
      "entrada";
  }


  /* =========================================================
     CONFIRMAR STACOIN
  ========================================================= */

  async function confirmarStacoin() {

    if (!motoristaStacoinSelecionado) {

      mostrarMensagem(
        "❌ Nenhum motorista selecionado."
      );

      return;
    }

    const valorCampo =
      document.getElementById(
        "stacoinValor"
      );

    const motivoCampo =
      document.getElementById(
        "stacoinMotivo"
      );

    const valor =
      Number(valorCampo.value);

    const motivo =
      motivoCampo.value.trim();

    if (!Number.isInteger(valor) || valor <= 0) {

      mostrarMensagem(
        "❌ Informe um valor inteiro maior que zero."
      );

      valorCampo.focus();

      return;
    }

    if (!motivo) {

      mostrarMensagem(
        "❌ Informe o motivo da movimentação."
      );

      motivoCampo.focus();

      return;
    }

    const motorista =
      motoristaStacoinSelecionado;

    const tipo =
      tipoStacoinSelecionado;

    const sinal =
      tipo === "entrada"
        ? "+"
        : "-";

    const confirmou =
      confirm(
        `${sinal}${formatarNumero(valor)} STACOIN\n\n` +
        `Motorista: ${motorista.nome}\n` +
        `Motivo: ${motivo}\n\n` +
        `Confirmar movimentação?`
      );

    if (!confirmou) {
      return;
    }

    const botao =
      document.getElementById(
        "btnConfirmarStacoin"
      );

    botao.disabled = true;
    botao.textContent = "PROCESSANDO...";

    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "adm_alterar_stacoin",
        {
          p_motorista_id:
            Number(motorista.id),

          p_tipo:
            tipo,

          p_valor:
            valor,

          p_motivo:
            motivo
        }
      );

      if (error) {

        console.error(
          "Erro STACOIN:",
          error
        );

        mostrarMensagem(
          "❌ " +
          (
            error.message ||
            "Não foi possível alterar o STACOIN."
          ),
          5000
        );

        return;
      }

      if (!data?.sucesso) {

        mostrarMensagem(
          "❌ A movimentação não foi concluída.",
          5000
        );

        return;
      }

      /* ATUALIZA SALDO LOCAL */

      motorista.saldo_stacoin =
        Number(data.novo_saldo || 0);

      fecharModalStacoin();

      atualizarResumo();

      renderizarMotoristas();

      mostrarMensagem(
        `✅ ${sinal}${formatarNumero(valor)} STACOIN aplicado em ${motorista.nome}. Novo saldo: ${formatarNumero(data.novo_saldo)} STC.`,
        5000
      );

    } catch (erro) {

      console.error(erro);

      mostrarMensagem(
        "❌ " +
        (
          erro?.message ||
          "Erro inesperado ao alterar STACOIN."
        ),
        5000
      );

    } finally {

      botao.disabled = false;

      botao.textContent =
        "CONFIRMAR";
    }
  }


  /* =========================================================
     BUSCA
  ========================================================= */

  document
    .getElementById("busca")
    .addEventListener(
      "input",
      renderizarMotoristas
    );


  /* =========================================================
     FECHAR MODAL CLICANDO FORA
  ========================================================= */

  document
    .getElementById("modalStacoin")
    .addEventListener(
      "click",
      function(event) {

        if (event.target === this) {
          fecharModalStacoin();
        }

      }
    );


  /* =========================================================
     ESC FECHA MODAL
  ========================================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        const modal =
          document.getElementById(
            "modalStacoin"
          );

        if (modal.style.display === "flex") {
          fecharModalStacoin();
        }
      }

    }
  );


  /* =========================================================
     LOGIN / AUTH
  ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    function(event, session) {

      console.log(
        "Auth:",
        event,
        Boolean(session)
      );

      if (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION"
      ) {

        if (session) {
          iniciarPainel();
        }
      }

    }
  );


  /* =========================================================
     INICIAR
  ========================================================= */

  iniciarPainel();

</script>

</body>
</html>
