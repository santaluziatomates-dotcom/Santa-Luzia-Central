<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel ADM • Santa Luzia Central</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f3;
      color: #17321f;
      min-height: 100vh;
    }

    header {
      background: #176b3a;
      color: white;
      padding: 18px 16px 22px;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.10);
    }

    .topo {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .marca img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
      background: white;
      padding: 4px;
    }

    .marca h1 {
      font-size: 19px;
      line-height: 1.1;
    }

    .marca p {
      font-size: 11px;
      opacity: .85;
      margin-top: 4px;
    }

    .status-adm {
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    .voltar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 15px;
      padding: 9px 13px;
      background: white;
      color: #176b3a;
      border: 1px solid #dfe5df;
      border-radius: 11px;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .card-resumo {
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 15px;
      padding: 15px;
    }

    .card-resumo span {
      display: block;
      font-size: 10px;
      color: #708078;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .card-resumo strong {
      font-size: 22px;
      color: #176b3a;
    }

    .barra {
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 15px;
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    .busca {
      flex: 1;
      min-width: 180px;
      border: 1px solid #d9e1db;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    .busca:focus {
      border-color: #176b3a;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-atualizar {
      background: #176b3a;
      color: white;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
    }

    .btn-atualizar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .info {
      background: #edf7f0;
      border: 1px solid #cfe4d5;
      color: #176b3a;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 11px;
      line-height: 1.5;
    }

    .info-status {
      background: #fff8e8;
      border: 1px solid #ead9a9;
      color: #806000;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 11px;
      line-height: 1.5;
    }

    .info-stacoin {
      background: #fffaf0;
      border: 1px solid #ead8a8;
      color: #765b08;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 11px;
      line-height: 1.5;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .motorista {
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 17px;
      padding: 15px;
    }

    .motorista-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .identidade {
      min-width: 0;
    }

    .codigo {
      display: inline-block;
      color: #176b3a;
      background: #edf7f0;
      border: 1px solid #d2e7d8;
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .nome {
      font-size: 16px;
      font-weight: bold;
      color: #17321f;
    }

    .apelido {
      color: #6f7b73;
      font-size: 11px;
      margin-top: 3px;
    }

    .status {
      font-size: 9px;
      font-weight: bold;
      padding: 6px 8px;
      border-radius: 8px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .status.ativo {
      background: #e7f6eb;
      color: #17723b;
    }

    .status.pendente {
      background: #fff5df;
      color: #9a6a00;
    }

    .status.inativo {
      background: #fdeaea;
      color: #a52a2a;
    }

    .status.outro {
      background: #f0f2f1;
      color: #66716a;
    }

    .dados {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .dado {
      background: #f7f9f7;
      border-radius: 10px;
      padding: 9px;
    }

    .dado span {
      display: block;
      color: #7b877f;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .dado strong {
      font-size: 11px;
      color: #25392c;
      word-break: break-word;
    }

    /* STATUS */

    .status-box {
      margin-top: 12px;
      border-top: 1px solid #edf0ed;
      padding-top: 12px;
    }

    .status-box-titulo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .status-box-titulo strong {
      font-size: 12px;
    }

    .status-atual-texto {
      font-size: 9px;
      color: #7b877f;
    }

    .status-controles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .btn-status {
      min-height: 40px;
      padding: 9px 8px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: bold;
      border: 1px solid transparent;
      transition: .15s ease;
    }

    .btn-status.ativo {
      background: #e7f6eb;
      color: #17723b;
      border-color: #c9e8d1;
    }

    .btn-status.pendente {
      background: #fff5df;
      color: #9a6a00;
      border-color: #ead8a8;
    }

    .btn-status.inativo {
      background: #fdeaea;
      color: #a52a2a;
      border-color: #efcaca;
    }

    .btn-status.selecionado {
      box-shadow: inset 0 0 0 2px currentColor;
    }

    .btn-status:hover {
      filter: brightness(.97);
    }

    .btn-status:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* SALÁRIO */

    .salario-box {
      margin-top: 12px;
      border-top: 1px solid #edf0ed;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .salario-info strong {
      display: block;
      font-size: 12px;
    }

    .salario-info small {
      display: block;
      color: #7b877f;
      font-size: 9px;
      margin-top: 3px;
    }

    .btn-salario {
      min-width: 115px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }

    .btn-salario.ativo {
      background: #176b3a;
      color: white;
    }

    .btn-salario.inativo {
      background: #eef1ef;
      color: #58645c;
      border: 1px solid #dce2dd;
    }

    .btn-salario:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* STACOIN */

    .stacoin-box {
      margin-top: 12px;
      border-top: 1px solid #edf0ed;
      padding-top: 12px;
    }

    .stacoin-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .stacoin-titulo {
      font-size: 12px;
      font-weight: bold;
    }

    .stacoin-saldo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #a16b00;
      background: #fff8e8;
      border: 1px solid #ead9a9;
      border-radius: 9px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: bold;
    }

    .stacoin-acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-stacoin {
      min-height: 42px;
      border-radius: 10px;
      padding: 9px;
      font-size: 10px;
      font-weight: bold;
    }

    .btn-adicionar {
      background: #176b3a;
      color: white;
    }

    .btn-retirar {
      background: #fff0f0;
      color: #a52a2a;
      border: 1px solid #efcaca;
    }

    .btn-stacoin:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .vazio {
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #738078;
      font-size: 12px;
    }

    .carregando {
      text-align: center;
      padding: 30px;
      color: #68766d;
      font-size: 12px;
    }

    /* BLOQUEIO */

    .bloqueio {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #f3f6f3;
    }

    .bloqueio-card {
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 20px;
      padding: 28px 22px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(23,50,31,.07);
    }

    .bloqueio-icone {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .bloqueio-card h2 {
      font-size: 19px;
      margin-bottom: 8px;
      color: #17321f;
    }

    .bloqueio-card p {
      font-size: 12px;
      line-height: 1.5;
      color: #68766d;
      margin-bottom: 17px;
    }

    .btn-central {
      display: inline-block;
      text-decoration: none;
      background: #176b3a;
      color: white;
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      margin: 4px;
    }

    .btn-secundario {
      display: inline-block;
      text-decoration: none;
      background: white;
      color: #176b3a;
      border: 1px solid #d7e0d9;
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      margin: 4px;
    }

    .usuario-logado {
      margin-bottom: 15px;
      background: white;
      border: 1px solid #e0e7e1;
      border-radius: 13px;
      padding: 11px 13px;
      color: #68766d;
      font-size: 10px;
    }

    .usuario-logado strong {
      color: #176b3a;
    }

    .acoes-login {
      margin-top: 8px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #17321f;
      color: white;
      padding: 12px 15px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: bold;
      display: none;
      z-index: 1000;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    .toast.erro {
      background: #a52a2a;
    }

    /* MODAL STACOIN */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 2000;
    }

    .modal-overlay.aberto {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 19px;
      padding: 19px;
      box-shadow: 0 15px 50px rgba(0,0,0,.18);
    }

    .modal h2 {
      font-size: 17px;
      color: #17321f;
      margin-bottom: 5px;
    }

    .modal-subtitulo {
      font-size: 10px;
      color: #758178;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .campo-modal {
      margin-bottom: 12px;
    }

    .campo-modal label {
      display: block;
      font-size: 9px;
      font-weight: bold;
      color: #66736b;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .campo-modal input,
    .campo-modal textarea {
      width: 100%;
      border: 1px solid #d9e1db;
      border-radius: 10px;
      padding: 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .campo-modal textarea {
      min-height: 75px;
      resize: vertical;
    }

    .campo-modal input:focus,
    .campo-modal textarea:focus {
      border-color: #176b3a;
    }

    .modal-acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-modal {
      min-height: 42px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }

    .btn-confirmar {
      background: #176b3a;
      color: white;
    }

    .btn-confirmar.retirar {
      background: #a52a2a;
    }

    .btn-cancelar {
      background: #eef1ef;
      color: #58645c;
    }

    .btn-modal:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .saldo-modal {
      background: #fff8e8;
      border: 1px solid #ead9a9;
      color: #765b08;
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {

      .resumo {
        grid-template-columns: 1fr 1fr;
      }

      .resumo .card-resumo:last-child {
        grid-column: span 2;
      }

      .dados {
        grid-template-columns: repeat(2, 1fr);
      }

      .status-controles {
        grid-template-columns: repeat(3, 1fr);
      }

      .salario-box {
        align-items: stretch;
        flex-direction: column;
      }

      .btn-salario {
        width: 100%;
      }

      .status-adm {
        display: none;
      }
    }

    @media (max-width: 380px) {

      .status-controles {
        grid-template-columns: 1fr;
      }

      .motorista-topo {
        flex-direction: column;
      }

      .status {
        align-self: flex-start;
      }

      .stacoin-acoes {
        grid-template-columns: 1fr;
      }

      .modal-acoes {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

  <div id="app"></div>

  <div id="toast" class="toast"></div>

  <!-- MODAL STACOIN -->

  <div
    id="modalStacoin"
    class="modal-overlay"
  >

    <div class="modal">

      <h2 id="modalStacoinTitulo">
        STACOIN
      </h2>

      <div
        id="modalStacoinSubtitulo"
        class="modal-subtitulo"
      >
        Movimentação de STACOIN
      </div>

      <div
        id="modalSaldo"
        class="saldo-modal"
      >
        Saldo atual: 0 STACOIN
      </div>

      <div class="campo-modal">

        <label>
          Valor
        </label>

        <input
          id="stacoinValor"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="Ex: 100"
        >

      </div>

      <div class="campo-modal">

        <label>
          Motivo
        </label>

        <textarea
          id="stacoinMotivo"
          placeholder="Ex: Bonificação por destaque"
        ></textarea>

      </div>

      <div class="modal-acoes">

        <button
          id="btnCancelarStacoin"
          type="button"
          class="btn-modal btn-cancelar"
        >
          CANCELAR
        </button>

        <button
          id="btnConfirmarStacoin"
          type="button"
          class="btn-modal btn-confirmar"
        >
          CONFIRMAR
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       CONFIGURAÇÃO SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://cckypvqophyviphqhich.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_M_6iIpO4FNhxskWG0XXrA_Uwuw_bbP";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "implicit"
          }
        }
      );


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const app =
      document.getElementById("app");

    const toast =
      document.getElementById("toast");

    const modalStacoin =
      document.getElementById(
        "modalStacoin"
      );

    const stacoinValor =
      document.getElementById(
        "stacoinValor"
      );

    const stacoinMotivo =
      document.getElementById(
        "stacoinMotivo"
      );

    const modalSaldo =
      document.getElementById(
        "modalSaldo"
      );

    const modalTitulo =
      document.getElementById(
        "modalStacoinTitulo"
      );

    const modalSubtitulo =
      document.getElementById(
        "modalStacoinSubtitulo"
      );

    const btnConfirmarStacoin =
      document.getElementById(
        "btnConfirmarStacoin"
      );

    const btnCancelarStacoin =
      document.getElementById(
        "btnCancelarStacoin"
      );

    let motoristas = [];

    let motoristaStacoinAtual = null;

    let tipoStacoinAtual = null;


    /* =====================================================
       TOAST
       ===================================================== */

    function mostrarToast(
      mensagem,
      erro = false
    ) {

      toast.textContent = mensagem;

      toast.className =
        "toast" +
        (erro ? " erro" : "");

      toast.style.display =
        "block";

      setTimeout(() => {

        toast.style.display =
          "none";

      }, 3000);
    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(valor) {

      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================================
       FORMATAÇÃO
       ===================================================== */

    function formatarNumero(valor) {

      return Number(valor || 0)
        .toLocaleString("pt-BR");
    }


    /* =====================================================
       BLOQUEIO
       ===================================================== */

    function mostrarBloqueio(
      titulo,
      mensagem,
      mostrarLogin = false
    ) {

      app.innerHTML = `
        <div class="bloqueio">

          <div class="bloqueio-card">

            <div class="bloqueio-icone">
              ${mostrarLogin ? "🔐" : "⛔"}
            </div>

            <h2>
              ${escapeHtml(titulo)}
            </h2>

            <p>
              ${escapeHtml(mensagem)}
            </p>

            <div class="acoes-login">

              ${
                mostrarLogin
                  ? `
                    <a
                      href="index.html"
                      class="btn-central"
                    >
                      🔐 ENTRAR PELA CENTRAL
                    </a>
                  `
                  : ""
              }

              <a
                href="index.html"
                class="btn-secundario"
              >
                ← VOLTAR PARA A CENTRAL
              </a>

            </div>

          </div>

        </div>
      `;
    }


    /* =====================================================
       USUÁRIO LOGADO
       ===================================================== */

    async function mostrarUsuarioLogado(
      session
    ) {

      const email =
        session?.user?.email || "";

      const nome =
        session?.user?.user_metadata?.full_name ||
        session?.user?.user_metadata?.name ||
        "";

      const identificacao =
        nome
          ? `${nome} • ${email}`
          : email;

      const existente =
        document.getElementById(
          "usuarioLogado"
        );

      if (existente) {

        existente.innerHTML = `
          🔐 Conta conectada:
          <strong>
            ${escapeHtml(
              identificacao
            )}
          </strong>
        `;
      }
    }


    /* =====================================================
       INICIAR
       ===================================================== */

    async function iniciar() {

      app.innerHTML = `
        <div class="carregando">
          🔐 Verificando sua sessão...
        </div>
      `;


      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        mostrarBloqueio(
          "Erro de autenticação",
          error.message,
          false
        );

        return;
      }


      if (!session) {

        mostrarBloqueio(
          "Login necessário",
          "Entre primeiro na sua conta pela Santa Luzia Central. Depois volte ao Painel ADM.",
          true
        );

        return;
      }


      await mostrarUsuarioLogado(
        session
      );

          false
        );

        return;

      montarPainel();

      await carregarMotoristas();

    /* =====================================================
       CARREGAR MOTORISTAS
       ===================================================== */

    async function carregarMotoristas() {

      const lista =
        document.getElementById(
          "lista"
        );

      const atualizar =
        document.getElementById(
          "btnAtualizar"
        );


      if (lista) {

        lista.innerHTML = `
          <div class="carregando">
            🔄 Atualizando motoristas...
          </div>
        `;
      }


      if (atualizar) {

        atualizar.disabled = true;

        atualizar.textContent =
          "ATUALIZANDO...";
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "listar_motoristas_adm"
        );


      if (atualizar) {

        atualizar.disabled = false;

        atualizar.textContent =
          "↻ ATUALIZAR";
      }


      if (error) {

        console.error(
          "Erro listar_motoristas_adm:",
          error
        );


        if (lista) {

          lista.innerHTML = `
            <div class="vazio">

              ❌ Não foi possível
              carregar os motoristas.

              <br><br>

              ${escapeHtml(
                error.message
              )}

            </div>
          `;
        }

        return;
      }


      motoristas =
        Array.isArray(data)
          ? data
          : [];


      /* Busca saldos separadamente */

      const {
        data: saldos,
        error: erroSaldos
      } =
        await supabaseClient.rpc(
          "listar_saldos_stacoin_adm"
        );


      if (
        !erroSaldos &&
        Array.isArray(saldos)
      ) {

        saldos.forEach(
          saldo => {

            const motorista =
              motoristas.find(
                m =>
                  Number(m.id) ===
                  Number(
                    saldo.motorista_id
                  )
              );


            if (motorista) {

              motorista.saldo_stacoin =
                Number(
                  saldo.saldo || 0
                );
            }

          }
        );

      }


      /* Garante zero */

      motoristas.forEach(
        motorista => {

          motorista.saldo_stacoin =
            Number(
              motorista.saldo_stacoin || 0
            );

        }
      );


      atualizarResumo();

      renderizarMotoristas();
    }


    /* =====================================================
       RESUMO
       ===================================================== */

    function atualizarResumo() {

      const total =
        motoristas.length;


      const ativos =
        motoristas.filter(
          m =>
            m.salario_ativo === true
        ).length;


      const inativos =
        total - ativos;


      const totalEl =
        document.getElementById(
          "totalMotoristas"
        );


      const salarioEl =
        document.getElementById(
          "totalSalario"
        );


      const semSalarioEl =
        document.getElementById(
          "totalSemSalario"
        );


      if (totalEl) {

        totalEl.textContent =
          total;
      }


      if (salarioEl) {

        salarioEl.textContent =
          ativos;
      }


      if (semSalarioEl) {

        semSalarioEl.textContent =
          inativos;
      }
    }


    /* =====================================================
       STATUS
       ===================================================== */

    function classeDoStatus(status) {

      const valor =
        String(status || "")
          .trim()
          .toLowerCase();


      if (
        valor === "ativo" ||
        valor === "oficial" ||
        valor === "active"
      ) {
        return "ativo";
      }


      if (
        valor === "pendente"
      ) {
        return "pendente";
      }


      if (
        valor === "inativo"
      ) {
        return "inativo";
      }


      return "outro";
    }


    /* =====================================================
       RENDERIZAR
       ===================================================== */

    function renderizarMotoristas() {

      const lista =
        document.getElementById(
          "lista"
        );


      if (!lista) return;


      const campo =
        document.getElementById(
          "busca"
        );


      const busca =
        (campo?.value || "")
          .trim()
          .toLowerCase();


      const filtrados =
        motoristas.filter(
          m => {

            const texto = [

              m.codigo,
              m.nome,
              m.apelido,
              m.cargo,
              m.categoria

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return texto.includes(
              busca
            );
          }
        );


      if (!filtrados.length) {

        lista.innerHTML = `
          <div class="vazio">
            Nenhum motorista encontrado.
          </div>
        `;

        return;
      }


      lista.innerHTML =
        filtrados
          .map(
            criarCardMotorista
          )
          .join("");


      filtrados.forEach(
        m => {

          const botaoSalario =
            document.getElementById(
              `salario-${m.id}`
            );


          if (botaoSalario) {

            botaoSalario.addEventListener(
              "click",
              () =>
                alterarSalario(
                  m.id,
                  !m.salario_ativo
                )
            );

          }


          const botaoAtivo =
            document.getElementById(
              `status-ativo-${m.id}`
            );


          const botaoPendente =
            document.getElementById(
              `status-pendente-${m.id}`
            );


          const botaoInativo =
            document.getElementById(
              `status-inativo-${m.id}`
            );


          if (botaoAtivo) {

            botaoAtivo.addEventListener(
              "click",
              () =>
                alterarStatus(
                  m.id,
                  "ativo"
                )
            );

          }


          if (botaoPendente) {

            botaoPendente.addEventListener(
              "click",
              () =>
                alterarStatus(
                  m.id,
                  "pendente"
                )
            );

          }


          if (botaoInativo) {

            botaoInativo.addEventListener(
              "click",
              () =>
                alterarStatus(
                  m.id,
                  "inativo"
                )
            );

          }


          const adicionar =
            document.getElementById(
              `stacoin-adicionar-${m.id}`
            );


          const retirar =
            document.getElementById(
              `stacoin-retirar-${m.id}`
            );


          if (adicionar) {

            adicionar.addEventListener(
              "click",
              () =>
                abrirModalStacoin(
                  m.id,
                  "entrada"
                )
            );

          }


          if (retirar) {

            retirar.addEventListener(
              "click",
              () =>
                abrirModalStacoin(
                  m.id,
                  "saida"
                )
            );

          }

        }
      );
    }

    /* =====================================================
       ALTERAR STATUS
       ===================================================== */

    async function alterarStatus(
      motoristaId,
      novoStatus
    ) {

      const motorista =
        motoristas.find(
          m =>
            Number(m.id) ===
            Number(motoristaId)
        );


      if (!motorista) return;


      const nomesStatus = {

        ativo: "ATIVO",
        pendente: "PENDENTE",
        inativo: "INATIVO"

      };


      if (
        !confirm(
          `Alterar ${motorista.nome} para ${nomesStatus[novoStatus]}?`
        )
      ) {
        return;
      }


      const botoes = [

        document.getElementById(
          `status-ativo-${motoristaId}`
        ),

        document.getElementById(
          `status-pendente-${motoristaId}`
        ),

        document.getElementById(
          `status-inativo-${motoristaId}`
        )

      ];


      botoes.forEach(
        botao => {

          if (botao) {
            botao.disabled = true;
          }

        }
      );


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "definir_status_motorista",
          {
            p_motorista_id:
              motoristaId,

            p_status:
              novoStatus
          }
        );


      if (error) {

        console.error(
          "Erro definir_status_motorista:",
          error
        );

        mostrarToast(
          "Não foi possível alterar o status.",
          true
        );

        renderizarMotoristas();

        return;
      }


      if (
        !data ||
        data.sucesso !== true
      ) {

        mostrarToast(
          "O Supabase não confirmou a alteração.",
          true
        );

        renderizarMotoristas();

        return;
      }


      motorista.status =
        novoStatus;


      renderizarMotoristas();


      mostrarToast(
        `${motorista.nome} agora está ${nomesStatus[novoStatus]}.`
      );
    }


    /* =====================================================
       ALTERAR SALÁRIO
       ===================================================== */

    async function alterarSalario(
      motoristaId,
      novoStatus
    ) {

      const motorista =
        motoristas.find(
          m =>
            Number(m.id) ===
            Number(motoristaId)
        );


      if (!motorista) return;


      const mensagem =
        novoStatus
          ? `Ativar salário para ${motorista.nome}?`
          : `Desativar salário de ${motorista.nome}?`;


      if (!confirm(mensagem)) {
        return;
      }


      const botao =
        document.getElementById(
          `salario-${motoristaId}`
        );


      if (botao) {

        botao.disabled = true;

        botao.textContent =
          "SALVANDO...";
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "definir_salario_ativo",
          {
            p_motorista_id:
              motoristaId,

            p_ativo:
              novoStatus
          }
        );


      if (error) {

        console.error(
          "Erro definir_salario_ativo:",
          error
        );

        mostrarToast(
          "Não foi possível alterar o salário.",
          true
        );

        renderizarMotoristas();

        return;
      }


      if (
        !data ||
        data.sucesso !== true
      ) {

        mostrarToast(
          "O Supabase não confirmou a alteração.",
          true
        );

        renderizarMotoristas();

        return;
      }


      const encontrado =
        motoristas.find(
          m =>
            Number(m.id) ===
            Number(motoristaId)
        );


      if (encontrado) {

        encontrado.salario_ativo =
          novoStatus;
      }


      atualizarResumo();

      renderizarMotoristas();


      mostrarToast(
        novoStatus
          ? `${motorista.nome} agora está com salário ATIVO.`
          : `${motorista.nome} agora está com salário INATIVO.`
      );
    }


    /* =====================================================
       ABRIR MODAL STACOIN
       ===================================================== */

    function abrirModalStacoin(
      motoristaId,
      tipo
    ) {

      const motorista =
        motoristas.find(
          m =>
            Number(m.id) ===
            Number(motoristaId)
        );


      if (!motorista) return;


      motoristaStacoinAtual =
        motorista;

      tipoStacoinAtual =
        tipo;


      const saldo =
        Number(
          motorista.saldo_stacoin || 0
        );


      modalTitulo.textContent =
        tipo === "entrada"
          ? "➕ Adicionar STACOIN"
          : "➖ Retirar STACOIN";


      modalSubtitulo.textContent =
        tipo === "entrada"
          ? `Adicionar STACOIN para ${motorista.nome}.`
          : `Retirar STACOIN de ${motorista.nome}.`;


      modalSaldo.textContent =
        `Saldo atual: ${formatarNumero(saldo)} STACOIN`;


      stacoinValor.value =
        "";

      stacoinMotivo.value =
        "";


      btnConfirmarStacoin.className =
        "btn-modal btn-confirmar" +
        (
          tipo === "saida"
            ? " retirar"
            : ""
        );


      btnConfirmarStacoin.textContent =
        tipo === "entrada"
          ? "ADICIONAR"
          : "RETIRAR";


      modalStacoin.classList.add(
        "aberto"
      );


      setTimeout(() => {

        stacoinValor.focus();

      }, 100);
    }


    /* =====================================================
       FECHAR MODAL
       ===================================================== */

    function fecharModalStacoin() {

      modalStacoin.classList.remove(
        "aberto"
      );

      motoristaStacoinAtual =
        null;

      tipoStacoinAtual =
        null;

      btnConfirmarStacoin.disabled =
        false;
    }


    btnCancelarStacoin.addEventListener(
      "click",
      fecharModalStacoin
    );


    modalStacoin.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalStacoin
        ) {

          fecharModalStacoin();
        }

      }
    );


    /* =====================================================
       CONFIRMAR STACOIN
       ===================================================== */

    btnConfirmarStacoin.addEventListener(
      "click",
      movimentarStacoin
    );


    async function movimentarStacoin() {

      if (
        !motoristaStacoinAtual ||
        !tipoStacoinAtual
      ) {
        return;
      }


      const valor =
        Number(
          stacoinValor.value
        );


      const motivo =
        stacoinMotivo.value.trim();


      if (
        !Number.isFinite(valor) ||
        valor <= 0 ||
        !Number.isInteger(valor)
      ) {

        mostrarToast(
          "Digite um valor inteiro maior que zero.",
          true
        );

        stacoinValor.focus();

        return;
      }


      if (!motivo) {

        mostrarToast(
          "Informe o motivo da movimentação.",
          true
        );

        stacoinMotivo.focus();

        return;
      }


      const saldoAtual =
        Number(
          motoristaStacoinAtual.saldo_stacoin || 0
        );


      if (
        tipoStacoinAtual === "saida" &&
        valor > saldoAtual
      ) {

        mostrarToast(
          "Saldo STACOIN insuficiente.",
          true
        );

        return;
      }


      const acao =
        tipoStacoinAtual === "entrada"
          ? "adicionar"
          : "retirar";


      const confirmacao =
        tipoStacoinAtual === "entrada"
          ? `Adicionar ${formatarNumero(valor)} STACOIN para ${motoristaStacoinAtual.nome}?`
          : `Retirar ${formatarNumero(valor)} STACOIN de ${motoristaStacoinAtual.nome}?`;


      if (!confirm(confirmacao)) {
        return;
      }


      btnConfirmarStacoin.disabled =
        true;

      btnConfirmarStacoin.textContent =
        "SALVANDO...";


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "movimentar_stacoin_adm",
          {
            p_motorista_id:
              motoristaStacoinAtual.id,

            p_tipo:
              tipoStacoinAtual,

            p_valor:
              valor,

            p_motivo:
              motivo
          }
        );


      btnConfirmarStacoin.disabled =
        false;


      if (error) {

        console.error(
          "Erro movimentar STACOIN:",
          error
        );


        mostrarToast(
          error.message ||
          "Não foi possível movimentar STACOIN.",
          true
        );

        btnConfirmarStacoin.textContent =
          tipoStacoinAtual === "entrada"
            ? "ADICIONAR"
            : "RETIRAR";

        return;
      }


      if (
        !data ||
        data.sucesso !== true
      ) {

        mostrarToast(
          "O Supabase não confirmou a movimentação.",
          true
        );

        return;
      }


      /* Atualiza saldo local */

      motoristaStacoinAtual.saldo_stacoin =
        Number(
          data.novo_saldo || 0
        );


      const nome =
        motoristaStacoinAtual.nome;


      const novoSaldo =
        motoristaStacoinAtual.saldo_stacoin;


      fecharModalStacoin();

      renderizarMotoristas();


      mostrarToast(
        tipoStacoinAtual === "entrada"
          ? `+${formatarNumero(valor)} STACOIN adicionados para ${nome}. Saldo: ${formatarNumero(novoSaldo)}.`
          : `-${formatarNumero(valor)} STACOIN retirados de ${nome}. Saldo: ${formatarNumero(novoSaldo)}.`
      );
    }


    /* =====================================================
       SESSÃO
       ===================================================== */

    supabaseClient.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        console.log(
          "Auth:",
          event
        );


        if (
          event ===
          "SIGNED_OUT"
        ) {

          mostrarBloqueio(
            "Sessão encerrada",
            "Faça login novamente pela Santa Luzia Central.",
            true
          );

          return;
        }


        if (
          event ===
          "SIGNED_IN" &&
          session
        ) {

          await verificarADM();
        }

      }
    );


    /* =====================================================
       INICIAR
       ===================================================== */

    iniciar();

  </script>

</body>
</html>
