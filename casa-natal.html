
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casinha de Natal - Santa Luzia</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101b29;font-family:Arial,sans-serif}
#painel{
 position:fixed;top:14px;left:0;width:100%;z-index:5;
 text-align:center;color:white;pointer-events:none;
 text-shadow:0 2px 8px #000
}
#painel h1{font-size:21px;margin:0 0 5px;color:#fff}
#painel p{font-size:12px;margin:0;color:#dcebdc}
#ajuda{
 position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
 background:#10251edb;color:white;padding:10px 15px;
 border:1px solid #ffffff44;border-radius:20px;
 font-size:12px;white-space:nowrap;z-index:5
}
</style>
</head>
<body>
<div id="painel">
 <h1>🎄 NATAL SANTA LUZIA 🎄</h1>
 <p>Uma noite especial na nossa fazenda</p>
</div>
<div id="ajuda">Arraste para girar • Aperte para aproximar</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17283b);
scene.fog = new THREE.Fog(0x17283b, 18, 38);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
camera.position.set(9, 7, 12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 19;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xc7ddff, 0x34402e, 2));

const moonLight = new THREE.DirectionalLight(0xd9e8ff, 2.2);
moonLight.position.set(-7, 12, 6);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048,2048);
scene.add(moonLight);

function material(color, roughness=0.85){
 return new THREE.MeshStandardMaterial({color,roughness});
}
function box(w,h,d,x,y,z,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}
function cylinder(rt,rb,h,x,y,z,color,segments=8){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material(color));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

// Terreno nevado
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 material(0xe6eff4)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.08;
ground.receiveShadow=true;
scene.add(ground);

// Pequenas ondulações de neve
for(let i=0;i<22;i++){
 const mound=new THREE.Mesh(
  new THREE.SphereGeometry(1,12,8),
  material(0xf3f7fa)
 );
 mound.scale.set(1.4+Math.random()*1.5,0.18,1+Math.random());
 mound.position.set((Math.random()-.5)*25,0.02,(Math.random()-.5)*22);
 mound.receiveShadow=true;scene.add(mound);
}

// Casa de madeira
box(4.4,3.1,3.6,0,1.55,0,0x80502f);

// Tábuas decorativas da fachada
for(let y=.35;y<3.05;y+=.42){
 box(4.43,.045,.035,0,y,1.82,0x5a3525);
}

// Triângulo da frente da casa
const gableShape=new THREE.Shape();
gableShape.moveTo(-2.2,0);
gableShape.lineTo(2.2,0);
gableShape.lineTo(0,1.55);
gableShape.closePath();
const gable=new THREE.Mesh(
 new THREE.ShapeGeometry(gableShape),
 material(0x925c35)
);
gable.position.set(0,3.1,1.825);
gable.castShadow=true;scene.add(gable);

// Telhado vermelho em duas águas
const roof1=box(3.05,.24,4.15,-.95,3.92,0,0x9f2528);
roof1.rotation.z=-0.55;
const roof2=box(3.05,.24,4.15,.95,3.92,0,0x9f2528);
roof2.rotation.z=0.55;

// Beirais brancos de neve
const snow1=box(3.12,.13,4.22,-.95,4.07,0,0xf4f7f8);
snow1.rotation.z=-0.55;
const snow2=box(3.12,.13,4.22,.95,4.07,0,0xf4f7f8);
snow2.rotation.z=0.55;

// Cumeeira
box(.22,.2,4.3,0,4.75,0,0xf6f7f4);

// Chaminé
box(.55,1.35,.55,1.25,4.15,-.65,0x713c30);
box(.72,.18,.72,1.25,4.85,-.65,0xdfe8ed);

// Porta
box(1.05,2.05,.14,-.15,1.02,1.88,0x4a281e);
box(.88,1.88,.08,-.15,1.0,1.97,0x8b4b2b);
const knob=new THREE.Mesh(
 new THREE.SphereGeometry(.07,12,12),material(0xe6b84c)
);
knob.position.set(.2,1,2.04);scene.add(knob);

// Janelas e molduras
function windowAt(x,y,z){
 box(1.05,1.12,.12,x,y,z,0xf0e5cf);
 box(.83,.9,.07,x,y,z+.08,0x173e4a);
 box(.09,1,.08,x,y,z+.13,0xf4e7ca);
 box(.9,.09,.08,x,y,z+.13,0xf4e7ca);
 const glow=new THREE.PointLight(0xffbd58,2.2,5);
 glow.position.set(x,y,z+.4);scene.add(glow);
}
windowAt(-1.35,2.05,1.9);
windowAt(1.2,2.05,1.9);

// Guirlanda na fachada
const wreath=new THREE.Mesh(
 new THREE.TorusGeometry(.34,.09,8,24),
 material(0x245b35)
);
wreath.position.set(1.65,1.25,1.98);scene.add(wreath);
const bow= new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),material(0xb51f2a));
bow.position.set(1.65,1.62,2.0);scene.add(bow);

// Árvore de Natal
function tree(x,z,size=1){
 cylinder(.12,.18,.55,x,.28*size,z,0x68452d);
 for(let i=0;i<3;i++){
  const h=1.15*size;
  const cone=new THREE.Mesh(
   new THREE.ConeGeometry((.85-i*.17)*size,h,9),
   material(i===1?0x17613d:0x1d7548)
  );
  cone.position.set(x,(.75+i*.62)*size,z);
  cone.castShadow=true;scene.add(cone);
 }
 const star=new THREE.Mesh(
  new THREE.SphereGeometry(.14*size,10,10),
  new THREE.MeshStandardMaterial({color:0xffd34f,emissive:0x9a5b00,emissiveIntensity:1})
 );
 star.position.set(x,2.65*size,z);scene.add(star);
 for(let i=0;i<9;i++){
  const a=new THREE.Mesh(
   new THREE.SphereGeometry(.075*size,8,8),
   material([0xffd34f,0xc52d35,0x5bb9e8][i%3])
  );
  const angle=i*2.4;
  a.position.set(x+Math.cos(angle)*.55*size,(.9+(i%3)*.48)*size,z+Math.sin(angle)*.42*size);
  scene.add(a);
 }
}
tree(-3.5,1,1.25);
tree(3.6,1,1.3);
tree(-4,-3,.9);
tree(4,-3,.9);

// Caminho de pedras
for(let i=0;i<5;i++){
 const stone=new THREE.Mesh(
  new THREE.CylinderGeometry(.38,.42,.12,8),
  material(0x9caab0)
 );
 stone.position.set(-.15,.04,2.7+i*.75);
 stone.rotation.y=Math.random();
 scene.add(stone);
}

// Luzes coloridas na fachada
for(let i=0;i<13;i++){
 const x=-2+i*.34;
 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.075,10,10),
  new THREE.MeshStandardMaterial({
   color:[0xffd34f,0xff4c45,0x58d6a0][i%3],
   emissive:[0x9a5b00,0x8a0808,0x087044][i%3],
   emissiveIntensity:1.5
  })
 );
 bulb.position.set(x,3.2,1.98);scene.add(bulb);
}

// Flocos de neve
const snowCount=900;
const positions=new Float32Array(snowCount*3);
for(let i=0;i<snowCount;i++){
 positions[i*3]=(Math.random()-.5)*25;
 positions[i*3+1]=Math.random()*14;
 positions[i*3+2]=(Math.random()-.5)*25;
}
const snowGeometry=new THREE.BufferGeometry();
snowGeometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
const snowMaterial=new THREE.PointsMaterial({
 color:0xffffff,size:.075,transparent:true,opacity:.9
});
const snow=new THREE.Points(snowGeometry,snowMaterial);
scene.add(snow);

// Luz acolhedora na entrada
const entranceLight=new THREE.PointLight(0xffb64a,2.5,8);
entranceLight.position.set(0,2.8,3);scene.add(entranceLight);

// Animação
function animate(){
 requestAnimationFrame(animate);
 const p=snowGeometry.attributes.position.array;
 for(let i=0;i<snowCount;i++){
  p[i*3+1]-=.025;
  p[i*3]+=.003;
  if(p[i*3+1]<0){
   p[i*3+1]=14;
   p[i*3]=(Math.random()-.5)*25;
  }
 }
 snowGeometry.attributes.position.needsUpdate=true;
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
